/* =====================================================================
   CENA 13 — O fio de cargas
   ===================================================================== */
SIMS.fio = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 320);
  const CX = 320, YF = 250, ESP = 14;
  // na missão 2, P começa no centro (inclinação 0°); antes começava a 43°, já acima dos 20° pedidos
  const st = { n: m === 2 ? 9 : 11, x: m === 2 ? CX + 60 : m === 1 ? CX : CX + 120, y: m === 2 ? YF - 60 : 150 };
  const gC = S("g", {}, svg);
  const ref = S("line", { stroke: COR.cinza, "stroke-width": 1.5, "stroke-dasharray": "5 5" }, svg);
  const f = criarSeta(svg, "forca", 6);
  const P = criarCarga(svg, 10, 1, "P");
  const ler = H("div", "sim-leitura", root);
  function campo() {
    let fx = 0, fy = 0;
    for (let i = 0; i < st.n; i++) {
      const cx = CX + (i - (st.n - 1) / 2) * ESP, dx = st.x - cx, dy = st.y - YF, r3 = Math.hypot(dx, dy) ** 3;
      fx += dx / r3; fy += dy / r3;
    }
    return { fx, fy, incl: Math.atan2(Math.abs(fx), -fy) * 180 / Math.PI };
  }
  function desenhar() {
    gC.innerHTML = "";
    for (let i = 0; i < st.n; i++) S("circle", { cx: CX + (i - (st.n - 1) / 2) * ESP, cy: YF, r: 6, fill: COR.pos, stroke: "#fff", "stroke-width": 1 }, gC);
    const c = campo(), n = Math.hypot(c.fx, c.fy);
    P.em(st.x, st.y);
    ref.setAttribute("x1", st.x); ref.setAttribute("x2", st.x); ref.setAttribute("y1", st.y); ref.setAttribute("y2", st.y - 90);
    f.pos(st.x, st.y, st.x + c.fx / n * 80, st.y + c.fy / n * 80);
    ler.textContent = `Cargas no fio: ${st.n} · Inclinação da força em relação à perpendicular: ${fmtNum(c.incl, 1)}°`;
  }
  if (m < 2) arrastavel(P.g, svg, () => ({ x: st.x, y: st.y }), p => {
    st.x = lim(p.x, 40, 600); st.y = lim(p.y, 40, YF - 30);
    if (Math.abs(st.x - CX) < 6) st.x = CX;
    desenhar();
  });
  const sN = controle(root, { rot: "Número de cargas", min: 3, max: 41, passo: 2, valor: st.n, fmt: v => String(v), ao: v => { st.n = v; desenhar(); } });
  botaoVerificar(api, () => {
    const c = campo();
    if (m === 0) return c.incl < 2 ? true : `A força está inclinada ${fmtNum(c.incl, 1)}°. Procure o ponto em que cada carga da esquerda tem uma parceira à direita.`;
    if (m === 1) return c.incl > 20 ? true : `A inclinação está em ${fmtNum(c.incl, 1)}°. Leve P para além de uma das pontas do fio e mais perto dele.`;
    return c.incl < 3 ? true : `Com ${st.n} cargas, a inclinação em P é de ${fmtNum(c.incl, 1)}°. Aumente o fio para afastar as pontas.`;
  });
  desenhar();
  root._t = { resolver() {
    if (m === 0) { st.x = CX; st.y = 150; }
    if (m === 1) { st.x = CX + 100; st.y = YF - 40; }
    if (m === 2) { st.n = 41; sN.set(41); }
    desenhar();
  }, incl: () => campo().incl };
};

/* =====================================================================
   CAMPO ELÉTRICO — apoio comum
   ===================================================================== */
const COR_P = "#2A9D8F";
function campoDe(cargas, x, y) {
  let ex = 0, ey = 0;
  for (const c of cargas) {
    const dx = x - c.x, dy = y - c.y, r2 = Math.max(dx * dx + dy * dy, 144), r = Math.sqrt(r2);
    ex += c.q * dx / (r2 * r); ey += c.q * dy / (r2 * r);
  }
  return { x: ex, y: ey, mod: Math.hypot(ex, ey) };
}
const angTela = (vx, vy) => { const a = Math.atan2(-vy, vx) * 180 / Math.PI; return Math.abs(a) < 0.5 ? 0 : a; };
function gradeFundo(svg, alt) {
  for (let x = 40; x <= 600; x += 40) S("line", { x1: x, y1: 10, x2: x, y2: alt - 10, class: "sim-grade" }, svg);
  for (let y = 10; y <= alt - 10; y += 40) S("line", { x1: 40, y1: y, x2: 600, y2: y, class: "sim-grade" }, svg);
}
/* Linha de campo que passa por (x0, y0), integrada nos dois sentidos. */
function linhaCampo(campo, x0, y0, alt, parar) {
  const meia = dir => {
    const pts = [];
    let x = x0, y = y0;
    for (let i = 0; i < 400; i++) {
      const e = campo(x, y);
      if (!e.mod) break;
      x += dir * 5 * e.x / e.mod; y += dir * 5 * e.y / e.mod;
      if (x < 0 || x > 640 || y < 0 || y > alt || parar(x, y)) break;
      pts.push([x, y]);
    }
    return pts;
  };
  return [...meia(-1).reverse(), [x0, y0], ...meia(1)];
}
const proximoDe = (lista, x, y, d) => lista.some(p => Math.hypot(p.x - x, p.y - y) < d);

/* =====================================================================
   CAMPO 1 — O campo que já estava lá
   ===================================================================== */
SIMS.acaoDistancia = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 340);
  const Q2 = { x: 400, y: 170, q: 1 };
  const st = { x: 200, y: 250, campo: m > 0, fora: false, dist: 0 };
  const gCampo = S("g", {}, svg);
  for (let x = 40; x <= 600; x += 56) for (let y = 30; y <= 310; y += 56) {
    if (Math.hypot(x - Q2.x, y - Q2.y) < 40) continue;
    const e = campoDe([Q2], x, y), L = lim(2.2e5 * e.mod, 9, 26), ux = e.x / e.mod, uy = e.y / e.mod;
    criarSeta(gCampo, "campo", 2).pos(x - ux * L / 2, y - uy * L / 2, x + ux * L / 2, y + uy * L / 2);
  }
  const f = criarSeta(svg, "forca", 5);
  const c2 = criarCarga(svg, 17, 1, "q₂"), c1 = criarCarga(svg, 12, 1, "q₁");
  c2.em(Q2.x, Q2.y);
  const ler = H("div", "sim-leitura", root);
  const angulo = () => { const e = campoDe([Q2], st.x, st.y); return angTela(e.x, e.y); };
  function desenhar() {
    gCampo.style.display = st.campo ? "" : "none";
    c1.g.style.display = st.fora ? "none" : "";
    c1.em(st.x, st.y);
    const e = campoDe([Q2], st.x, st.y), L = lim(4e5 * e.mod, 16, 110);
    if (st.fora) f.pos(0, 0, 0, 0); else f.pos(st.x, st.y, st.x + e.x / e.mod * L, st.y + e.y / e.mod * L);
    ler.textContent = st.fora ? "q₁ foi retirada. As setas azuis mostram o campo de q₂ em cada ponto do espaço."
      : `Força sobre q₁: ângulo ${fmtNum(angulo(), 0)}° · Setas do campo de q₂: ${st.campo ? "visíveis" : "ocultas"}`;
    if (m === 0 && st.campo && st.dist >= 400) api.ok();
  }
  arrastavel(c1.g, svg, () => ({ x: st.x, y: st.y }), p => {
    const nx = lim(p.x, 30, 610), ny = lim(p.y, 20, 320);
    st.dist += Math.hypot(nx - st.x, ny - st.y); st.x = nx; st.y = ny; desenhar();
  });
  const eC = escolha(root, "Campo de q₂", [["off", "Oculto"], ["on", "Visível"]], st.campo ? "on" : "off", v => { st.campo = v === "on"; desenhar(); });
  const rapida = m === 1 ? perguntaRapida(api, "Com q₁ fora da cena, o campo de q₂ continua existindo no espaço?", [
    ["Sim", true, ""], ["Não", false, "Olhe as setas azuis: elas continuam no lugar mesmo sem q₁ por perto."]]) : null;
  const eQ = escolha(root, "Carga q₁", [["in", "Na cena"], ["out", "Retirada"]], "in", v => { st.fora = v === "out"; desenhar(); if (rapida && st.fora) rapida.mostrar(); });
  if (m === 0) botaoVerificar(api, () => (st.campo && st.dist >= 400 ? true : !st.campo ? "Ligue as setas em \"Campo de q₂\"." : "Arraste q₁ por mais regiões do plano, observando a seta amarela."));
  if (m === 2) botaoVerificar(api, () => {
    if (st.fora) return "Recoloque q₁ na cena.";
    const a = angulo();
    return Math.abs(Math.abs(a) - 180) <= 8 ? true : `A força está a ${fmtNum(a, 0)}°. O campo de q₂ aponta para longe dela: de que lado q₁ precisa ficar?`;
  });
  desenhar();
  root._t = { resolver() {
    if (m === 0) { st.campo = true; eC.set("on"); st.dist = 500; }
    if (m === 1) { st.fora = true; eQ.set("out"); rapida.mostrar(); }
    if (m === 2) { st.x = 200; st.y = 170; }
    desenhar();
  } };
};

/* =====================================================================
   CAMPO 2 — Medidor de campo (E = F/q0)
   ===================================================================== */
SIMS.cargaProva = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 340);
  const QX = 140, QY = 170, ESC = 6;                                   // 6 px = 1 cm
  const st = { x: m === 1 ? 440 : 320, y: m === 1 ? 250 : 170, q0: 1, marcas: [] };
  const dist = () => Math.hypot(st.x - QX, st.y - QY);
  const campo = () => K_COULOMB * 30e-9 / (dist() / ESC / 100) ** 2;    // N/C
  gradeFundo(svg, 340);
  const gM = S("g", {}, svg);
  const sE = criarSeta(svg, "campo", 5), sF = criarSeta(svg, "forca", 5);
  const cQ = criarCarga(svg, 18, 1, "30 nC"), c0 = criarCarga(svg, 10, 1, "q₀");
  cQ.em(QX, QY);
  const ler = H("div", "sim-leitura", root);
  const distintas = () => { const v = []; st.marcas.forEach(p => { if (!proximoDe(v, p.x, p.y, 40)) v.push(p); }); return v.length; };
  function desenhar() {
    const d = dist(), ux = (st.x - QX) / d, uy = (st.y - QY) / d, E = campo(), F = st.q0 * 1e-9 * E;
    c0.em(st.x, st.y); c0.raio(8 + st.q0);
    const LE = lim(E / 40, 12, 120), LF = lim(F * 1e6 * 18, 10, 150);
    sE.pos(st.x - uy * 9, st.y + ux * 9, st.x - uy * 9 + ux * LE, st.y + ux * 9 + uy * LE);
    sF.pos(st.x + uy * 9, st.y - ux * 9, st.x + uy * 9 + ux * LF, st.y - ux * 9 + uy * LF);
    ler.textContent = `q₀ = ${st.q0} nC · F = ${fmtNum(F * 1e6, 2)} μN (amarelo) · E = F/q₀ = ${fmtSci(E, 2)} N/C (azul) · distância: ${fmtNum(d / ESC, 1)} cm`;
  }
  arrastavel(c0.g, svg, () => ({ x: st.x, y: st.y }), p => {
    st.x = lim(p.x, 40, 610); st.y = lim(p.y, 20, 320);
    if (dist() < 42) { const d = dist() || 1; st.x = QX + (st.x - QX) / d * 42; st.y = QY + (st.y - QY) / d * 42; }
    desenhar();
  });
  function marcar() {
    const d = dist(), ux = (st.x - QX) / d, uy = (st.y - QY) / d, L = lim(campo() / 40, 12, 120);
    criarSeta(gM, "campo", 3).pos(st.x, st.y, st.x + ux * L, st.y + uy * L);
    S("circle", { cx: st.x, cy: st.y, r: 3, fill: COR.pos }, gM);
    st.marcas.push({ x: st.x, y: st.y });
    if (m === 2 && distintas() >= 6) api.ok();
  }
  const rapida = m === 0 ? perguntaRapida(api, "Ao dobrar a carga de prova, o campo E = F/q₀ nesse ponto:", [
    ["Dobrou", false, "A força dobrou, mas o campo é a força dividida por q₀. Compare o valor de E no painel antes e depois."],
    ["Não mudou", true, ""],
    ["Caiu pela metade", false, "q₀ dobrou, mas a força dobrou junto: a razão F/q₀ ficou igual."]]) : null;
  const sq = controle(root, { rot: "Carga de prova q₀", min: 1, max: 5, passo: 1, valor: 1, fmt: v => v + " nC", ao: v => { st.q0 = v; desenhar(); if (rapida && v === 2) rapida.mostrar(); } });
  const linha = H("div", "sim-escolha", root);
  H("span", "nome", linha, "Mapa do campo");
  botaoSim(linha, "Marcar o vetor aqui", marcar, "");
  if (m === 1) botaoVerificar(api, () => {
    const E = campo();
    return E >= 2850 && E <= 3150 ? true : `O campo aqui é ${fmtSci(E, 2)} N/C. ${E < 3000 ? "Aproxime a carga de prova da carga de 30 nC." : "Afaste a carga de prova."}`;
  });
  if (m === 2) botaoVerificar(api, () => (distintas() >= 6 ? true : `Você marcou ${distintas()} pontos diferentes. Arraste q₀ para outro lugar e marque de novo, até 6.`));
  desenhar();
  root._t = { resolver() {
    if (m === 0) { st.q0 = 2; sq.set(2); rapida.mostrar(); }
    if (m === 1) { st.x = QX + 180; st.y = QY; }
    if (m === 2) [[260, 80], [380, 100], [500, 170], [420, 260], [280, 280], [560, 60]].forEach(([x, y]) => { st.x = x; st.y = y; marcar(); });
    desenhar();
  } };
};

/* =====================================================================
   CAMPO 3 — Trace as linhas
   ===================================================================== */
SIMS.linhasCampo = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 340);
  const cargas = m === 0 ? [{ x: 320, y: 170, q: -1 }] : m === 1 ? [{ x: 210, y: 170, q: 1 }, { x: 430, y: 170, q: 1 }] : [];
  const campo = (x, y) => (m === 2 ? { x: 1, y: 0, mod: 1 } : campoDe(cargas, x, y));
  const parar = (x, y) => (m === 2 ? x < 94 : proximoDe(cargas, x, y, 15));
  const st = { x: m === 1 ? 320 : 480, y: m === 1 ? 70 : 90, inicios: [], dist: 0 };
  gradeFundo(svg, 340);
  const gL = S("g", {}, svg);
  if (m === 2) {
    S("rect", { x: 70, y: 14, width: 22, height: 312, rx: 4, fill: "#E6B8B2", stroke: COR.pos }, svg);
    for (let y = 34; y <= 310; y += 34) { const t = S("text", { x: 81, y: y + 6, "text-anchor": "middle", class: "sim-ion" }, svg); t.textContent = "+"; }
  }
  const sE = criarSeta(svg, "campo", 5);
  cargas.forEach(c => criarCarga(svg, 16, c.q, "").em(c.x, c.y));
  const P = criarCarga(svg, 9, 1, "P");
  const ler = H("div", "sim-leitura", root);
  const partes = () => cargas.reduce((s, c) => s + campoDe([c], st.x, st.y).mod, 0);
  function desenhar() {
    const e = campo(st.x, st.y), L = m === 2 ? 60 : lim(4e5 * e.mod, 0, 110);
    P.em(st.x, st.y);
    if (e.mod) sE.pos(st.x, st.y, st.x + e.x / e.mod * L, st.y + e.y / e.mod * L); else sE.pos(0, 0, 0, 0);
    const nulo = m === 1 && e.mod / partes() < 0.1;
    ler.textContent = `Linhas traçadas: ${st.inicios.length} · Campo no ponto de prova: ${nulo ? "praticamente zero" : "ângulo " + fmtNum(angTela(e.x, e.y), 0) + "°"}`;
  }
  function tracar() {
    const pts = linhaCampo(campo, st.x, st.y, 340, parar);
    if (pts.length < 3) return;
    S("path", { d: pts.map((p, i) => `${i ? "L" : "M"} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" "), fill: "none", stroke: COR.campo, "stroke-width": 2 }, gL);
    const k = Math.floor(pts.length / 2), a = pts[Math.max(k - 1, 0)], b = pts[Math.min(k + 1, pts.length - 1)];
    criarSeta(gL, "campo", 2).pos(a[0], a[1], b[0], b[1]);
    if (!proximoDe(st.inicios, st.x, st.y, 30)) st.inicios.push({ x: st.x, y: st.y });
    desenhar();
    if (m === 0 && st.inicios.length >= 4) api.ok();
  }
  const rapida = m === 2 ? perguntaRapida(api, "Enquanto você arrastava o ponto de prova, o vetor campo mudou de tamanho ou de direção?", [
    ["Mudou", false, "Arraste de novo olhando só para a seta azul: ela fica igual em todos os pontos."], ["Não mudou", true, ""]]) : null;
  arrastavel(P.g, svg, () => ({ x: st.x, y: st.y }), p => {
    const nx = lim(p.x, m === 2 ? 110 : 30, 610), ny = lim(p.y, 20, 320);
    st.dist += Math.hypot(nx - st.x, ny - st.y); st.x = nx; st.y = ny; desenhar();
    if (rapida && st.dist >= 300) rapida.mostrar();
  });
  const linha = H("div", "sim-escolha", root);
  H("span", "nome", linha, "Linha de campo");
  botaoSim(linha, "Traçar linha por aqui", tracar, "");
  if (m === 0) botaoVerificar(api, () => (st.inicios.length >= 4 ? true : `Você traçou linhas a partir de ${st.inicios.length} pontos diferentes. Arraste o ponto de prova e trace até 4.`));
  if (m === 1) botaoVerificar(api, () => (campo(st.x, st.y).mod / partes() < 0.1 ? true : "O campo aqui ainda não é zero. Procure o ponto em que os campos das duas cargas são iguais e opostos."));
  desenhar();
  root._t = { resolver() {
    if (m === 0) [[480, 90], [160, 90], [160, 260], [480, 260]].forEach(([x, y]) => { st.x = x; st.y = y; tracar(); });
    if (m === 1) { st.x = 320; st.y = 170; }
    if (m === 2) { st.dist = 400; rapida.mostrar(); }
    desenhar();
  } };
};

/* =====================================================================
   CAMPO 4 — Campo sob medida (carga pontual)
   ===================================================================== */
SIMS.cargaPontual = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 340);
  const CX = 320, CY = 170, ESC = 8;                                    // 8 px = 1 cm
  const st = { q: m === 2 ? 3 : 2, s: 1, x: m === 0 ? CX + 80 : CX + 120, y: m === 0 ? CY : CY + 60 };
  [10, 20, 30].forEach(c => {
    S("circle", { cx: CX, cy: CY, r: c * ESC, fill: "none", stroke: COR.cinza, "stroke-width": 1, "stroke-dasharray": "4 5" }, svg);
    texto(svg, CX + c * ESC * 0.7071 + 4, CY - c * ESC * 0.7071 - 4, c + " cm", "sim-txt");
  });
  const sE = criarSeta(svg, "campo", 5);
  const cQ = criarCarga(svg, 16, 1, ""), P = criarCarga(svg, 8, 0, "P");
  cQ.em(CX, CY);
  const ler = H("div", "sim-leitura", root);
  function estado() {
    const d = Math.hypot(st.x - CX, st.y - CY), E = 8.99 * st.q / (d / ESC / 100) ** 2;
    const ux = st.s * (st.x - CX) / d, uy = st.s * (st.y - CY) / d;
    return { d, E, ux, uy, ang: angTela(ux, uy) };
  }
  function desenhar() {
    const e = estado(), L = lim(e.E / 12, 12, 130);
    cQ.sinal(st.s); cQ.rotulo(`${st.s > 0 ? "+" : "−"}${fmtNum(st.q, 1)} nC`);
    P.em(st.x, st.y);
    sE.pos(st.x, st.y, st.x + e.ux * L, st.y + e.uy * L);
    ler.textContent = `Distância: ${fmtNum(e.d / ESC, 1)} cm · Campo em P: ${fmtNum(e.E, 0)} N/C · ângulo ${fmtNum(e.ang, 0)}°`;
  }
  arrastavel(P.g, svg, () => ({ x: st.x, y: st.y }), p => {
    st.x = CX + Math.round((lim(p.x, 30, 610) - CX) / 4) * 4; st.y = CY + Math.round((lim(p.y, 20, 320) - CY) / 4) * 4;
    if (Math.hypot(st.x - CX, st.y - CY) < 32) st.x = CX + (st.x >= CX ? 32 : -32);
    desenhar();
  });
  const eS = escolha(root, "Sinal da carga", [["1", "Positiva"], ["-1", "Negativa"]], "1", v => { st.s = +v; desenhar(); });
  const sQ = controle(root, { rot: "Valor da carga", min: 0.5, max: 5, passo: 0.5, valor: st.q, fmt: v => fmtNum(v, 1) + " nC", ao: v => { st.q = v; desenhar(); } });
  botaoVerificar(api, () => {
    const e = estado();
    if (m === 0) {
      if (st.q !== 2 || st.s < 0) return "Mantenha a carga em +2,0 nC e mude só a posição de P.";
      return Math.abs(e.E - 449.5) <= 18 ? true : `O campo está em ${fmtNum(e.E, 0)} N/C; um quarto de 1798 é cerca de 450. ${e.E > 450 ? "Afaste P." : "Aproxime P."}`;
    }
    if (m === 1) {
      if (st.s > 0) return "Troque o sinal da carga para negativo.";
      return Math.abs(e.ang) <= 6 ? true : `O campo está a ${fmtNum(e.ang, 0)}°. Ele aponta para a carga negativa: onde P precisa ficar para a seta apontar para a direita?`;
    }
    if (Math.abs(e.ang - 90) > 6) return `O campo está a ${fmtNum(e.ang, 0)}°. Para apontar para cima, P precisa ficar acima de uma carga positiva ou abaixo de uma negativa.`;
    return Math.abs(e.E - 900) <= 27 ? true : `A direção está certa, mas o campo vale ${fmtNum(e.E, 0)} N/C. Ajuste o valor da carga ou a distância.`;
  });
  desenhar();
  root._t = { resolver() {
    if (m === 0) { st.x = CX + 160; st.y = CY; }
    if (m === 1) { st.s = -1; eS.set("-1"); st.x = CX - 120; st.y = CY; }
    if (m === 2) { st.q = 1; sQ.set(1); st.x = CX; st.y = CY - 80; }
    desenhar();
  } };
};

/* =====================================================================
   CAMPO 5 — Três cargas, um ponto (Exemplo 22.01)
   ===================================================================== */
SIMS.tresCampos = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 340);
  const OX = 290, OY = 180, D = 125, U = 27, ANG = [150, -30, 30];
  const st = { q: m === 0 ? [1, 1, 1] : m === 1 ? [2, 1, -1] : [1, -1, 1] };
  const un = a => [Math.cos(a * Math.PI / 180), Math.sin(a * Math.PI / 180)];
  S("line", { x1: 60, y1: OY, x2: 600, y2: OY, stroke: COR.cinza, "stroke-width": 1.5 }, svg);
  S("line", { x1: OX, y1: 14, x2: OX, y2: 326, stroke: COR.cinza, "stroke-width": 1.5 }, svg);
  texto(svg, 596, OY - 6, "x", "sim-txt", "end"); texto(svg, OX + 8, 26, "y", "sim-txt");
  const cs = ANG.map(a => {
    const [ux, uy] = un(a), x = OX + D * ux, y = OY - D * uy;
    S("line", { x1: OX, y1: OY, x2: x, y2: y, stroke: COR.cinza, "stroke-width": 1.2, "stroke-dasharray": "5 5" }, svg);
    const c = criarCarga(svg, 15, 1, ""); c.em(x, y);
    return c;
  });
  texto(svg, OX - 64, OY - 44, "d", "sim-txt");
  const vs = [0, 1, 2].map(() => criarSeta(svg, "campo", 4)), vR = criarSeta(svg, "forca", 6);
  S("circle", { cx: OX, cy: OY, r: 4, fill: COR.cinza }, svg);
  const ler = H("div", "sim-leitura", root);
  function total() {
    let ex = 0, ey = 0;
    const partes = ANG.map((a, i) => { const [ux, uy] = un(a); const p = [-st.q[i] * ux, -st.q[i] * uy]; ex += p[0]; ey += p[1]; return p; });
    const mod = Math.hypot(ex, ey);
    return { partes, ex, ey, mod, ang: mod < 0.01 ? 0 : angTela(ex, -ey) };
  }
  const rot = v => (v > 0 ? "+" : v < 0 ? "−" : "") + (Math.abs(v) === 1 ? "" : Math.abs(v)) + (v ? "Q" : "");
  function desenhar() {
    const t = total();
    cs.forEach((c, i) => { c.sinal(st.q[i]); c.rotulo(`q${"₁₂₃"[i]} = ${rot(st.q[i])}`); });
    t.partes.forEach((p, i) => vs[i].pos(OX, OY, OX + p[0] * U, OY - p[1] * U));
    vR.pos(OX, OY, OX + t.ex * U, OY - t.ey * U);
    ler.textContent = `Campo na origem: ${fmtNum(t.mod, 2)} × Q/(4πε₀d²)${t.mod < 0.01 ? "" : " · ângulo " + fmtNum(t.ang, 0) + "°"} · azul: campo de cada carga; amarelo: soma`;
  }
  const fq = v => rot(v) || "0";
  const sl = [0, 1, 2].map(i => controle(root, { rot: "Carga q" + "₁₂₃"[i], min: -4, max: 4, passo: 1, valor: st.q[i], fmt: fq, ao: v => { st.q[i] = v; desenhar(); } }));
  botaoVerificar(api, () => {
    const t = total();
    if (m === 0) return st.q[0] === 2 && st.q[1] === -2 && st.q[2] === -4 ? true : "Use as barras para deixar q₁ = +2Q, q₂ = −2Q e q₃ = −4Q.";
    if (m === 1) {
      if (st.q.every(v => v === 0)) return "Sem carga nenhuma não vale: deixe ao menos uma carga diferente de zero.";
      return t.mod < 0.01 ? true : "O campo ainda não é zero. q₁ e q₂ estão em lados opostos da origem: quando os campos delas se cancelam? E q₃, tem alguma carga oposta a ela?";
    }
    return t.mod > 0.1 && Math.abs(t.ang - 90) <= 5 ? true : `A soma está a ${fmtNum(t.ang, 0)}°. Para apontar para cima, os componentes x precisam se cancelar.`;
  });
  desenhar();
  root._t = { resolver() {
    st.q = m === 0 ? [2, -2, -4] : m === 1 ? [3, 3, 0] : [0, 2, -2];
    sl.forEach((s, i) => s.set(st.q[i])); desenhar();
  } };
};

/* =====================================================================
   CAMPO 6 — Dipolo no eixo
   ===================================================================== */
SIMS.dipoloEixo = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 340);
  const AX = 200, CYD = 292, ESC = 8;                                   // 8 px = 1 cm, z para cima
  const ini = { q: 1, d: 2, z: m === 0 ? 10 : 20 };
  const st = { ...ini, inv: false };
  const Ez = (q, d, z) => q * (1 / (z - d / 2) ** 2 - 1 / (z + d / 2) ** 2);
  const E0 = Ez(ini.q, ini.d, ini.z);
  S("line", { x1: AX, y1: 20, x2: AX, y2: 330, stroke: COR.cinza, "stroke-width": 1.5, "stroke-dasharray": "5 5" }, svg);
  for (let c = 10; c <= 30; c += 10) {
    S("line", { x1: AX - 8, y1: CYD - c * ESC, x2: AX + 8, y2: CYD - c * ESC, stroke: COR.cinza, "stroke-width": 1.5 }, svg);
    texto(svg, AX - 14, CYD - c * ESC + 5, c + " cm", "sim-txt", "end");
  }
  const sp = S("line", { stroke: COR_P, "stroke-width": 5, "stroke-linecap": "round" }, svg);
  const tp = texto(svg, 0, 0, "p", "sim-txt forte");
  const sM = criarSeta(svg, "campo", 4), sN = criarSeta(svg, "campo", 4), sR = criarSeta(svg, "forca", 6);
  const cA = criarCarga(svg, 11, 1, ""), cB = criarCarga(svg, 11, -1, ""), P = criarCarga(svg, 8, 0, "P");
  texto(svg, 330, 40, "azul: campo de cada carga", "sim-txt"); texto(svg, 330, 62, "amarelo: campo total (ampliado)", "sim-txt");
  const tE = texto(svg, 330, 110, "", "sim-txt forte"), tQ = texto(svg, 330, 134, "", "sim-txt");
  const ler = H("div", "sim-leitura", root);
  const razao = () => Ez(st.q, st.d, st.z) / E0;
  function desenhar() {
    const s = st.inv ? -1 : 1, yP = CYD - st.z * ESC, h = st.d / 2 * ESC;
    cA.em(AX, CYD - s * h); cB.em(AX, CYD + s * h);
    cA.raio(6 + st.q); cB.raio(6 + st.q);
    P.em(AX, yP);
    const a = lim(3000 * st.q / (st.z - st.d / 2) ** 2, 4, 90), b = lim(3000 * st.q / (st.z + st.d / 2) ** 2, 4, 90);
    sM.pos(AX - 12, yP, AX - 12, yP - s * a); sN.pos(AX + 12, yP, AX + 12, yP + s * b);
    sR.pos(AX + 34, yP, AX + 34, yP - s * lim((a - b) * 3, 6, 100));
    sp.setAttribute("x1", AX + 40); sp.setAttribute("x2", AX + 40); sp.setAttribute("y1", CYD + s * (h + 10)); sp.setAttribute("y2", CYD - s * (h + 10));
    tp.setAttribute("x", AX + 50); tp.setAttribute("y", CYD - s * (h + 6));
    tp.textContent = s > 0 ? "p ↑" : "p ↓";
    tE.textContent = `E / E₀ = ${fmtNum(razao(), 3)}`;
    tQ.textContent = `produto q·d = ${fmtNum(st.q * st.d, 1)} (unidades)`;
    ler.textContent = `Distância de P ao centro: z = ${fmtNum(st.z, 1)} cm · q = ${st.q} · d = ${fmtNum(st.d, 1)} cm · campo total em P aponta para ${s > 0 ? "cima" : "baixo"}`;
  }
  if (m !== 1) arrastavel(P.g, svg, () => ({ x: AX, y: CYD - st.z * ESC }), p => { st.z = Math.round(lim((CYD - p.y) / ESC, st.d / 2 + 2, 32) * 2) / 2; desenhar(); });
  const r1 = m === 1 ? perguntaRapida(api, "Com q dobrado e d pela metade, o campo em P (longe do dipolo):", [
    ["Dobrou", false, "q dobrou, mas d caiu pela metade. Veja o valor de E/E₀ no painel."],
    ["Quase não mudou", true, ""],
    ["Caiu pela metade", false, "d caiu pela metade, mas q dobrou. Veja o valor de E/E₀ no painel."]]) : null;
  const r2 = m === 2 ? perguntaRapida(api, "Depois de inverter o dipolo, o campo em P aponta no mesmo sentido do momento dipolar p?", [
    ["Sim", true, ""], ["Não", false, "Compare a seta amarela em P com o sentido de p ao lado do dipolo."]]) : null;
  const checar = () => { if (r1 && st.q === 2 && st.d === 1) r1.mostrar(); };
  const sq = controle(root, { rot: "Carga q", min: 1, max: 4, passo: 1, valor: st.q, fmt: v => v + " (unid.)", ao: v => { st.q = v; desenhar(); checar(); } });
  const sd = controle(root, { rot: "Separação d", min: 1, max: 4, passo: 0.5, valor: st.d, fmt: v => fmtNum(v, 1) + " cm", ao: v => { st.d = v; st.z = Math.max(st.z, v / 2 + 2); desenhar(); checar(); } });
  const linha = H("div", "sim-escolha", root);
  H("span", "nome", linha, "Orientação");
  botaoSim(linha, "Inverter o dipolo", () => { st.inv = !st.inv; desenhar(); if (r2) r2.mostrar(); }, "");
  if (m === 0) botaoVerificar(api, () => {
    if (st.q !== ini.q || st.d !== ini.d) return "Volte q para 1 e d para 2,0 cm e mude só a posição de P.";
    const r = razao();
    return r >= 0.115 && r <= 0.135 ? true : `O campo está em ${fmtNum(r, 3)} do inicial; um oitavo é 0,125. ${r > 0.125 ? "Afaste P." : "Aproxime P."}`;
  });
  desenhar();
  root._t = { resolver() {
    if (m === 0) st.z = 20;
    if (m === 1) { st.q = 2; st.d = 1; sq.set(2); sd.set(1); r1.mostrar(); }

/* =====================================================================

/* =====================================================================

/* =====================================================================
   CAMPO 9 — Abra e feche o arco (Exemplo 22.03)
   ===================================================================== */
SIMS.arcoCentro = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 340);
  const PX = 250, PY = 170, R = 125;
  const st = { ab: m === 0 ? 80 : 120, s: m === 1 ? -1 : 1, th: 30 };   // ab = abertura total, em graus
  const arco = S("path", { fill: "none", "stroke-width": 12, "stroke-linecap": "round" }, svg);
  S("line", { x1: PX - 150, y1: PY, x2: PX + 170, y2: PY, stroke: COR.cinza, "stroke-width": 1.2, "stroke-dasharray": "5 5" }, svg);
  const e1 = S("circle", { r: 6, fill: COR.forca, stroke: "#fff" }, svg), e2 = S("circle", { r: 6, fill: COR.forca, stroke: "#fff" }, svg);
  const d1 = criarSeta(svg, "campo", 3), d2 = criarSeta(svg, "campo", 3), sE = criarSeta(svg, "forca", 6);
  S("circle", { cx: PX, cy: PY, r: 5, fill: COR.cinza }, svg);
  texto(svg, PX - 8, PY + 22, "P", "sim-txt forte", "end");
  texto(svg, 16, 306, "azul: campo de um par de elementos", "sim-txt"); texto(svg, 16, 326, "amarelo: campo total", "sim-txt");
  const ler = H("div", "sim-leitura", root);
  const fator = () => { const a = st.ab / 2 * Math.PI / 180; return Math.abs(Math.sin(a)) < 1e-9 ? 0 : Math.sin(a) / a; };
  const pt = t => [PX + R * Math.cos(t * Math.PI / 180), PY - R * Math.sin(t * Math.PI / 180)];
  function desenhar() {
    let d = "";
    for (let t = -st.ab / 2; t <= st.ab / 2 + 0.01; t += 2) { const [x, y] = pt(t); d += `${d ? "L" : "M"} ${x.toFixed(1)} ${y.toFixed(1)} `; }
    arco.setAttribute("d", d); arco.setAttribute("stroke", st.s > 0 ? COR.pos : COR.neg);
    const th = Math.min(st.th, st.ab / 2), f = fator();
    [[e1, d1, th], [e2, d2, -th]].forEach(([e, s, t]) => {
      const [x, y] = pt(t), ux = (x - PX) / R, uy = (y - PY) / R;
      e.setAttribute("cx", x); e.setAttribute("cy", y);
      s.pos(PX, PY, PX - st.s * ux * 46, PY - st.s * uy * 46);
    });
    sE.pos(PX, PY, PX - st.s * 130 * f, PY);
    ler.textContent = `Abertura do arco: ${st.ab}° · Campo em P: ${fmtNum(f, 2)} × Q/(4πε₀r²)${f < 0.005 ? "" : st.s < 0 ? ", apontando para a barra" : ", apontando para longe da barra"}`;
  }
  const rapida = m === 2 ? perguntaRapida(api, "Com carga negativa na barra, para onde aponta o campo no centro P?", [

  const sA = controle(root, { rot: "Abertura do arco", min: 20, max: 360, passo: 10, valor: st.ab, fmt: v => v + "°", ao: v => { st.ab = v; desenhar(); } });
  const eS = escolha(root, "Carga da barra", [["1", "Positiva"], ["-1", "Negativa"]], String(st.s), v => { st.s = +v; desenhar(); if (rapida && st.s < 0) rapida.mostrar(); });
  controle(root, { rot: "Par de elementos", min: 0, max: 180, passo: 5, valor: st.th, fmt: v => "±" + v + "°", ao: v => { st.th = v; desenhar(); } });
  if (m < 2) botaoVerificar(api, () => {

      return st.s < 0 ? true : "A barra do exemplo tem carga negativa, −Q.";

  root._t = { resolver() {

/* =====================================================================
   CAMPO 10 — Do disco à placa
   ===================================================================== */
SIMS.discoPlaca = function (root, api) {

    texto(svg, lado === "end" ? MX - 10 : MX + 44, MY - v * MH + 5, r, "sim-txt", lado);
  });
  texto(svg, MX + 17, MY + 22, "E / (σ/2ε₀)", "sim-txt", "middle");
  const ler = H("div", "sim-leitura", root);
  function desenhar() {
    const w = st.R * ESC, yP = DY - st.z * ESC, f = fr();

    ler.textContent = `R = ${st.R} cm · z = ${fmtNum(st.z, 1)} cm · Campo: ${fmtNum(f * 100, 1)}% do de uma placa infinita · disco / carga pontual = ${fmtNum(pontual(), 2)}`;
  }
  const rapida = m === 2 ? perguntaRapida(api, "A dez raios de distância, o campo do disco se parece com o de:", [

    ["Um dipolo", false, "O disco tem carga total diferente de zero; de longe, é essa carga que conta."]]) : null;
  const checar = () => { if (rapida && st.R === 5 && st.z >= 50) rapida.mostrar(); };

  const sZ = controle(root, { rot: "Altura de P (z)", min: 1, max: 60, passo: 0.5, valor: st.z, fmt: v => fmtNum(v, 1) + " cm", ao: v => { st.z = v; desenhar(); checar(); } });
  if (m < 2) botaoVerificar(api, () => {

  desenhar();
  root._t = { resolver() {

/* =====================================================================

  const m = api.cfg.m;
  const svg = criarPalco(root, 340);

  const setas = [200, 260, 380, 440].map(() => criarSeta(svg, "campo", 3));

  const tg = S("text", { "text-anchor": "middle", dy: "0.35em", class: "sim-sinal", "font-size": 14 }, g); tg.textContent = gota.s < 0 ? "−" : "+";
  texto(svg, 20, 30, "amarelo: força elétrica · cinza: peso", "sim-txt");
  const ler = H("div", "sim-leitura", root);
