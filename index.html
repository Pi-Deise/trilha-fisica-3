    setas.forEach((s, i) => { const x = [200, 260, 380, 440][i]; if (L < 3) s.pos(0, 0, 0, 0); else s.pos(x, 170 - dir * L / 2, x, 170 + dir * L / 2); });
    tT.textContent = st.E > 0 ? "+ + +" : st.E < 0 ? "− − −" : ""; tB.textContent = st.E > 0 ? "− − −" : st.E < 0 ? "+ + +" : "";
    g.setAttribute("transform", `translate(320,${st.y})`);
    sP.pos(332, st.y, 332, st.y + 40);
    const fe = eletrica() / MG * 40;
    sF.pos(308, st.y, 308, st.y - fe);
    const mov = parada() ? "parada" : liquida() > 0 ? "subindo" : "descendo";
    ler.textContent = `Campo: ${fmtNum(Math.abs(st.E), 2)} × 10⁵ N/C ${st.E > 0 ? "para baixo" : st.E < 0 ? "para cima" : "(desligado)"} · Peso da gota: 4,8 × 10⁻¹⁴ N · Gota: ${mov}`;
    if (rapida && parada()) rapida.mostrar();
  }
  const rapida = m === 1 ? perguntaRapida(api, "No equilíbrio, qE = mg. Com o peso e o campo do painel, quantos elétrons a mais esta gota tem?", [
    ["2", false, "Calcule q = mg/E com o campo do painel e divida por e = 1,6 × 10⁻¹⁹ C."],
    ["3", false, "Essa era a gota anterior. Esta se equilibra com um campo menor, então tem mais carga."],
    ["5", true, ""],
    ["8", false, "Calcule q = mg/E com o campo do painel e divida por e = 1,6 × 10⁻¹⁹ C."]]) : null;
  const sE = controle(root, { rot: "Campo entre as placas", min: -2, max: 2, passo: 0.05, valor: 0,
    fmt: v => (v === 0 ? "desligado" : `${fmtNum(Math.abs(v), 2)} × 10⁵ N/C ${v > 0 ? "↓" : "↑"}`), ao: v => { st.E = v; desenhar(); } });
  const linha = H("div", "sim-escolha", root);
  H("span", "nome", linha, "Gota");
  botaoSim(linha, "Recolocar no centro", () => { st.y = 170; desenhar(); }, "");
  if (m !== 1) botaoVerificar(api, () => {
    if (parada()) return true;
    if (st.E === 0) return "Ligue o campo: sem ele, só o peso age e a gota cai.";
    if (eletrica() < 0) return `A força elétrica também aponta para baixo. Esta gota é ${gota.s < 0 ? "negativa" : "positiva"}: para que lado o campo precisa apontar?`;
    return liquida() > 0 ? "A gota está subindo: a força elétrica ficou maior que o peso. Diminua o campo." : "A gota ainda desce: a força elétrica é menor que o peso. Aumente o campo.";
  });
  animar(svg, dt => {
    if (parada()) return;
    st.y = lim(st.y - liquida() / MG * 70 * dt, YT + 16, YB - 16);
    desenhar();
  });
  desenhar();
  root._t = { resolver() { st.E = m === 0 ? 1 : m === 1 ? 0.6 : -1.5; sE.set(st.E); desenhar(); } };
};

/* =====================================================================
   CAMPO 12 — Acerte o papel (Exemplo 22.04)
   ===================================================================== */
SIMS.jatoTinta = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 320);
  const XA = 200, XB = 440, XP = 600, YC = 210, PXMM = 40, MASSA = 1.3e-10, COMP = 0.016;
  const st = m === 0 ? { E: 1.0, Q: 1.0, v: 25 } : { E: 1.4, Q: 1.5, v: 18 };
  const desvio = () => st.Q * 1e-13 * st.E * 1e6 * COMP * COMP / (2 * MASSA * st.v * st.v) * 1e3;   // mm
  const igual = (a, b) => Math.abs(a - b) < 1e-6;
  const yEm = x => {
    const d = desvio() * PXMM, u = (x - XA) / (XB - XA);
    const y = x <= XA ? YC : x <= XB ? YC - d * u * u : YC - d * (1 + 2 * (x - XB) / (XB - XA));
    return Math.max(y, 14);
  };
  S("rect", { x: 96, y: YC - 22, width: 44, height: 44, rx: 6, fill: COR.cinza }, svg);
  texto(svg, 118, YC + 44, "gerador", "sim-txt", "middle");
  S("line", { x1: XA, y1: YC - 78, x2: XB, y2: YC - 78, stroke: COR.cinza, "stroke-width": 7, "stroke-linecap": "round" }, svg);
  S("line", { x1: XA, y1: YC + 60, x2: XB, y2: YC + 60, stroke: COR.cinza, "stroke-width": 7, "stroke-linecap": "round" }, svg);
  S("line", { x1: XP, y1: 14, x2: XP, y2: 306, stroke: COR.cinza, "stroke-width": 5 }, svg);
  texto(svg, XP - 8, 300, "papel", "sim-txt", "end");
  S("line", { x1: 140, y1: YC, x2: XP, y2: YC, stroke: COR.cinza, "stroke-width": 1, "stroke-dasharray": "4 5" }, svg);
  [250, 320, 390].forEach(x => criarSeta(svg, "campo", 3).pos(x, YC - 60, x, YC - 22));
  texto(svg, 262, YC - 44, "E", "sim-txt forte");
  const traj = S("path", { fill: "none", stroke: COR.forca, "stroke-width": 2.5, "stroke-dasharray": "7 5" }, svg);
  const cota = S("line", { stroke: COR.pos, "stroke-width": 3 }, svg), tc = texto(svg, XB + 10, YC - 6, "", "sim-txt forte");
  const g = S("circle", { r: 7, fill: "#3F9E6B", stroke: "#fff", "stroke-width": 1.5 }, svg);
  const ler = H("div", "sim-leitura", root);
  let xg = 140;
  function desenhar() {
    let d = "";
    for (let x = 140; x <= XP; x += 6) d += `${d ? "L" : "M"} ${x} ${yEm(x).toFixed(1)} `;
    traj.setAttribute("d", d);
    cota.setAttribute("x1", XB); cota.setAttribute("x2", XB); cota.setAttribute("y1", YC); cota.setAttribute("y2", yEm(XB));
    tc.textContent = fmtNum(desvio(), 2) + " mm";
    ler.textContent = `Desvio na saída das placas: ${fmtNum(desvio(), 2)} mm · E = ${fmtNum(st.E, 1)} × 10⁶ N/C · Q = ${fmtNum(st.Q, 1)} × 10⁻¹³ C · vₓ = ${st.v} m/s`;
  }
  const sE = controle(root, { rot: "Campo E", min: 0.5, max: 2, passo: 0.1, valor: st.E, fmt: v => fmtNum(v, 1) + " × 10⁶ N/C", ao: v => { st.E = v; desenhar(); } });
  const sQ = controle(root, { rot: "Carga da gota Q", min: 0.5, max: 3, passo: 0.1, valor: st.Q, fmt: v => fmtNum(v, 1) + " × 10⁻¹³ C", ao: v => { st.Q = v; desenhar(); } });
  const sV = controle(root, { rot: "Velocidade vₓ", min: 10, max: 40, passo: 1, valor: st.v, fmt: v => v + " m/s", ao: v => { st.v = v; desenhar(); } });
  botaoVerificar(api, () => {
    const d = desvio();
    if (m === 0) return igual(st.E, 1.4) && igual(st.Q, 1.5) && igual(st.v, 18) ? true : "Ajuste as três barras para os valores do exemplo: E = 1,4 × 10⁶ N/C, Q = 1,5 × 10⁻¹³ C e vₓ = 18 m/s.";
    if (m === 1) {
      if (!igual(st.E, 1.4) || !igual(st.v, 18)) return "Mantenha o campo em 1,4 × 10⁶ N/C e a velocidade em 18 m/s. Mude só a carga.";
      return Math.abs(d - 1.28) <= 0.03 ? true : `O desvio está em ${fmtNum(d, 2)} mm. O desvio é proporcional à carga: para dobrar o desvio, o que fazer com Q?`;
    }
    if (!igual(st.E, 1.4) || !igual(st.Q, 1.5)) return "Mantenha o campo em 1,4 × 10⁶ N/C e a carga em 1,5 × 10⁻¹³ C. Mude só a velocidade.";
    return Math.abs(d - 0.16) <= 0.01 ? true : `O desvio está em ${fmtNum(d, 2)} mm; um quarto de 0,64 é 0,16. A velocidade aparece ao quadrado no denominador.`;
  });
  animar(svg, dt => { xg += 240 * dt; if (xg > XP) xg = 140; g.setAttribute("cx", xg); g.setAttribute("cy", yEm(xg)); });
  desenhar();
  root._t = { resolver() {
    if (m === 0) { st.E = 1.4; st.Q = 1.5; st.v = 18; }
    if (m === 1) st.Q = 3;
    if (m === 2) st.v = 36;
    sE.set(st.E); sQ.set(st.Q); sV.set(st.v); desenhar();
  } };
};

/* =====================================================================
   CAMPO 13 — Gire o dipolo (Exemplo 22.05)
   ===================================================================== */
SIMS.dipoloCampo = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 340);
  const CX = 190, CY = 170, A = 64;
  const st = { th: m === 2 ? 120 : 30, om: 0, solto: false, partiu: false };   // graus, a partir do campo
  for (let y = 50; y <= 290; y += 60) criarSeta(svg, "campo", 2).pos(40, y, 340, y);
  texto(svg, 44, 30, "campo uniforme E →", "sim-txt");
  const haste = S("line", { stroke: COR.cinza, "stroke-width": 5, "stroke-linecap": "round" }, svg);
  const sp = S("line", { stroke: COR_P, "stroke-width": 5, "stroke-linecap": "round" }, svg);
  const f1 = criarSeta(svg, "forca", 5), f2 = criarSeta(svg, "forca", 5);
  const cN = criarCarga(svg, 13, -1, ""), cP = criarCarga(svg, 13, 1, "");
  // gráfico U(θ)
  const GX = 380, GW = 230, GYC = 190, GA = 70, gx = t => GX + (t + 180) / 360 * GW;
  S("line", { x1: GX, y1: GYC, x2: GX + GW, y2: GYC, stroke: COR.cinza, "stroke-width": 1.5 }, svg);
  let d = "";
  for (let t = -180; t <= 180; t += 4) d += `${d ? "L" : "M"} ${gx(t)} ${GYC + GA * Math.cos(t * Math.PI / 180)} `;
  S("path", { d, fill: "none", stroke: COR.campo, "stroke-width": 2.5 }, svg);
  texto(svg, GX, GYC - GA - 14, "energia U = −pE cos θ", "sim-txt");
  [[-180, "−180°"], [0, "0°"], [180, "180°"]].forEach(([t, r]) => texto(svg, gx(t), GYC + GA + 24, r, "sim-txt", "middle"));
  const mk = S("circle", { r: 7, fill: COR.forca, stroke: "#fff", "stroke-width": 1.5 }, svg);
  const ler = H("div", "sim-leitura", root);
  const norm = t => ((t + 180) % 360 + 360) % 360 - 180;
  function desenhar() {
    const a = st.th * Math.PI / 180, ux = Math.cos(a), uy = -Math.sin(a);
    const px = CX + A * ux, py = CY + A * uy, nx = CX - A * ux, ny = CY - A * uy;
    haste.setAttribute("x1", nx); haste.setAttribute("y1", ny); haste.setAttribute("x2", px); haste.setAttribute("y2", py);
    sp.setAttribute("x1", CX - 18 * ux); sp.setAttribute("y1", CY - 18 * uy); sp.setAttribute("x2", CX + 30 * ux); sp.setAttribute("y2", CY + 30 * uy);
    cP.em(px, py); cN.em(nx, ny);
    f1.pos(px, py, px + 48, py); f2.pos(nx, ny, nx - 48, ny);
    mk.setAttribute("cx", gx(st.th)); mk.setAttribute("cy", GYC + GA * Math.cos(a));
    ler.textContent = `θ = ${fmtNum(st.th, 0)}° · Torque: ${fmtNum(Math.abs(Math.sin(a)), 2)} pE · Energia: ${fmtNum(-Math.cos(a) + 0, 2)} pE`;
  }
  arrastavel(cP.g, svg, () => ({ x: cP.x, y: cP.y }), p => {
    st.solto = false; st.om = 0;
    st.th = Math.round(Math.atan2(-(p.y - CY), p.x - CX) * 180 / Math.PI);
    desenhar();
  });
  const linha = H("div", "sim-escolha", root);
  H("span", "nome", linha, "Experimento");
  botaoSim(linha, "Soltar o dipolo", () => { st.partiu = Math.abs(st.th) >= 30; st.solto = true; st.om = 0; }, "");
  botaoVerificar(api, () => {
    const t = Math.abs(st.th);
    if (m === 0) return Math.abs(t - 90) <= 4 ? true : `Em θ = ${fmtNum(st.th, 0)}° o torque vale ${fmtNum(Math.abs(Math.sin(st.th * Math.PI / 180)), 2)} pE. Para qual ângulo o seno é máximo?`;
    if (m === 1) return t >= 176 ? true : `Em θ = ${fmtNum(st.th, 0)}° a energia vale ${fmtNum(-Math.cos(st.th * Math.PI / 180), 2)} pE. Siga o marcador até o ponto mais alto da curva.`;
    if (st.partiu && !st.solto && t < 3) return true;
    return st.solto ? "Espere o dipolo parar de oscilar." : "Gire o dipolo pelo menos 30° para longe do campo e clique em \"Soltar o dipolo\".";
  });
  animar(svg, dt => {
    if (!st.solto) return;
    st.om += (-700 * Math.sin(st.th * Math.PI / 180) - 2.2 * st.om) * dt;
    st.th = norm(st.th + st.om * dt);
    if (Math.abs(st.th) < 1.5 && Math.abs(st.om) < 5) {
      st.solto = false; st.th = 0; st.om = 0;
      if (m === 2 && st.partiu) api.ok();
    }
    desenhar();
  });
  desenhar();
  root._t = { resolver() {
    if (m === 0) st.th = 90;
    if (m === 1) st.th = 180;
    if (m === 2) { st.partiu = true; st.solto = false; st.th = 0; }
    desenhar();
  } };
};

/* =====================================================================
   CAMPO 14 — Conte as linhas (ponte para Gauss)
   ===================================================================== */
SIMS.fluxoLinhas = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 340);
  const CX = 320, CY = 170;
  const st = m === 0 ? { x: 560, y: 170, q: 1, R: 100 } : m === 1 ? { x: 300, y: 150, q: 2, R: 100 } : { x: 340, y: 180, q: 1, R: 100 };
  st.rmin = st.rmax = st.R;
  const sup = S("circle", { cx: CX, cy: CY, fill: "rgba(138,106,0,0.07)", stroke: COR.forca, "stroke-width": 3, "stroke-dasharray": "8 6" }, svg);
  const tS = texto(svg, CX, 0, "superfície fechada", "sim-txt", "middle");
  const gL = S("g", {}, svg);
  const c = criarCarga(svg, 14, 1, "");
  const ler = H("div", "sim-leitura", root);
  const dentro = () => Math.hypot(st.x - CX, st.y - CY) < st.R - 8;
  const fora = () => Math.hypot(st.x - CX, st.y - CY) > st.R + 8;
  function contar(desenha) {
    const N = 8 * Math.abs(st.q), s = Math.sign(st.q);
    let sai = 0, entra = 0;
    if (desenha) gL.innerHTML = "";
    for (let k = 0; k < N; k++) {
      const a = 2 * Math.PI * k / N + 0.2, ux = Math.cos(a), uy = Math.sin(a);
      const dx = st.x - CX, dy = st.y - CY, b = dx * ux + dy * uy, cc = dx * dx + dy * dy - st.R * st.R, disc = b * b - cc;
      const ts = [];
      if (disc > 0) { const r = Math.sqrt(disc); [-b - r, -b + r].forEach(t => { if (t > 0) ts.push(t); }); }
      // ao longo do raio (afastando-se da carga): 1 cruzamento = saindo da superfície; 2 = primeiro entra, depois sai
      const tipos = ts.length === 1 ? ["sai"] : ts.length === 2 ? ["entra", "sai"] : [];
      tipos.forEach((tp, i) => {
        const real = s > 0 ? tp : (tp === "sai" ? "entra" : "sai");   // carga negativa: as linhas apontam para a carga
        if (real === "sai") sai++; else entra++;
        if (desenha) S("circle", { cx: st.x + ts[i] * ux, cy: st.y + ts[i] * uy, r: 4, fill: real === "sai" ? COR.forca : COR.neg, stroke: "#fff", "stroke-width": 1 }, gL);
      });
      if (desenha) {
        S("line", { x1: st.x + 16 * ux, y1: st.y + 16 * uy, x2: st.x + 700 * ux, y2: st.y + 700 * uy, stroke: COR.campo, "stroke-width": 1.6 }, gL);
        const t0 = 46, t1 = 60;
        criarSeta(gL, "campo", 1.6).pos(st.x + (s > 0 ? t0 : t1) * ux, st.y + (s > 0 ? t0 : t1) * uy, st.x + (s > 0 ? t1 : t0) * ux, st.y + (s > 0 ? t1 : t0) * uy);
      }
    }
    return { sai, entra, saldo: sai - entra };
  }
  function desenhar() {
    sup.setAttribute("r", st.R); tS.setAttribute("y", CY - st.R - 8);
    c.em(st.x, st.y); c.sinal(st.q); c.rotulo(st.q ? `${st.q > 0 ? "+" : "−"}${Math.abs(st.q) === 1 ? "" : Math.abs(st.q)}q` : "sem carga");
    const n = contar(true);
    ler.textContent = `Linhas que saem da superfície: ${n.sai} · que entram: ${n.entra} · saldo: ${n.saldo > 0 ? "+" : ""}${n.saldo} · carga ${dentro() ? "dentro" : fora() ? "fora" : "na borda"}`;
    if (m === 1 && fora() && st.q !== 0) api.ok();
  }
  arrastavel(c.g, svg, () => ({ x: st.x, y: st.y }), p => { st.x = lim(p.x, 30, 610); st.y = lim(p.y, 20, 320); desenhar(); });
  const rapida = m === 2 ? perguntaRapida(api, "Ao mudar o tamanho da superfície, com a carga dentro, o saldo de linhas:", [
    ["Aumentou", false, "Mude o raio de novo olhando o saldo no painel: as mesmas linhas atravessam a superfície, seja ela grande ou pequena."],
    ["Não mudou", true, ""],
    ["Diminuiu", false, "Mude o raio de novo olhando o saldo no painel: as mesmas linhas atravessam a superfície, seja ela grande ou pequena."]]) : null;
  const sQ = controle(root, { rot: "Carga", min: -3, max: 3, passo: 1, valor: st.q, fmt: v => (v ? `${v > 0 ? "+" : "−"}${Math.abs(v)}q` : "0"), ao: v => { st.q = v; desenhar(); } });
  const sR = controle(root, { rot: "Raio da superfície", min: 60, max: 140, passo: 5, valor: st.R, fmt: v => v + " (unid.)", ao: v => {
    st.R = v; st.rmin = Math.min(st.rmin, v); st.rmax = Math.max(st.rmax, v); desenhar();
    if (rapida && st.rmax - st.rmin >= 40 && dentro()) rapida.mostrar();
  } });
  if (m < 2) botaoVerificar(api, () => {
    if (m === 0) {
      if (!dentro()) return "Arraste a carga para dentro da superfície tracejada.";
      return st.q === 2 ? true : `A carga está em ${st.q > 0 ? "+" : ""}${st.q}q. Dobre o valor inicial, +q.`;
    }
    if (st.q === 0) return "Deixe a carga diferente de zero.";
    return fora() ? true : "Arraste a carga para fora da superfície tracejada.";
  });
  desenhar();
  root._t = { resolver() {
    if (m === 0) { st.x = 330; st.y = 160; st.q = 2; sQ.set(2); }
    if (m === 1) { st.x = 560; st.y = 80; }
    if (m === 2) { st.rmin = 60; st.rmax = 140; rapida.mostrar(); }
    desenhar();
  }, contar: () => contar(false) };
};

/* =====================================================================
   LEI DE GAUSS — jogos
   ===================================================================== */
const EPS0 = 8.854e-12;
const dif180 = (a, b) => Math.abs(((a - b + 540) % 360) - 180);       // diferença entre dois ângulos, em graus

/* GAUSS 1 — a densidade linear de carga */
SIMS.gaussLinha = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 300);
  const X0 = 50, ESCL = 135, N = 17;                                  // 135 px = 1 m
  const st = m === 0 ? { L: 1.5, Q: 2 } : { L: 2, Q: 2 };
  const A = { L: 3, Q: 6 };                                           // fio A da missão 2: λ = 2,0 μC/m
  function fio(y, nome) {
    texto(svg, X0, y - 38, nome, "sim-txt forte");
    S("line", { x1: X0, y1: y, x2: X0 + 4 * ESCL, y2: y, stroke: COR.cinza, "stroke-width": 1, "stroke-dasharray": "3 5" }, svg);
    const cs = Array.from({ length: N }, () => S("circle", { r: 5.5, cy: y, fill: COR.pos, stroke: "#fff", "stroke-width": 1 }, svg));
    const barra = S("line", { y1: y + 20, y2: y + 20, stroke: COR.forca, "stroke-width": 4, "stroke-linecap": "round" }, svg);
    const t = texto(svg, X0, y + 48, "", "sim-txt");
    return (L, Q) => {
      cs.forEach((c, i) => c.setAttribute("cx", X0 + i * L * ESCL / (N - 1)));
      barra.setAttribute("x1", X0); barra.setAttribute("x2", X0 + L * ESCL);
      t.textContent = `L = ${fmtNum(L, 1)} m · Q = ${fmtNum(Q, 1)} μC · λ = Q/L = ${fmtNum(Q / L, 2)} μC/m`;
    };
  }
  const dA = m === 1 ? fio(78, "Fio A") : null;
  const dB = fio(m === 1 ? 210 : 140, m === 1 ? "Fio B" : "Fio");
  function desenhar() { if (dA) dA(A.L, A.Q); dB(st.L, st.Q); }
  const suf = m === 1 ? " do fio B" : " do fio";
  const sL = controle(root, { rot: "Comprimento" + suf, min: 0.5, max: 4, passo: 0.1, valor: st.L, fmt: v => fmtNum(v, 1) + " m", ao: v => { st.L = v; desenhar(); } });
  const sQ = controle(root, { rot: "Carga total" + suf, min: 1, max: 12, passo: 0.5, valor: st.Q, fmt: v => fmtNum(v, 1) + " μC", ao: v => { st.Q = v; desenhar(); } });
  botaoVerificar(api, () => {
    const lam = st.Q / st.L;
    if (m === 0) {
      if (Math.abs(st.L - 1.5) > 1e-6) return "Deixe o fio em 1,5 m e mude só a carga total.";
      return Math.abs(lam - 4) <= 0.1 ? true : `Com L = 1,5 m, a densidade está em ${fmtNum(lam, 2)} μC/m. Como λ = Q/L, que carga total dá 4,0 μC/m?`;
    }
    if (Math.abs(st.L - 3) < 0.05) return "O fio B precisa ter comprimento diferente de 3,0 m.";
    return Math.abs(lam - 2) <= 0.05 ? true : `A densidade do fio B está em ${fmtNum(lam, 2)} μC/m, e a do fio A é 2,0 μC/m. Quando o comprimento muda, o que a carga precisa fazer?`;
  });
  desenhar();
  root._t = { resolver() {
    if (m === 0) { st.L = 1.5; st.Q = 6; } else { st.L = 1; st.Q = 2; }
    sL.set(st.L); sQ.set(st.Q); desenhar();
  } };
};

/* GAUSS 2 — pares simétricos e efeito de borda */
SIMS.gaussPares = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 340);
  const WY = 275;
  const ESP = m === 0 ? 44 : 26, N0 = m === 0 ? 11 : 9, X00 = m === 0 ? 100 : 70, NT = m === 0 ? N0 : N0 + 12;
  const P = m === 0 ? { x: X00 + (N0 - 1) / 2 * ESP, y: 150 } : { x: X00 + (N0 - 1) * ESP, y: 190 };
  const st = { ativa: Array(N0).fill(true), extra: 0 };
  S("line", { x1: 30, y1: WY, x2: 610, y2: WY, stroke: COR.cinza, "stroke-width": 1, "stroke-dasharray": "4 5" }, svg);
  S("line", { x1: P.x, y1: P.y, x2: P.x, y2: P.y - 110, stroke: COR.cinza, "stroke-width": 1.2, "stroke-dasharray": "3 4" }, svg);
  const vs = Array.from({ length: NT }, () => criarSeta(svg, "campo", 2));
  const vTot = criarSeta(svg, "forca", 6);
  const cs = Array.from({ length: NT }, (_, i) => { const c = criarCarga(svg, 8, 1, ""); c.em(X00 + i * ESP, WY); return c; });
  const pP = criarCarga(svg, 7, 0, "P"); pP.em(P.x, P.y);
  texto(svg, 30, 24, "azul: campo de cada carga · amarelo: campo total em P", "sim-txt");
  if (m === 0) texto(svg, 30, 326, "clique numa carga para tirá-la ou recolocá-la", "sim-txt");
  const ler = H("div", "sim-leitura", root);
  const noFio = i => (m === 0 ? st.ativa[i] : i < N0 + st.extra);
  const lista = () => cs.map((c, i) => ({ x: c.x, y: WY, q: 1, i })).filter(c => noFio(c.i));
  const incl = () => { const e = campoDe(lista(), P.x, P.y); return e.mod ? Math.atan2(e.x, -e.y) * 180 / Math.PI : 0; };
  function desenhar() {
    const L = lista(), e = campoDe(L, P.x, P.y);
    cs.forEach((c, i) => c.g.setAttribute("opacity", noFio(i) ? 1 : m === 1 ? 0.15 : 0.2));
    vs.forEach(s => s.pos(0, 0, 0, 0));
    L.forEach(c => { const dx = P.x - c.x, dy = P.y - c.y, d = Math.hypot(dx, dy); vs[c.i].pos(P.x, P.y, P.x + dx / d * 38, P.y + dy / d * 38); });
    if (e.mod) vTot.pos(P.x, P.y, P.x + e.x / e.mod * 100, P.y + e.y / e.mod * 100); else vTot.pos(0, 0, 0, 0);
    ler.textContent = `Inclinação do campo em P: ${fmtNum(incl(), 1)}° (positiva = para a direita) · cargas no fio: ${L.length}`;
  }
  if (m === 0) cs.forEach((c, i) => {
    c.g.style.cursor = "pointer";
    c.g.setAttribute("tabindex", "0"); c.g.setAttribute("role", "button"); c.g.dataset.i = i;
    c.g.setAttribute("aria-label", `Carga ${i + 1}: clique para tirar ou recolocar`);
    const alterna = () => { st.ativa[i] = !st.ativa[i]; desenhar(); };
    c.g.addEventListener("click", alterna);
    c.g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); alterna(); } });
  });
  const sE = m === 1 ? controle(root, { rot: "Cargas acrescentadas à direita", min: 0, max: 12, passo: 1, valor: 0, fmt: v => String(v), ao: v => { st.extra = v; desenhar(); } }) : null;
  botaoVerificar(api, () => {
    const a = incl();
    if (m === 0) {
      const tiradas = st.ativa.filter(x => !x).length;
      if (tiradas === N0) return "Deixe pelo menos uma carga no fio.";
      if (tiradas < 2) return "Tire pelo menos duas cargas do fio, clicando nelas.";
      return Math.abs(a) <= 0.1 ? true : `O campo em P está inclinado ${fmtNum(a, 1)}°. Cada carga tirada precisa ter a parceira simétrica, do outro lado de P, também tirada.`;
    }
    return Math.abs(a) <= 0.5 ? true : `O campo em P está inclinado ${fmtNum(a, 1)}°. Faltam as parceiras simétricas das cargas que estão à esquerda de P: continue acrescentando à direita.`;
  });
  desenhar();
  root._t = { resolver() {
    if (m === 0) { st.ativa[4] = false; st.ativa[6] = false; } else { st.extra = 8; sE.set(8); }
    desenhar();
  } };
};

/* GAUSS 3 — do conjunto de cargas ao fio infinito */
SIMS.gaussContinuo = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 320);
  const WY = 262, CX = 320, NMAX = 81;
  const st = { N: 17, h: 3 };
  // campo das cargas ÷ campo do fio infinito, em P (acima do meio); h em espaçamentos entre cargas
  const razao = () => { let s = 0; for (let i = 0; i < st.N; i++) { const x = i - (st.N - 1) / 2; s += 1 / (st.h * st.h + x * x) ** 1.5; } return st.h * st.h * s / 2; };
  S("line", { x1: 30, y1: WY, x2: 610, y2: WY, stroke: COR.cinza, "stroke-width": 1, "stroke-dasharray": "4 5" }, svg);
  const cs = Array.from({ length: NMAX }, () => S("circle", { cy: WY, fill: COR.pos, stroke: "#fff", "stroke-width": 0.8 }, svg));
  const sInf = criarSeta(svg, "campo", 4), sSoma = criarSeta(svg, "forca", 5);
  const pP = criarCarga(svg, 8, 0, "P");
  texto(svg, 30, 24, "azul: campo de um fio infinito · amarelo: soma das cargas (esquema fora de escala)", "sim-txt");
  const ler = H("div", "sim-leitura", root);
  function desenhar() {
    const pxd = Math.min(16, 540 / (st.N - 1)), py = WY - 40 - 18 * st.h, r = razao();
    cs.forEach((c, i) => {
      c.style.display = i < st.N ? "" : "none";
      c.setAttribute("cx", CX + (i - (st.N - 1) / 2) * pxd);
      c.setAttribute("r", Math.min(5, Math.max(2, pxd * 0.32)));
    });
    pP.em(CX, py);
    sInf.pos(CX - 14, py, CX - 14, py - 80);
    sSoma.pos(CX + 14, py, CX + 14, py - 80 * r);
    ler.textContent = `${st.N} cargas · P a ${fmtNum(st.h, 1)} espaçamentos do fio · campo das cargas ÷ campo do fio infinito = ${fmtNum(r, 3)}`;
  }
  const sN = controle(root, { rot: "Número de cargas", min: 5, max: 81, passo: 2, valor: st.N, fmt: v => String(v), ao: v => { st.N = v; desenhar(); } });
  const sH = controle(root, { rot: "Distância de P ao fio", min: 0.5, max: 5, passo: 0.5, valor: st.h, fmt: v => fmtNum(v, 1) + " espaçamentos", ao: v => { st.h = v; desenhar(); } });
  botaoVerificar(api, () => {
    if (m === 0 && st.h !== 3) return "Deixe P a 3,0 espaçamentos do fio e mude só o número de cargas.";
    if (m === 1 && st.N !== 17) return "Mantenha as 17 cargas e mude só a distância de P ao fio.";
    const r = razao();
    return Math.abs(r - 1) <= 0.02 ? true : `A razão está em ${fmtNum(r, 3)}; ela precisa ficar entre 0,98 e 1,02. ${m === 0 ? "Com mais cargas, as pontas ficam mais longe." : "Perto do fio, as pontas parecem estar longe."}`;
  });
  desenhar();
  root._t = { resolver() { if (m === 0) { st.N = 41; sN.set(41); } else { st.h = 1.5; sH.set(1.5); } desenhar(); } };
};

/* GAUSS 4 — a superfície gaussiana */
SIMS.gaussSuperficie = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 340);
  const CX = 320, CY = m === 0 ? 175 : 185;
  const ler = H("div", "sim-leitura", root);
  if (m === 0) {
    const U = 34, RP = 1.8, XP = 0.75;                                // 1 u = 34 px; P a 1,8 u do fio
    const st = { r: 1, L: 1.5 };
    S("line", { x1: 40, y1: CY, x2: 600, y2: CY, stroke: COR.cinza, "stroke-width": 2 }, svg);
    const cil = S("rect", { fill: "rgba(138,106,0,0.08)", stroke: COR.forca, "stroke-width": 3, "stroke-dasharray": "8 6", rx: 2 }, svg);
    for (let k = -8; k <= 8; k++) criarCarga(svg, 6, 1, "").em(CX + k * U, CY);
    const alvo = S("circle", { cx: CX + XP * U, cy: CY - RP * U, r: 7, fill: "none", stroke: COR.forca, "stroke-width": 2.5 }, svg);
    texto(svg, CX + XP * U + 12, CY - RP * U - 9, "P", "sim-txt forte");
    const t1 = texto(svg, 0, 0, "S1", "sim-txt forte", "end"), t2 = texto(svg, 0, 0, "S2", "sim-txt forte", "middle"), t3 = texto(svg, 0, 0, "S3", "sim-txt forte", "start");
    const dentro = () => {
      let n = 0, borda = false;
      for (let k = -8; k <= 8; k++) { const d = Math.abs(k) - st.L / 2; if (Math.abs(d) <= 0.05) borda = true; else if (d < 0) n++; }
      return { n, borda };
    };
    function desenhar() {
      const w = st.L * U, h = st.r * U, d = dentro();
      cil.setAttribute("x", CX - w / 2); cil.setAttribute("y", CY - h); cil.setAttribute("width", w); cil.setAttribute("height", 2 * h);
      t1.setAttribute("x", CX - w / 2 - 8); t1.setAttribute("y", CY - h - 8);
      t2.setAttribute("x", CX); t2.setAttribute("y", CY + h + 22);
      t3.setAttribute("x", CX + w / 2 + 8); t3.setAttribute("y", CY - h - 8);
      alvo.setAttribute("stroke", Math.abs(st.r - RP) <= 0.05 ? "#3F9E6B" : COR.forca);
      ler.textContent = `Cargas dentro do cilindro: ${d.n}${d.borda ? " (há uma carga sobre uma tampa)" : ""} · raio ${fmtNum(st.r, 1)} u · comprimento ${fmtNum(st.L, 1)} u`;
    }
    const sr = controle(root, { rot: "Raio r", min: 0.5, max: 3, passo: 0.1, valor: st.r, fmt: v => fmtNum(v, 1) + " u", ao: v => { st.r = v; desenhar(); } });
    const sL = controle(root, { rot: "Comprimento L", min: 1, max: 8, passo: 0.5, valor: st.L, fmt: v => fmtNum(v, 1) + " u", ao: v => { st.L = v; desenhar(); } });
    botaoVerificar(api, () => {
      const d = dentro();
      if (Math.abs(st.r - RP) > 0.05) return `A lateral passa a ${fmtNum(st.r, 1)} u do fio, e P está a 1,8 u. Ajuste o raio r.`;
      if (d.borda) return "Uma carga está exatamente sobre uma tampa. Mude L para ela ficar dentro ou fora do cilindro.";
      return d.n === 3 ? true : `O cilindro envolve ${d.n} carga${d.n === 1 ? "" : "s"}. Ajuste o comprimento L para envolver exatamente 3.`;
    });
    desenhar();
    root._t = { resolver() { st.r = 1.8; st.L = 3; sr.set(1.8); sL.set(3); desenhar(); } };
  } else {
    const R = 95, st = { a: 90 };                                    // a: ângulo do ponto de teste, a partir do eixo do fio
    S("line", { x1: 40, y1: CY, x2: 600, y2: CY, stroke: COR.cinza, "stroke-width": 3 }, svg);
    texto(svg, 46, CY - 10, "fio", "sim-txt");
    S("circle", { cx: CX, cy: CY, r: R, fill: "rgba(138,106,0,0.07)", stroke: COR.forca, "stroke-width": 3, "stroke-dasharray": "8 6" }, svg);
    texto(svg, 30, 24, "azul: campo E · amarelo: normal à superfície", "sim-txt");
    const sE = criarSeta(svg, "campo", 5), sN = criarSeta(svg, "forca", 5);
    const T = criarCarga(svg, 8, 0, "T");
    const rad = () => st.a * Math.PI / 180;
    const pos = () => ({ x: CX + R * Math.cos(rad()), y: CY - R * Math.sin(rad()) });
    const theta = () => Math.acos(Math.min(1, Math.abs(Math.sin(rad())))) * 180 / Math.PI;
    function desenhar() {
      const p = pos(), cima = Math.sin(rad()) >= 0 ? -1 : 1;
      T.em(p.x, p.y);
      sE.pos(p.x, p.y, p.x, p.y + cima * 45);
      sN.pos(p.x, p.y, p.x + Math.cos(rad()) * 45, p.y - Math.sin(rad()) * 45);
      ler.textContent = `Ângulo entre E (azul) e a normal à superfície (amarelo): ${fmtNum(theta(), 0)}°`;
    }
    arrastavel(T.g, svg, pos, p => { st.a = Math.atan2(-(p.y - CY), p.x - CX) * 180 / Math.PI; desenhar(); });
    botaoVerificar(api, () => (Math.abs(theta() - 60) <= 3 ? true : `O ângulo aqui é ${fmtNum(theta(), 0)}°. Arraste o ponto pela esfera até chegar a 60°.`));
    desenhar();
    root._t = { resolver() { st.a = 30; desenhar(); } };
  }
};

/* GAUSS 5 — a lei de Gauss: o fluxo só depende da carga envolvida */
SIMS.gaussFluxo = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 300);
  const CX = 320, CY = 150, UL = 60;                                  // 60 px por metro de comprimento
  const st = { lam: 2, L: 1, r: 2 };                                  // λ em μC/m, L em m, r em cm
  const fluxo = () => st.lam * st.L * 1e-6 / EPS0;
  const PHI0 = 2 * 1 * 1e-6 / EPS0;
  S("line", { x1: 40, y1: CY, x2: 600, y2: CY, stroke: COR.pos, "stroke-width": 6, "stroke-linecap": "round" }, svg);
  const cil = S("rect", { fill: "rgba(138,106,0,0.08)", stroke: COR.forca, "stroke-width": 2.5, "stroke-dasharray": "8 6" }, svg);
  const capE = S("line", { stroke: COR.forca, "stroke-width": 5, "stroke-linecap": "round" }, svg), capD = S("line", { stroke: COR.forca, "stroke-width": 5, "stroke-linecap": "round" }, svg);
  const setas = Array.from({ length: 6 }, () => criarSeta(svg, "campo", 3));
  texto(svg, 30, 24, "azul: campo atravessando a lateral · amarelo: tampas", "sim-txt");
  const ler = H("div", "sim-leitura", root);
  function desenhar() {
    const w = st.L * UL, h = 24 + 14 * st.r, x0 = CX - w / 2;
    cil.setAttribute("x", x0); cil.setAttribute("y", CY - h); cil.setAttribute("width", w); cil.setAttribute("height", 2 * h);
    [[capE, x0], [capD, x0 + w]].forEach(([c, x]) => { c.setAttribute("x1", x); c.setAttribute("x2", x); c.setAttribute("y1", CY - h); c.setAttribute("y2", CY + h); });
    [0.2, 0.5, 0.8].forEach((f, i) => { const x = x0 + f * w; setas[i].pos(x, CY - h, x, CY - h - 34); setas[i + 3].pos(x, CY + h, x, CY + h + 34); });
    ler.textContent = `q_env = λ·L = ${fmtNum(st.lam * st.L, 1)} μC · fluxo total Φ = q_env/ε₀ = ${fmtSci(fluxo(), 2)} N·m²/C`;
  }
  const sLam = controle(root, { rot: "Densidade λ", min: 1, max: 5, passo: 0.5, valor: st.lam, fmt: v => fmtNum(v, 1) + " μC/m", ao: v => { st.lam = v; desenhar(); } });
  const sL = controle(root, { rot: "Comprimento L", min: 0.5, max: 4, passo: 0.5, valor: st.L, fmt: v => fmtNum(v, 1) + " m", ao: v => { st.L = v; desenhar(); } });
  const sr = controle(root, { rot: "Raio r", min: 1, max: 5, passo: 0.5, valor: st.r, fmt: v => fmtNum(v, 1) + " cm", ao: v => { st.r = v; desenhar(); } });
  botaoVerificar(api, () => {
    if (m === 0) {
      if (st.lam !== 2) return "Mantenha λ em 2,0 μC/m e mude só o raio e o comprimento.";
      const q = fluxo() / PHI0;
      return Math.abs(q - 3) <= 0.03 ? true : `O fluxo está ${fmtNum(q, 2)} vezes o inicial. Qual das duas barras, r ou L, muda o fluxo total?`;
    }
    return Math.abs(fluxo() - 3.4e5) / 3.4e5 <= 0.03 ? true : `O fluxo está em ${fmtSci(fluxo(), 2)} N·m²/C. Lembre que Φ = λL/ε₀, então λL precisa valer cerca de 3,0 μC.`;
  });
  desenhar();
  root._t = { resolver() { st.L = m === 0 ? 3 : 1.5; sL.set(st.L); desenhar(); } };
};

/* GAUSS 6 — os vetores normais */
SIMS.gaussNormais = function (root, api) {
  const svg = criarPalco(root, 300);
  const CX = 320, CY = 160, HL = 140, HR = 75;
  const PTS = [{ x: CX - HL, y: CY - 42, nome: "S1" }, { x: CX, y: CY - HR, nome: "S2" }, { x: CX + HL, y: CY - 42, nome: "S3" }];
  const ALVO = [180, 90, 0];                                          // normal externa em S1, S2 e S3 (0° = direita, 90° = cima)
  const st = { ang: [270, 270, 270], sel: 0 };
  S("line", { x1: 60, y1: CY, x2: 580, y2: CY, stroke: COR.pos, "stroke-width": 5, "stroke-linecap": "round" }, svg);
  S("rect", { x: CX - HL, y: CY - HR, width: 2 * HL, height: 2 * HR, fill: "rgba(138,106,0,0.07)", stroke: COR.forca, "stroke-width": 3, "stroke-dasharray": "8 6" }, svg);
  PTS.forEach((p, i) => { const sE = criarSeta(svg, "campo", 4); sE.pos(p.x, p.y, p.x, p.y - 46); });
  const dAs = PTS.map(() => criarSeta(svg, "forca", 5));
  PTS.forEach(p => { criarCarga(svg, 6, 0, "").em(p.x, p.y); texto(svg, p.x - 12, p.y - 6, p.nome, "sim-txt forte", "end"); });
  texto(svg, 30, 24, "azul: campo E · amarelo: vetor área dA (você ajusta)", "sim-txt");
  const ler = H("div", "sim-leitura", root);
  const certo = i => dif180(st.ang[i], ALVO[i]) <= 5;
  function desenhar() {
    PTS.forEach((p, i) => {
      const a = st.ang[i] * Math.PI / 180;
      dAs[i].el.setAttribute("stroke-width", i === st.sel ? 6 : 3);
      dAs[i].pos(p.x, p.y, p.x + Math.cos(a) * 52, p.y - Math.sin(a) * 52);
    });
    ler.textContent = `S1 ${certo(0) ? "✓" : "✗"} · S2 ${certo(1) ? "✓" : "✗"} · S3 ${certo(2) ? "✓" : "✗"} · no ponto selecionado, o ângulo entre E e dA é ${fmtNum(dif180(st.ang[st.sel], 90), 0)}°`;
  }
  escolha(root, "Ponto", [["0", "S1 (tampa esquerda)"], ["1", "S2 (lateral)"], ["2", "S3 (tampa direita)"]], "0", v => { st.sel = +v; sA.set(st.ang[st.sel]); desenhar(); });
  const sA = controle(root, { rot: "Direção de dA", min: 0, max: 355, passo: 5, valor: st.ang[0], fmt: v => v + "°", ao: v => { st.ang[st.sel] = v; desenhar(); } });
  botaoVerificar(api, () => {
    const erros = PTS.filter((_, i) => !certo(i)).map(p => p.nome);
    return erros.length === 0 ? true : `Ainda falta acertar ${erros.join(", ")}. O vetor área é perpendicular à superfície e aponta para fora dela.`;
  });
  desenhar();
  root._t = { resolver() { st.ang = ALVO.slice(); sA.set(st.ang[st.sel]); desenhar(); } };
};

/* GAUSS 7 — fluxo na lateral */
SIMS.gaussLateral = function (root, api) {
  const svg = criarPalco(root, 300);
  const CX = 320, CY = 150, K2 = 2 * K_COULOMB * 2e-6;                // λ = 2,0 μC/m
  const st = { r: 10, L: 1 };                                         // r em cm, L em m
  const campo = () => K2 / (st.r / 100);
  const area = () => 2 * Math.PI * (st.r / 100) * st.L;
  const fluxo = () => campo() * area();
  S("line", { x1: 30, y1: CY, x2: 610, y2: CY, stroke: COR.pos, "stroke-width": 6, "stroke-linecap": "round" }, svg);
  const cil = S("rect", { fill: "rgba(138,106,0,0.08)", stroke: COR.forca, "stroke-width": 3, "stroke-dasharray": "8 6" }, svg);
  const setas = Array.from({ length: 8 }, () => criarSeta(svg, "campo", 3));
  texto(svg, 30, 24, "λ = 2,0 μC/m · azul: campo na lateral (paralelo a dA)", "sim-txt");
  const ler = H("div", "sim-leitura", root);
  function desenhar() {
    const w = 100 * st.L, h = 20 + 3.2 * st.r, x0 = CX - w / 2, len = lim(300 / st.r, 6, 60);
    cil.setAttribute("x", x0); cil.setAttribute("y", CY - h); cil.setAttribute("width", w); cil.setAttribute("height", 2 * h);
    [0.15, 0.38, 0.62, 0.85].forEach((f, i) => { const x = x0 + f * w; setas[i].pos(x, CY - h, x, CY - h - len); setas[i + 4].pos(x, CY + h, x, CY + h + len); });
    ler.textContent = `E = ${fmtSci(campo(), 2)} N/C · área da lateral A = 2πrL = ${fmtNum(area(), 3)} m² · fluxo na lateral Φ = E·A = ${fmtSci(fluxo(), 2)} N·m²/C`;
  }
  const rapida = perguntaRapida(api, "Ao dobrar o raio, com λ e L iguais, o fluxo na lateral:", [
    ["Dobrou", false, "O campo caiu pela metade e a área dobrou ao mesmo tempo. Compare os três números do painel antes e depois."],
    ["Não mudou", true, ""],
    ["Caiu pela metade", false, "A área da lateral também dobrou, compensando a queda do campo. Veja o valor de Φ no painel."]]);
  const checar = () => { if (st.r === 20 && st.L === 1) rapida.mostrar(); };
  const sr = controle(root, { rot: "Raio r", min: 5, max: 40, passo: 5, valor: st.r, fmt: v => v + " cm", ao: v => { st.r = v; desenhar(); checar(); } });
  controle(root, { rot: "Comprimento L", min: 0.5, max: 3, passo: 0.5, valor: st.L, fmt: v => fmtNum(v, 1) + " m", ao: v => { st.L = v; desenhar(); checar(); } });
  desenhar();
  root._t = { resolver() { st.r = 20; sr.set(20); desenhar(); rapida.mostrar(); } };
};

/* GAUSS 8 — fluxo nas tampas */
SIMS.gaussTampas = function (root, api) {
  const svg = criarPalco(root, 340);
  const CX = 320, CY = 175, HL = 150, HR = 75;
  const st = { x: CX, y: CY - HR, parte: "lateral", n: [0, -1], lat: false, tampa: false };
  S("line", { x1: 60, y1: CY, x2: 580, y2: CY, stroke: COR.pos, "stroke-width": 5, "stroke-linecap": "round" }, svg);
  S("rect", { x: CX - HL, y: CY - HR, width: 2 * HL, height: 2 * HR, fill: "rgba(138,106,0,0.07)", stroke: COR.forca, "stroke-width": 3, "stroke-dasharray": "8 6" }, svg);
  texto(svg, CX - HL - 8, CY - HR - 8, "S1", "sim-txt forte", "end"); texto(svg, CX, CY + HR + 22, "S2", "sim-txt forte", "middle"); texto(svg, CX + HL + 8, CY - HR - 8, "S3", "sim-txt forte", "start");
  for (const x of [CX - 100, CX - 40, CX + 40, CX + 100]) for (const s of [-1, 1]) criarSeta(svg, "campo", 2).pos(x, CY + s * 22, x, CY + s * 56);
  texto(svg, 30, 24, "azul: campo E · amarelo: vetor área dA no ponto de teste", "sim-txt");
  const sE = criarSeta(svg, "campo", 5), sN = criarSeta(svg, "forca", 5);
  const T = criarCarga(svg, 8, 0, "T");
  const ler = H("div", "sim-leitura", root);
  const afasta = y => (Math.abs(y - CY) < 14 ? (y <= CY ? CY - 14 : CY + 14) : y);
  function projeta(p) {
    const x = lim(p.x, CX - HL, CX + HL), y = lim(p.y, CY - HR, CY + HR);
    const d = [x - (CX - HL), CX + HL - x, y - (CY - HR), CY + HR - y], k = d.indexOf(Math.min(...d));
    if (k === 0) return { x: CX - HL, y: afasta(y), parte: "tampa", n: [-1, 0] };
    if (k === 1) return { x: CX + HL, y: afasta(y), parte: "tampa", n: [1, 0] };
    if (k === 2) return { x, y: CY - HR, parte: "lateral", n: [0, -1] };
    return { x, y: CY + HR, parte: "lateral", n: [0, 1] };
  }
  function desenhar(marca) {
    if (marca) { if (st.parte === "lateral") st.lat = true; else st.tampa = true; }
    const sy = st.y < CY ? -1 : 1, len = lim(3600 / Math.abs(st.y - CY), 18, 80), cos = sy * st.n[1];
    T.em(st.x, st.y);
    sE.pos(st.x - 7, st.y, st.x - 7, st.y + sy * len);
    sN.pos(st.x, st.y, st.x + st.n[0] * 60, st.y + st.n[1] * 60);
    ler.textContent = `Ponto na ${st.parte === "lateral" ? "lateral (S2)" : "tampa (S1 ou S3)"} · ângulo entre E e dA: ${cos ? "0°" : "90°"} · cos θ = ${cos} · contribuição E·dA·cos θ: ${cos ? "diferente de zero" : "zero"}`;
  }
  arrastavel(T.g, svg, () => ({ x: st.x, y: st.y }), p => { Object.assign(st, projeta(p)); desenhar(true); });
  botaoVerificar(api, () => (st.lat && st.tampa ? true : `Falta levar o ponto de teste ${!st.lat && !st.tampa ? "até a lateral e até uma tampa" : !st.lat ? "até a lateral" : "até uma tampa"}.`));
  desenhar(false);
  root._t = { resolver() {
    Object.assign(st, projeta({ x: CX - HL, y: CY - 40 })); desenhar(true);
    Object.assign(st, projeta({ x: CX, y: CY - HR })); desenhar(true);
  } };
};

/* GAUSS 9 — o resultado: E = λ/(2πε₀r) */
SIMS.gaussResultado = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 300);
  const WX = 60, CY = 150, PXCM = 4.4;
  const GX = 390, GY = 270, GW = 220, GH = 210, EMAX = 2e6;
  const st = { lam: 2, r: 10 };
  const E = (lam = st.lam, r = st.r) => 2 * K_COULOMB * lam * 1e-6 / (r / 100);
  const E0 = E(2, 10);
  S("line", { x1: WX, y1: 30, x2: WX, y2: 270, stroke: COR.pos, "stroke-width": 7, "stroke-linecap": "round" }, svg);
  texto(svg, WX + 10, 40, "fio", "sim-txt");
  S("line", { x1: WX, y1: CY + 30, x2: WX + 50 * PXCM, y2: CY + 30, stroke: COR.cinza, "stroke-width": 1.5 }, svg);
  [10, 20, 30, 40].forEach(c => { S("line", { x1: WX + c * PXCM, y1: CY + 26, x2: WX + c * PXCM, y2: CY + 36, stroke: COR.cinza, "stroke-width": 1.5 }, svg); texto(svg, WX + c * PXCM, CY + 54, String(c), "sim-txt", "middle"); });
  texto(svg, WX + 50 * PXCM + 8, CY + 34, "cm", "sim-txt");
  const sE = criarSeta(svg, "forca", 6), P = criarCarga(svg, 8, 0, "P");
  S("path", { d: `M ${GX} ${GY - GH} V ${GY} H ${GX + GW}`, fill: "none", stroke: COR.cinza, "stroke-width": 2 }, svg);
  texto(svg, GX + GW, GY + 20, "r (cm)", "sim-txt", "end"); texto(svg, GX + 6, GY - GH + 4, "E (N/C)", "sim-txt");
  const curva = S("path", { fill: "none", stroke: COR.campo, "stroke-width": 2.5 }, svg);
  const mk = S("circle", { r: 6, fill: COR.forca, stroke: "#fff", "stroke-width": 1.5 }, svg);
  const gx = r => GX + (r - 5) / 45 * GW, gy = e => GY - Math.min(e, EMAX) / EMAX * GH;
  const ler = H("div", "sim-leitura", root);
  function desenhar() {
    const x = WX + st.r * PXCM;
    P.em(x, CY);
    sE.pos(x, CY, x + lim(E() / 8000, 14, 130), CY);
    let d = "";
    for (let r = 5; r <= 50; r += 1) d += `${r > 5 ? "L" : "M"} ${gx(r).toFixed(1)} ${gy(E(st.lam, r)).toFixed(1)} `;
    curva.setAttribute("d", d);
    mk.setAttribute("cx", gx(st.r)); mk.setAttribute("cy", gy(E()));
    ler.textContent = `λ = ${fmtNum(st.lam, 1)} μC/m · r = ${st.r} cm · E = λ/(2πε₀r) = ${fmtSci(E(), 2)} N/C`;
  }
  arrastavel(P.g, svg, () => ({ x: WX + st.r * PXCM, y: CY }), p => { st.r = Math.round(lim((p.x - WX) / PXCM, 5, 50)); sR.set(st.r); desenhar(); });
  const sLam = controle(root, { rot: "Densidade λ", min: 1, max: 5, passo: 0.5, valor: st.lam, fmt: v => fmtNum(v, 1) + " μC/m", ao: v => { st.lam = v; desenhar(); } });
  const sR = controle(root, { rot: "Distância r de P ao fio", min: 5, max: 50, passo: 1, valor: st.r, fmt: v => v + " cm", ao: v => { st.r = v; desenhar(); } });
  botaoVerificar(api, () => {
    if (m === 0) {
      if (st.lam !== 2) return "Nesta missão, deixe λ em 2,0 μC/m e mude só a distância de P ao fio.";
      return Math.abs(E() - 1.8e5) / 1.8e5 <= 0.06 ? true : `O campo está em ${fmtSci(E(), 2)} N/C. Ele cai com 1/r: ${E() > 1.8e5 ? "afaste" : "aproxime"} P.`;
    }
    if (st.lam !== 4) return "Dobre λ: de 2,0 para 4,0 μC/m.";
    return Math.abs(E() - E0) / E0 <= 0.06 ? true : `O campo está em ${fmtSci(E(), 2)} N/C, e o valor de antes era ${fmtSci(E0, 2)} N/C. Com λ maior, o que fazer com r?`;
  });
  desenhar();
  root._t = { resolver() { if (m === 1) { st.lam = 4; sLam.set(4); } st.r = 20; sR.set(20); desenhar(); } };
};

/* =====================================================================
   MISSÕES INTERATIVAS
   ===================================================================== */
function renderMissao(e, qAtual, st) {
  const total = e.perguntas.length, p = e.perguntas[qAtual];
  const pontos = renderPontos(e, qAtual, st);
  const resumoLink = st.fim ? `<button class="link" type="button" data-acao="fechar-revisao">Voltar ao resumo</button>` : "";
  return `<section class="quiz missao" aria-labelledby="enunciado">
      <div class="quiz-cab">
        <div class="quiz-cab-esq"><span>Atividade ${qAtual + 1} de ${total}</span><span class="tag-tipo sim">Jogo interativo</span>${resumoLink}</div>
        <div class="pontos" role="group" aria-label="Navegar entre atividades da cena">${pontos}</div>
      </div>
      <h2 class="enunciado" id="enunciado" tabindex="-1">${esc(p.q)}</h2>
      <div class="sim" id="sim"></div>
      <div id="sim-extra"></div>
      <div class="sim-acoes" id="sim-acoes"></div>
      <div aria-live="polite" id="sim-fb"></div>
      <div id="sim-prox">${renderRodapeQuiz(e, qAtual, st)}</div>
    </section>`;
}
function montarSim() {
  const alvo = $("#sim");
  if (!alvo) return;
  const m = modulo(ui.modulo), e = m.etapas[ui.etapa], st = estadoEtapa(e.id);
  const qAtual = ui.q ?? proximaAberta(e);
  ui.q = qAtual;
  const p = e.perguntas[qAtual];
  const r = st.resp[qAtual] || (st.resp[qAtual] = { t: 0, ok: false });
  alvo.innerHTML = ""; $("#sim-extra").innerHTML = ""; $("#sim-acoes").innerHTML = "";
  const fb = $("#sim-fb");
  function sucesso() {
    fb.innerHTML = `<div class="feedback acerto"><strong>Missão cumprida${r.t === 1 ? ", de primeira" : ""}! +${PONTOS[Math.min(r.t - 1, 2)]} XP</strong><p>${esc(p.exp)}</p></div>`;
    $("#sim-prox").innerHTML = renderRodapeQuiz(e, qAtual, st);
    const bolinhas = document.querySelectorAll(".quiz-cab .pontos .ponto");
    if (bolinhas[qAtual]) bolinhas[qAtual].classList.add("ok");
    $("#xp").textContent = xpTotal();
  }
  const testesAuto = [];
  const api = {
    cfg: p.cfg || {}, acoes: $("#sim-acoes"), extra: $("#sim-extra"),
    auto(t) { testesAuto.push(t); },
    ok() { if (r.ok) return; r.t += 1; r.ok = true; salvar(); sucesso(); },
    errar(d) {
      if (r.ok) return;
      r.t += 1; salvar();
      fb.innerHTML = `<div class="feedback erro"><strong>Ainda não.</strong><p>${esc(d || p.dica || "Continue experimentando.")}</p></div>`;
    },
    aviso(d) { if (!r.ok) fb.innerHTML = `<div class="feedback aviso"><p>${esc(d)}</p></div>`; }
  };
  SIMS[p.sim](alvo, api);
  // reconhecimento automático: depois de cada interação, confere se o estado pedido foi atingido
  if (alvo._ctrl) alvo._ctrl.abort();
  const ctrl = new AbortController(); alvo._ctrl = ctrl;
  const conferir = () => { if (!r.ok && testesAuto.some(t => t() === true)) api.ok(); };
  ["pointermove", "pointerup", "input", "click", "keyup"].forEach(tp => alvo.addEventListener(tp, conferir, { signal: ctrl.signal }));
  const palco = alvo.querySelector(".sim-palco");
  if (palco) palco.insertAdjacentHTML("afterend", '<p class="sim-cel">Deslize o fundo da cena para os lados para ver tudo, ou vire o aparelho na horizontal. Toque em um objeto com contorno amarelo para arrastá-lo.</p>');
  const dica = botaoSim(api.acoes, "Ver dica", () => api.aviso(p.dica));
  dica.dataset.sim = "dica";
  botaoSim(api.acoes, "Reiniciar", () => { if (!r.ok) fb.innerHTML = ""; montarSim(); }).dataset.sim = "reiniciar";
  if (r.ok) sucesso();
}

/* =====================================================================
   INTERAÇÃO E NAVEGAÇÃO LIVRE
   ===================================================================== */
document.addEventListener("click", ev => {
  const alvo = ev.target.closest("button");
  if (!alvo) return;
  const m = modulo(ui.modulo);

  if (alvo.dataset.modulo) {
    ui = { modulo: alvo.dataset.modulo, etapa: null, q: null, ultimaErrada: null, revisao: false, explorar: false };
    render(); return;
  }
  if (alvo.dataset.etapa != null) {
    ui.etapa = +alvo.dataset.etapa; ui.q = 0; ui.ultimaErrada = null; ui.revisao = false; ui.explorar = false;
    render(); $(".etapa h1").scrollIntoView({ block: "start", behavior: "smooth" }); return;
  }
  if (alvo.dataset.irQ != null) {
    ui.q = +alvo.dataset.irQ; ui.ultimaErrada = null; ui.revisao = false;
    renderQuiz();
    const en = $("#enunciado"); if (en) en.focus({ preventScroll: true });
    $("#quiz").scrollIntoView({ block: "nearest", behavior: "smooth" });
    return;
  }
  if (alvo.dataset.opcao != null) { responder(m, +alvo.dataset.opcao); return; }

  const acao = alvo.dataset.acao;
  if (!acao) return;
  const e = m.etapas ? m.etapas[ui.etapa] : null;
  if (acao === "anterior") {
    const qAtual = ui.q ?? 0;
    if (qAtual > 0) {
      ui.q = qAtual - 1;
      ui.ultimaErrada = null;
      renderQuiz();
      const en = $("#enunciado"); if (en) en.focus({ preventScroll: true });
      $("#quiz").scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  } else if (acao === "proxima") {
    const qAtual = ui.q ?? 0;
    if (e && qAtual < e.perguntas.length - 1) {
      ui.q = qAtual + 1;
      ui.ultimaErrada = null;
      renderQuiz();
      const en = $("#enunciado"); if (en) en.focus({ preventScroll: true });
      $("#quiz").scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  } else if (acao === "concluir") {
    const st = estadoEtapa(e.id);
    st.fim = e.perguntas.every((_, i) => st.resp[i] && st.resp[i].ok);
    salvar(); ui.q = null; ui.ultimaErrada = null; ui.explorar = false; render();
    $("#quiz").scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else if (acao === "ir") {
    ui.etapa = +alvo.dataset.alvo; ui.q = 0; ui.ultimaErrada = null; ui.revisao = false; ui.explorar = false;
    render(); window.scrollTo({ top: 0, behavior: "smooth" });
  } else if (acao === "explorar") {
    ui.explorar = true; ui.revisao = false; ui.q = 0; renderQuiz();
  } else if (acao === "revisar") {
    ui.revisao = true; ui.explorar = false; renderQuiz();
  } else if (acao === "fechar-revisao") {
    ui.revisao = false; ui.explorar = false; renderQuiz();
  } else if (acao === "refazer") {
    progresso.etapas[e.id] = { resp: [], fim: false }; salvar();
    ui.q = 0; ui.ultimaErrada = null; ui.revisao = false; ui.explorar = false; render();
  } else if (acao === "recomecar") {
    if (!alvo.dataset.confirmar) {
      alvo.dataset.confirmar = "1";
      alvo.textContent = "Clique de novo para apagar seu progresso nesta guia";
      setTimeout(() => { if (alvo.isConnected) { delete alvo.dataset.confirmar; alvo.textContent = "Recomeçar esta trilha"; } }, 4000);
      return;
    }
    m.etapas.forEach(x => delete progresso.etapas[x.id]); salvar();
    ui.etapa = 0; ui.q = 0; ui.ultimaErrada = null; ui.revisao = false; ui.explorar = false; render();
  }
});

function responder(m, oi) {
  const e = m.etapas[ui.etapa];
  const st = estadoEtapa(e.id);
  const qAtual = ui.q ?? proximaAberta(e);
  ui.q = qAtual;
  const p = e.perguntas[qAtual];
  const r = st.resp[qAtual] || (st.resp[qAtual] = { t: 0, ok: false, erradas: [] });
  if (r.ok) return;
  r.t += 1;
  if (p.op[oi][1]) { r.ok = true; ui.ultimaErrada = null; }
  else { r.erradas = [...new Set([...(r.erradas || []), oi])]; ui.ultimaErrada = oi; }
  salvar();
  renderQuiz();
  if (r.ok) {
    const b = $('.rodape-quiz [data-acao="proxima"], .rodape-quiz [data-acao="concluir"]');
    if (b) b.focus({ preventScroll: true });
  } else {
    const prox = document.querySelector(".opcao:not(:disabled)");
    if (prox) prox.focus({ preventScroll: true });
  }
}

/* ---------- tema ---------- */
(function () {
  let salvo = null;
  try { salvo = localStorage.getItem("trilha-tema"); } catch (e) { /* ignora */ }
  if (salvo) document.documentElement.dataset.theme = salvo;
  $("#tema").addEventListener("click", () => {
    const escuroAgora = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    const novo = escuroAgora ? "light" : "dark";
    document.documentElement.dataset.theme = novo;
    try { localStorage.setItem("trilha-tema", novo); } catch (e) { /* ignora */ }
  });
})();

render();
</script>
</body>
