<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilha de Eletromagnetismo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --fundo: #F4F6F3;
  --grade: rgba(30, 60, 40, 0.06);
  --superficie: #FFFFFF;
  --superficie-2: #ECEFEA;
  --linha: #D5D9D2;
  --tinta: #1C1D1B;
  --tinta-2: #565A54;
  --destaque: #8A6A00;
  --destaque-fundo: #FFF3C2;
  --destaque-tinta: #1C1D1B;
  --erro: #B0362B;
  --erro-fundo: #FBE6E3;
  --acerto: #2F7524;
  --acerto-fundo: #E3F1DC;
  --azul: #1B7D98;
  --carga-pos: #CF5044;
  --carga-neg: #1F93B5;
  --sombra: 0 1px 0 rgba(0,0,0,0.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #181818;
    --grade: rgba(255, 255, 255, 0.035);
    --superficie: #202020;
    --superficie-2: #2A2A2A;
    --linha: #383838;
    --tinta: #ECEAE4;
    --tinta-2: #A9A7A1;
    --destaque: #F7D96F;
    --destaque-fundo: #3A3320;
    --destaque-tinta: #181818;
    --erro: #E8786C;
    --erro-fundo: #3B2320;
    --acerto: #9BD17E;
    --acerto-fundo: #22321D;
    --azul: #29ABCA;
    --carga-pos: #CF5044;
    --carga-neg: #29ABCA;
    --sombra: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fundo: #181818;
  --grade: rgba(255, 255, 255, 0.035);
  --superficie: #202020;
  --superficie-2: #2A2A2A;
  --linha: #383838;
  --tinta: #ECEAE4;
  --tinta-2: #A9A7A1;
  --destaque: #F7D96F;
  --destaque-fundo: #3A3320;
  --destaque-tinta: #181818;
  --erro: #E8786C;
  --erro-fundo: #3B2320;
  --acerto: #9BD17E;
  --acerto-fundo: #22321D;
  --azul: #29ABCA;
  --carga-pos: #CF5044;
  --carga-neg: #29ABCA;
  --sombra: none;
  color-scheme: dark;
}
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background-color: var(--fundo);
  background-image:
    linear-gradient(var(--grade) 1px, transparent 1px),
    linear-gradient(90deg, var(--grade) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--tinta);
  font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 17px;
  line-height: 1.55;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--superficie);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--destaque); outline-offset: 2px; }

/* ---------- Cabeçalho ---------- */
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--superficie); border-bottom: 1px solid var(--linha);
  display: flex; align-items: center; gap: 20px; padding: 10px 24px; flex-wrap: wrap;
}
.marca { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; white-space: nowrap; }
.marca svg { flex: none; }
.guias { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.guias::-webkit-scrollbar { display: none; }
.guia {
  border: 1px solid transparent; background: none; border-radius: 999px; padding: 6px 14px;
  cursor: pointer; white-space: nowrap; color: var(--tinta-2); display: flex; align-items: center; gap: 8px;
}
.guia .num { font-weight: 700; }
.guia[aria-selected="true"] { background: var(--destaque); color: var(--destaque-tinta); font-weight: 700; }
.guia .em-breve { font-size: 13px; padding: 1px 8px; border-radius: 999px; background: var(--superficie-2); color: var(--tinta-2); }
.guia[aria-selected="true"] .em-breve { background: rgba(0,0,0,0.12); color: inherit; }
.placar { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
.xp { display: flex; align-items: baseline; gap: 6px; }
.xp strong { font-size: 22px; color: var(--destaque); font-variant-numeric: tabular-nums; }
.xp span { color: var(--tinta-2); font-size: 14px; }
.tema {
  border: 1px solid var(--linha); background: var(--superficie-2); border-radius: 8px;
  width: 36px; height: 36px; cursor: pointer; display: grid; place-items: center;
}

/* ---------- Corpo ---------- */
.palco { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px; max-width: 1180px; margin: 0 auto; padding: 28px 24px 64px; }
.mapa { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); align-self: start; }
.mapa-cab { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 6px; }
.mapa-cab h2 { margin: 0; font-size: 16px; }
.mapa-cab span { color: var(--tinta-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.barra { height: 6px; background: var(--superficie-2); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
.barra i { display: block; height: 100%; background: var(--destaque); border-radius: 3px; transition: width .5s ease; }
.linha-campo { position: relative; }
.linha-campo svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.no {
  position: absolute; display: flex; align-items: center; gap: 12px; background: none; border: 0;
  padding: 0; cursor: pointer; text-align: left; width: 240px;
}
.no:disabled { cursor: not-allowed; }
.no .bola {
  flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; font-size: 14px; border: 2px solid var(--linha); background: var(--superficie); color: var(--tinta-2);
  font-variant-numeric: tabular-nums;
}
.no .rotulo { font-size: 14px; line-height: 1.25; color: var(--tinta-2); }
.no .rotulo small { display: block; color: var(--destaque); letter-spacing: 1px; font-size: 12px; }
.no.feito .bola { background: var(--destaque); border-color: var(--destaque); color: var(--destaque-tinta); }
.no.feito .rotulo { color: var(--tinta); }
.no.atual .bola { border-color: var(--destaque); color: var(--tinta); box-shadow: 0 0 0 5px var(--destaque-fundo); }
.no.atual .rotulo { color: var(--tinta); font-weight: 700; }
.no.aberta .bola { outline: 2px solid var(--tinta); outline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) {
  .no.atual .bola { animation: pulso 2.2s ease-in-out infinite; }
  @keyframes pulso { 0%, 100% { box-shadow: 0 0 0 4px var(--destaque-fundo); } 50% { box-shadow: 0 0 0 9px var(--destaque-fundo); } }
}
.recomecar { margin-top: 18px; background: none; border: 0; color: var(--tinta-2); text-decoration: underline; cursor: pointer; padding: 0; font-size: 14px; }

/* ---------- Etapa ---------- */
.etapa { max-width: 760px; }
.etapa-pos { color: var(--tinta-2); margin: 0; font-size: 15px; }
.etapa h1 { font-size: clamp(28px, 4vw, 38px); line-height: 1.15; margin: 4px 0 14px; letter-spacing: -0.5px; }
.texto { margin: 0 0 22px; max-width: 64ch; font-size: 18px; }
.video {
  position: relative; aspect-ratio: 16 / 9; background: #181818; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--linha); margin-bottom: 10px;
}
.video video { width: 100%; height: 100%; display: block; background: #181818; }
.video .vazio[hidden] { display: none; }
.video .vazio {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #CFCDC6;
}
.video .vazio p { margin: 6px 0; max-width: 46ch; }
.video .vazio code { background: #2B2B2B; padding: 2px 6px; border-radius: 4px; font-size: 14px; color: #F7D96F; }
.video-acoes { display: flex; gap: 14px; align-items: center; margin-bottom: 30px; font-size: 14px; color: var(--tinta-2); min-height: 22px; flex-wrap: wrap; }
.botao {
  border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 700; cursor: pointer;
  background: var(--destaque); color: var(--destaque-tinta);
}
.botao.sec { background: var(--superficie-2); color: var(--tinta); border: 1px solid var(--linha); }
.botao:disabled { opacity: .5; cursor: wait; }
.link { background: none; border: 0; padding: 0; color: var(--azul); text-decoration: underline; cursor: pointer; font-size: 14px; }

.quiz { background: var(--superficie); border: 1px solid var(--linha); border-radius: 14px; padding: 22px 24px 24px; box-shadow: var(--sombra); }
.quiz-cab { display: flex; justify-content: space-between; align-items: center; color: var(--tinta-2); font-size: 15px; margin-bottom: 8px; }
.pontos { display: flex; gap: 6px; }
.pontos i { width: 10px; height: 10px; border-radius: 50%; background: var(--superficie-2); border: 1px solid var(--linha); }
.pontos i.ok { background: var(--acerto); border-color: var(--acerto); }
.pontos i.agora { background: var(--destaque); border-color: var(--destaque); }
.enunciado { font-size: 21px; line-height: 1.35; margin: 0 0 16px; }
.opcoes { display: grid; gap: 10px; }
.opcao {
  display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; text-align: left;
  border: 1.5px solid var(--linha); background: var(--superficie); border-radius: 10px; padding: 12px 14px; cursor: pointer;
}
.opcao .letra {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700;
  background: var(--superficie-2); font-size: 15px;
}
.opcao:hover:not(:disabled) { border-color: var(--destaque); }
.opcao:disabled { cursor: default; }
.opcao.errada { border-color: var(--erro); background: var(--erro-fundo); }
.opcao.errada .letra { background: var(--erro); color: #fff; }
.opcao.certa { border-color: var(--acerto); background: var(--acerto-fundo); }
.opcao.certa .letra { background: var(--acerto); color: #fff; }
.opcao.apagada { opacity: .55; }
.feedback { margin-top: 14px; border-radius: 10px; padding: 14px 16px; border-left: 5px solid; }
.feedback[hidden] { display: none; }
.feedback.erro { background: var(--erro-fundo); border-color: var(--erro); }
.feedback.acerto { background: var(--acerto-fundo); border-color: var(--acerto); }
.feedback strong { display: block; margin-bottom: 4px; }
.feedback p { margin: 0; }
.feedback .tente { margin-top: 8px; color: var(--tinta-2); font-size: 15px; }
.rodape-quiz { display: flex; justify-content: flex-end; margin-top: 16px; }

.conclusao { text-align: left; }
.estrelas { display: flex; gap: 8px; margin: 6px 0 10px; }
.estrelas svg { width: 40px; height: 40px; }
.conclusao h2 { margin: 0 0 6px; font-size: 24px; }
.conclusao p { margin: 0 0 16px; color: var(--tinta-2); }
.conclusao .acoes { display: flex; gap: 12px; flex-wrap: wrap; }

.revisao { display: grid; gap: 14px; margin-top: 8px; }
.revisao article { border-top: 1px solid var(--linha); padding-top: 14px; }
.revisao h3 { font-size: 17px; margin: 0 0 6px; }
.revisao .resp { color: var(--acerto); font-weight: 700; margin: 0 0 4px; }
.revisao p { margin: 0; }

.breve { max-width: 640px; }
.breve h1 { font-size: 34px; margin: 6px 0 12px; }
.breve p { font-size: 18px; }
.breve ol { padding-left: 22px; color: var(--tinta-2); }

.aviso { color: var(--tinta-2); font-size: 14px; margin-top: 10px; }

@media (max-width: 860px) {
  .palco { grid-template-columns: 1fr; gap: 18px; padding-top: 18px; }
  .mapa { position: static; }
  .linha-campo { height: auto !important; display: flex; gap: 10px; overflow-x: auto; padding: 6px 2px 10px; scrollbar-width: thin; }
  .linha-campo svg { display: none; }
  .no { position: static; width: auto; flex: none; }
  .no .rotulo { display: none; }
  .topo { padding: 10px 16px; gap: 10px; }
  .guias { order: 3; flex-basis: 100%; }
}
</style>
</head>
<body>
<header class="topo">
  <div class="marca">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
      <circle cx="7" cy="14" r="6" fill="#CF5044"/><path d="M4.5 14h5M7 11.5v5" stroke="#fff" stroke-width="1.8"/>
      <circle cx="21" cy="14" r="6" fill="#29ABCA"/><path d="M18.5 14h5" stroke="#fff" stroke-width="1.8"/>
    </svg>
    Trilha de Física III
  </div>
  <nav class="guias" role="tablist" aria-label="Módulos" id="guias"></nav>
  <div class="placar">
    <div class="xp" aria-live="polite"><strong id="xp">0</strong><span>XP</span></div>
    <button class="tema" id="tema" type="button" aria-label="Alternar tema claro e escuro">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 2a7 7 0 0 1 0 14z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<main class="palco" id="palco"></main>


<script>
/* =====================================================================
   CONTEÚDO DA TRILHA
   Para adicionar um módulo novo, inclua um objeto em MODULOS com etapas.
   ===================================================================== */
const MODULOS = [
  {
    id: "coulomb",
    titulo: "Lei de Coulomb",
    etapas: [
      {
        id: "c01", cena: "CoulombAbertura", titulo: "Atração e repulsão",
        texto: "Há mais de dois mil anos, os gregos perceberam que o âmbar esfregado em lã atraía pedacinhos de palha. Nesta cena, o mesmo efeito aparece com bastões de vidro e de plástico, e a força elétrica mostra que pode atrair ou repelir.",
        perguntas: [
          { q: "Que fenômeno faz o âmbar atrair a palha depois de ser esfregado na lã?",
            op: [
              ["Eletrização por atrito", true, "Ao esfregar dois materiais, elétrons passam de um para o outro. O âmbar fica com excesso de carga e passa a atrair objetos leves."],
              ["Magnetismo", false, "O âmbar não é um ímã. Forças magnéticas aparecem com ímãs ou correntes elétricas e atrairiam objetos de ferro, não palha."],
              ["Atração gravitacional", false, "A gravidade entre objetos tão pequenos é desprezível e não muda quando o âmbar é esfregado. O efeito só aparece depois do atrito."],
              ["Indução eletromagnética", false, "Indução eletromagnética exige um campo magnético variando no tempo. Aqui não há ímã nem corrente: há carga transferida por atrito."]
            ] },
          { q: "Dois bastões de vidro foram esfregados com seda. O que acontece quando o segundo se aproxima do bastão pendurado?",
            op: [
              ["O bastão pendurado se afasta: eles se repelem", true, "Os dois bastões ficam positivos. Cargas de mesmo sinal se repelem, então o bastão pendurado gira para longe."],
              ["Os bastões se atraem", false, "Atração acontece entre cargas de sinais opostos. Os dois bastões foram esfregados do mesmo jeito e têm carga de mesmo sinal."],
              ["Nada acontece, porque o vidro é isolante", false, "Ser isolante impede que a carga se espalhe ou escape, mas não impede que o bastão carregado exerça força. É justamente por isso que ele guarda a carga."],
              ["Um bastão descarrega no outro e os dois ficam neutros", false, "Para descarregar, a carga teria de passar de um bastão para o outro, o que exigiria contato e um material condutor. Os bastões nem se tocam, e o vidro não conduz."]
            ] },
          { q: "Ao esfregar o vidro com seda, o que de fato muda de lugar?",
            op: [
              ["Elétrons passam do vidro para a seda", true, "Uma pequena quantidade de elétrons sai do vidro e vai para a seda. O vidro fica com excesso de carga positiva, e a seda, com a mesma quantidade de carga negativa."],
              ["Prótons passam da seda para o vidro", false, "Prótons ficam presos nos núcleos dos átomos. Na eletrização por atrito, quem se move são os elétrons."],
              ["Cargas positivas são criadas no vidro", false, "Carga não é criada nem destruída: ela se conserva. O vidro fica positivo porque perdeu elétrons."],
              ["Nada muda de lugar; o atrito só aquece o vidro", false, "O aquecimento existe, mas não explica a repulsão. A força só aparece porque houve transferência de carga."]
            ] }
        ]
      },
      {
        id: "c02", cena: "CoulombCondutores", titulo: "Condutores, isolantes e indução",
        texto: "Objetos comuns têm a mesma quantidade de carga positiva e negativa. O que diferencia os materiais é a liberdade dos elétrons para se mover. Observe o que acontece com uma barra de cobre neutra quando um plástico carregado se aproxima.",
        perguntas: [
          { q: "Como se chama a separação de cargas na barra de cobre causada pelo plástico, sem que eles se toquem?",
            op: [
              ["Indução eletrostática", true, "A carga do plástico empurra os elétrons livres do cobre para a ponta oposta, sem contato. A barra continua neutra no total, mas com as cargas separadas."],
              ["Eletrização por atrito", false, "Atrito exige esfregar um material no outro. Aqui o plástico apenas se aproxima da barra."],
              ["Eletrização por contato", false, "Por contato, carga passaria do plástico para o cobre. O plástico não toca a barra, e ela continua com carga total zero."],
              ["Magnetização", false, "Não há ímã nem corrente envolvidos. A separação é causada pela força elétrica sobre os elétrons livres."]
            ] },
          { q: "A barra de cobre está neutra. Por que mesmo assim ela é atraída pelo plástico negativo?",
            op: [
              ["A ponta positiva fica mais perto do plástico, e a atração vence a repulsão", true, "Os elétrons fogem para a ponta distante e deixam a ponta próxima positiva. Como a força diminui com a distância, a atração da ponta próxima é maior que a repulsão da ponta distante."],
              ["A barra ficou com carga negativa", false, "Nenhum elétron entrou ou saiu da barra; eles só mudaram de lugar dentro dela. A carga total continua zero."],
              ["O plástico passou sua carga para a barra", false, "Não houve contato, então não houve transferência. O plástico continua negativo e a barra, neutra."],
              ["A gravidade do plástico puxa a barra", false, "A atração gravitacional entre esses objetos é bilhões de vezes menor que a força elétrica envolvida. Ela não explicaria o giro visível."]
            ] },
          { q: "No cobre, quais partículas se deslocam quando o plástico se aproxima?",
            op: [
              ["Elétrons de condução", true, "Nos metais, alguns elétrons não ficam presos a um átomo e se movem livremente. São eles que se redistribuem."],
              ["Íons positivos", false, "Os íons positivos formam a rede do metal e ficam no lugar. Para uma região ficar positiva, basta que os elétrons saiam dela."],
              ["Prótons", false, "Prótons estão presos nos núcleos, dentro dos íons. Eles não se deslocam pelo metal."],
              ["Nêutrons", false, "Nêutrons não têm carga, então não sentem a força elétrica do plástico."]
            ] },
          { q: "Qual destes materiais é um isolante?",
            op: [
              ["Vidro", true, "No vidro as cargas ficam presas no lugar. É por isso que o bastão de vidro consegue guardar a carga do atrito."],
              ["Cobre", false, "O cobre é o exemplo clássico de condutor: tem muitos elétrons livres. Por isso é usado em fios elétricos."],
              ["Corpo humano", false, "O corpo humano conduz eletricidade por causa da água e dos sais dissolvidos. É por isso que levamos choque."],
              ["Água da torneira", false, "A água da torneira tem sais dissolvidos e conduz. Só a água destilada é isolante."]
            ] }
        ]
      },
      {
        id: "c03", cena: "CoulombBalanca", titulo: "A balança de torção",
        texto: "Em 1785, Coulomb transformou a força elétrica em número. Ele mediu o quanto um fio fino de metal torcia quando duas esferas carregadas se repeliam, e criou um jeito simples de dividir cargas ao meio.",
        perguntas: [
          { q: "O que Coulomb lia diretamente na balança de torção?",
            op: [
              ["O ângulo de torção do fio", true, "O torque do fio é proporcional ao ângulo, τ = K d⁴ φ / l. Lendo o ângulo e conhecendo o fio, ele obtinha a força."],
              ["A carga de cada esfera", false, "Não havia como medir carga diretamente. Coulomb comparava cargas pela força que exerciam e as dividia por contato."],
              ["A força, num dinamômetro de mola", false, "As forças eram pequenas demais para uma mola comum. O instrumento sensível era a torção de um fio fino."],
              ["A massa das esferas", false, "A massa não muda com a carga e não entra no cálculo da força elétrica."]
            ] },
          { q: "Uma esfera com carga q₀ toca uma esfera idêntica neutra. Depois, essa segunda esfera toca outra esfera idêntica neutra. Com quanto fica a última?",
            op: [

/* =====================================================================
   ESTADO, PERSISTÊNCIA E CAPACIDADES
   ===================================================================== */
const CHAVE_LOCAL = "trilha-fisica3-progresso-v1";
const PONTOS = [10, 6, 3];          // XP por acertar na 1ª, 2ª e 3ª tentativa ou depois
let progresso = carregarLocal();   // { etapas: { c01: { resp: [{t, ok}], fim: bool } }, atualizado }
let refProgresso = null;           // na versão do GitHub o progresso fica no navegador
let ui = { modulo: "coulomb", etapa: null, q: null, ultimaErrada: null, revisao: false };

function carregarLocal() {
  try {
    const t = localStorage.getItem(CHAVE_LOCAL);
    if (t) return JSON.parse(t);
  } catch (e) { /* armazenamento indisponível */ }
  return { etapas: {}, atualizado: 0 };
}
let gravandoDb = false, pendenteDb = false, timerDb = null;
function salvar() {
  progresso.atualizado = Date.now();
  try { localStorage.setItem(CHAVE_LOCAL, JSON.stringify(progresso)); } catch (e) { /* ignora */ }
  if (!refProgresso) return;
  clearTimeout(timerDb);
  timerDb = setTimeout(gravarDb, 700);
}
async function gravarDb() {
  if (gravandoDb) { pendenteDb = true; return; }
  gravandoDb = true;
  try { await refProgresso.set({ etapas: progresso.etapas, atualizado: progresso.atualizado }); }
  catch (e) { /* segue só com o armazenamento local */ }
  gravandoDb = false;
  if (pendenteDb) { pendenteDb = false; gravarDb(); }
}

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function modulo(id) { return MODULOS.find(m => m.id === id); }
function etapasDe(m) { return m.etapas || []; }
function estadoEtapa(id) {
  if (!progresso.etapas[id]) progresso.etapas[id] = { resp: [], fim: false };
  return progresso.etapas[id];
}
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function ordemOpcoes(etapaId, qi, n) {
  // embaralha de forma estável: a mesma pergunta sempre mostra a mesma ordem
  const idx = [...Array(n).keys()];
  let s = hash(etapaId + ":" + qi);
  for (let i = n - 1; i > 0; i--) { s = (Math.imul(s, 1103515245) + 12345) >>> 0; const j = s % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx;
}
function xpDaEtapa(id) {
  const e = progresso.etapas[id]; if (!e) return 0;
  return e.resp.reduce((s, r) => s + (r && r.ok ? PONTOS[Math.min(r.t - 1, 2)] : 0), 0);
}
function xpTotal() { return Object.keys(progresso.etapas).reduce((s, id) => s + xpDaEtapa(id), 0); }
function estrelas(id) {
  const e = progresso.etapas[id]; if (!e || !e.fim) return 0;
  const erros = e.resp.reduce((s, r) => s + (r ? r.t - 1 : 0), 0);
  return erros === 0 ? 3 : erros <= 2 ? 2 : 1;
}
function liberada(m, i) {
  return true;   // todas as etapas abertas: o aluno pode estudar em qualquer ordem
}
function proximaAberta(e, depois = -1) {
  const st = estadoEtapa(e.id);
  const i = e.perguntas.findIndex((_, k) => k > depois && !(st.resp[k] && st.resp[k].ok));
  if (i !== -1) return i;
  const j = e.perguntas.findIndex((_, k) => !(st.resp[k] && st.resp[k].ok));
  return j === -1 ? e.perguntas.length - 1 : j;
}
function etapaAtualIndex(m) {
  const i = m.etapas.findIndex(e => !(progresso.etapas[e.id] || {}).fim);
  return i === -1 ? m.etapas.length - 1 : i;
}

      stroke="${ok ? "var(--destaque)" : "var(--linha)"}" stroke-width="1.8" stroke-linecap="round"/>`);
  }
  const yProgresso = feitas === 0 ? 28 : feitas >= n ? altura : ys[feitas - 1];

    const est = st.fim ? "★".repeat(estrelas(e.id)) + "☆".repeat(3 - estrelas(e.id)) : "";
    const rot = `Etapa ${i + 1}: ${e.titulo}${st.fim ? ", concluída" : lib ? "" : ", bloqueada"}`;

    </button>`;
  }).join("");
  return `
    <aside class="mapa" aria-label="Mapa da trilha">
      <div class="mapa-cab"><h2>${esc(m.titulo)}</h2><span>${feitas} de ${n}</span></div>

          <defs><clipPath id="clipFeito"><rect x="0" y="0" width="80" height="${yProgresso}"/></clipPath></defs>
          <path d="${d}" fill="none" stroke="var(--linha)" stroke-width="2.5"/>
          <path d="${d}" fill="none" stroke="var(--destaque)" stroke-width="2.5" clip-path="url(#clipFeito)"/>
          ${setas.join("")}
          <circle cx="34" cy="14" r="13" fill="var(--carga-pos)"/>
          <path d="M28 14h12M34 8v12" stroke="#fff" stroke-width="2.2"/>
          <circle cx="34" cy="${altura - 14}" r="13" fill="var(--carga-neg)"/>
          <path d="M28 ${altura - 14}h12" stroke="#fff" stroke-width="2.2"/>
        </svg>
        ${nos}
      </div>
      <button class="recomecar" type="button" data-acao="recomecar">Recomeçar esta trilha</button>
    </aside>`;
}

function caminhoVideo(m, e) { return "videos/" + m.id + "/" + e.cena + ".mp4"; }
function renderVideo(m, e) {
  const caminho = caminhoVideo(m, e);
  return `<div class="video" id="video">
      <video controls preload="metadata" playsinline src="${esc(caminho)}"></video>
      <div class="vazio" hidden><div>
        <p><strong>O vídeo desta cena ainda não foi adicionado.</strong></p>
        <p>Coloque o arquivo em <code>${esc(caminho)}</code></p>
        <p>Você já pode responder às perguntas.</p>
      </div></div>
    </div>`;
}
function ligarVideo() {
  const v = document.querySelector("#video video");
  if (!v) return;
  const falhou = () => { const vz = document.querySelector("#video .vazio"); if (vz) vz.hidden = false; v.remove(); };
  if (v.error) falhou(); else v.addEventListener("error", falhou, { once: true });
}

function renderPergunta(m, e, ei) {
  const st = estadoEtapa(e.id);
  const total = e.perguntas.length;
  if (st.fim && !ui.revisao) return renderConclusao(m, e, ei);
  if (st.fim && ui.revisao) return renderRevisao(e);
  const qAtual = ui.q ?? proximaAberta(e);
  const p = e.perguntas[qAtual];
  const r = st.resp[qAtual] || { t: 0, ok: false, erradas: [] };
  const ordem = ordemOpcoes(e.id, qAtual, p.op.length);
  const letras = "ABCDE";
  const pontos = e.perguntas.map((_, i) => {
    const ri = st.resp[i];
    return `<i class="${ri && ri.ok ? "ok" : i === qAtual ? "agora" : ""}"></i>`;
  }).join("");
  const opcoes = ordem.map((oi, pos) => {
    const [txt, certa] = p.op[oi];
    let cls = "";
    if (r.ok && certa) cls = "certa";
    else if ((r.erradas || []).includes(oi)) cls = "errada";
    else if (r.ok) cls = "apagada";
    const desab = r.ok || (r.erradas || []).includes(oi);
    return `<button class="opcao ${cls}" type="button" data-opcao="${oi}" ${desab ? "disabled" : ""}>
      <span class="letra">${letras[pos]}</span><span>${esc(txt)}</span></button>`;
  }).join("");
  let fb = "";
  if (r.ok) {
    const certa = p.op.find(o => o[1]);
    fb = `<div class="feedback acerto"><strong>Isso mesmo${r.t === 1 ? ", de primeira" : ""}! +${PONTOS[Math.min(r.t - 1, 2)]} XP</strong><p>${esc(certa[2])}</p></div>`;
  } else if (ui.ultimaErrada != null && (r.erradas || []).includes(ui.ultimaErrada)) {
    const o = p.op[ui.ultimaErrada];
    fb = `<div class="feedback erro"><strong>Ainda não. Por que “${esc(o[0])}” está errada:</strong><p>${esc(o[2])}</p>
      <p class="tente">Escolha outra alternativa.</p></div>`;
  }
  const ultima = qAtual === total - 1;
  const proxima = r.ok ? `<div class="rodape-quiz"><button class="botao" type="button" data-acao="${ultima ? "concluir" : "proxima"}">
      ${ultima ? "Concluir etapa" : "Próxima pergunta"}</button></div>` : "";
  return `<section class="quiz" aria-labelledby="enunciado">
      <div class="quiz-cab"><span>Pergunta ${qAtual + 1} de ${total}</span><span class="pontos" aria-hidden="true">${pontos}</span></div>
      <h2 class="enunciado" id="enunciado">${esc(p.q)}</h2>
      <div class="opcoes" role="group" aria-label="Alternativas">${opcoes}</div>
      <div aria-live="polite">${fb}</div>
      ${proxima}
    </section>`;
}

function renderConclusao(m, e, ei) {
  const n = estrelas(e.id), xp = xpDaEtapa(e.id);
  const prox = m.etapas[ei + 1];
  const frase = n === 3 ? "Todas as respostas certas de primeira." : n === 2 ? "Quase perfeito: poucos erros pelo caminho." : "Etapa vencida. Revise as explicações para fixar.";
  const botaoProx = prox
    ? `<button class="botao" type="button" data-acao="ir" data-alvo="${ei + 1}">Ir para a etapa ${ei + 2}: ${esc(prox.titulo)}</button>`
    : "";
  const proxMod = MODULOS[MODULOS.indexOf(m) + 1];
  const fimModulo = !prox ? `<p><strong>Você concluiu a trilha: ${esc(m.titulo)}.</strong>${proxMod ? ` A próxima guia é ${esc(proxMod.titulo)}.` : ""}</p>` : "";
  return `<section class="quiz conclusao" aria-live="polite">
      <div class="estrelas" role="img" aria-label="${n} de 3 estrelas">${[0, 1, 2].map(i => svgEstrela(i < n)).join("")}</div>
      <h2>Etapa concluída: +${xp} XP</h2>
      <p>${frase}</p>
      ${fimModulo}
      <div class="acoes">${botaoProx}
        <button class="botao sec" type="button" data-acao="revisar">Rever respostas</button>
        <button class="botao sec" type="button" data-acao="refazer">Refazer a etapa</button>
      </div>
    </section>`;
}

function renderRevisao(e) {
  const itens = e.perguntas.map((p, i) => {
    const c = p.op.find(o => o[1]);
    return `<article><h3>${i + 1}. ${esc(p.q)}</h3><p class="resp">${esc(c[0])}</p><p>${esc(c[2])}</p></article>`;
  }).join("");
  return `<section class="quiz"><div class="quiz-cab"><span>Revisão das respostas</span>
      <button class="link" type="button" data-acao="fechar-revisao">Voltar ao resumo</button></div>
      <div class="revisao">${itens}</div></section>`;
}

function renderEtapa(m) {
  const ei = ui.etapa;
  const e = m.etapas[ei];
  return `<div class="etapa">
      <p class="etapa-pos">Etapa ${ei + 1} de ${m.etapas.length}</p>
      <h1>${esc(e.titulo)}</h1>
      <p class="texto">${esc(e.texto)}</p>
      ${renderVideo(m, e)}
      <div id="quiz">${renderPergunta(m, e, ei)}</div>
    </div>`;
}

function renderEmBreve(m) {
  return `<div></div><div class="breve">
      <p class="etapa-pos">Em preparação</p>
      <h1>${esc(m.titulo)}</h1>
      <p>${esc(m.descricao)}</p>
      ${m.previstas && m.previstas.length ? `<p>Etapas previstas:</p>
      <ol>${m.previstas.map(t => `<li>${esc(t)}</li>`).join("")}</ol>` : ""}
      <p class="aviso">Enquanto esta guia é montada, siga pelas guias anteriores.</p>
    </div>`;
}

function render() {
  renderGuias();
  const m = modulo(ui.modulo);
  if (m.emBreve) { $("#palco").innerHTML = renderEmBreve(m); return; }
  if (ui.etapa == null) ui.etapa = etapaAtualIndex(m);
  $("#palco").innerHTML = renderMapa(m) + renderEtapa(m);
  ligarVideo();
}
function renderQuiz() {
  const m = modulo(ui.modulo), e = m.etapas[ui.etapa];
  $("#quiz").innerHTML = renderPergunta(m, e, ui.etapa);
  $("#xp").textContent = xpTotal();
}

/* =====================================================================
   INTERAÇÃO
   ===================================================================== */
document.addEventListener("click", ev => {
  const alvo = ev.target.closest("button");
  if (!alvo) return;
  const m = modulo(ui.modulo);

  if (alvo.dataset.modulo) {
    ui = { modulo: alvo.dataset.modulo, etapa: null, q: null, ultimaErrada: null, revisao: false };
    render(); return;
  }
  if (alvo.dataset.etapa != null) {
    ui.etapa = +alvo.dataset.etapa; ui.q = null; ui.ultimaErrada = null; ui.revisao = false;
    render(); $(".etapa h1").scrollIntoView({ block: "start", behavior: "smooth" }); return;
  }
  if (alvo.dataset.opcao != null) { responder(m, +alvo.dataset.opcao); return; }

  const acao = alvo.dataset.acao;
  if (!acao) return;
  const e = m.etapas ? m.etapas[ui.etapa] : null;
  if (acao === "proxima") {
    ui.q = proximaAberta(e, ui.q ?? -1);
    ui.ultimaErrada = null;
    renderQuiz(); $("#enunciado").focus({ preventScroll: true }); $("#quiz").scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else if (acao === "concluir") {
    const st = estadoEtapa(e.id);
    st.fim = e.perguntas.every((_, i) => st.resp[i] && st.resp[i].ok);
    salvar(); ui.q = null; ui.ultimaErrada = null; render();
    $("#quiz").scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else if (acao === "ir") {
    ui.etapa = +alvo.dataset.alvo; ui.q = null; ui.ultimaErrada = null; ui.revisao = false;
    render(); window.scrollTo({ top: 0, behavior: "smooth" });
  } else if (acao === "revisar") { ui.revisao = true; renderQuiz(); }
  else if (acao === "fechar-revisao") { ui.revisao = false; renderQuiz(); }
  else if (acao === "refazer") {
    progresso.etapas[e.id] = { resp: [], fim: false }; salvar();
    ui.q = null; ui.ultimaErrada = null; ui.revisao = false; render();
  } else if (acao === "recomecar") {
    if (!alvo.dataset.confirmar) {
      alvo.dataset.confirmar = "1";
      alvo.textContent = "Clique de novo para apagar seu progresso nesta guia";
      setTimeout(() => { if (alvo.isConnected) { delete alvo.dataset.confirmar; alvo.textContent = "Recomeçar esta trilha"; } }, 4000);
      return;
    }
    m.etapas.forEach(x => delete progresso.etapas[x.id]); salvar();
    ui.etapa = 0; ui.q = null; ui.ultimaErrada = null; ui.revisao = false; render();
  }
});

function responder(m, oi) {
  const e = m.etapas[ui.etapa];
  const st = estadoEtapa(e.id);
  const qAtual = ui.q ?? proximaAberta(e);
  ui.q = qAtual;
  const p = e.perguntas[qAtual];
  const r = st.resp[qAtual] || (st.resp[qAtual] = { t: 0, ok: false, erradas: [] });
  if (r.ok) return;
  r.t += 1;
  if (p.op[oi][1]) { r.ok = true; ui.ultimaErrada = null; }
  else { r.erradas = [...new Set([...(r.erradas || []), oi])]; ui.ultimaErrada = oi; }
  salvar();
  renderQuiz();
  if (r.ok) {
    const b = $(".rodape-quiz .botao"); if (b) b.focus({ preventScroll: true });
  } else {
    const prox = document.querySelector(".opcao:not(:disabled)"); if (prox) prox.focus({ preventScroll: true });
  }
  // o mapa mostra o progresso ao concluir a etapa; o XP atualiza já
}

/* ---------- tema ---------- */
(function () {
  let salvo = null;
  try { salvo = localStorage.getItem("trilha-tema"); } catch (e) { /* ignora */ }
  if (salvo) document.documentElement.dataset.theme = salvo;
  $("#tema").addEventListener("click", () => {
    const escuroAgora = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    const novo = escuroAgora ? "light" : "dark";
    document.documentElement.dataset.theme = novo;
    try { localStorage.setItem("trilha-tema", novo); } catch (e) { /* ignora */ }
  });
})();

render();
</script>
</body>
</html>
