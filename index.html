<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilha de Física III — Interativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --fundo: #F4F6F3;
  --grade: rgba(30, 60, 40, 0.06);
  --superficie: #FFFFFF;
  --superficie-2: #ECEFEA;
  --linha: #D5D9D2;
  --tinta: #1C1D1B;
  --tinta-2: #565A54;
  --destaque: #8A6A00;
  --destaque-fundo: #FFF3C2;
  --destaque-tinta: #1C1D1B;
  --erro: #B0362B;
  --erro-fundo: #FBE6E3;
  --acerto: #2F7524;
  --acerto-fundo: #E3F1DC;
  --azul: #1B7D98;
  --carga-pos: #CF5044;
  --carga-neg: #1F93B5;
  --sombra: 0 1px 0 rgba(0,0,0,0.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #181818;
    --grade: rgba(255, 255, 255, 0.035);
    --superficie: #202020;
    --superficie-2: #2A2A2A;
    --linha: #383838;
    --tinta: #ECEAE4;
    --tinta-2: #A9A7A1;
    --destaque: #F7D96F;
    --destaque-fundo: #3A3320;
    --destaque-tinta: #181818;
    --erro: #E8786C;
    --erro-fundo: #3B2320;
    --acerto: #9BD17E;
    --acerto-fundo: #22321D;
    --azul: #29ABCA;
    --carga-pos: #CF5044;
    --carga-neg: #29ABCA;
    --sombra: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fundo: #181818;
  --grade: rgba(255, 255, 255, 0.035);
  --superficie: #202020;
  --superficie-2: #2A2A2A;
  --linha: #383838;
  --tinta: #ECEAE4;
  --tinta-2: #A9A7A1;
  --destaque: #F7D96F;
  --destaque-fundo: #3A3320;
  --destaque-tinta: #181818;
  --erro: #E8786C;
  --erro-fundo: #3B2320;
  --acerto: #9BD17E;
  --acerto-fundo: #22321D;
  --azul: #29ABCA;
  --carga-pos: #CF5044;
  --carga-neg: #29ABCA;
  --sombra: none;
  color-scheme: dark;
}
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background-color: var(--fundo);
  background-image:
    linear-gradient(var(--grade) 1px, transparent 1px),
    linear-gradient(90deg, var(--grade) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--tinta);
  font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 17px;
  line-height: 1.55;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--superficie);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--destaque); outline-offset: 2px; }

/* ---------- Cabeçalho ---------- */
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--superficie); border-bottom: 1px solid var(--linha);
  display: flex; align-items: center; gap: 20px; padding: 10px 24px; flex-wrap: wrap;
}
.marca { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; white-space: nowrap; }
.marca svg { flex: none; }
.guias { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.guias::-webkit-scrollbar { display: none; }
.guia {
  border: 1px solid transparent; background: none; border-radius: 999px; padding: 6px 14px;
  cursor: pointer; white-space: nowrap; color: var(--tinta-2); display: flex; align-items: center; gap: 8px;
}
.guia .num { font-weight: 700; }
.guia[aria-selected="true"] { background: var(--destaque); color: var(--destaque-tinta); font-weight: 700; }
.guia .em-breve { font-size: 13px; padding: 1px 8px; border-radius: 999px; background: var(--superficie-2); color: var(--tinta-2); }
.guia[aria-selected="true"] .em-breve { background: rgba(0,0,0,0.12); color: inherit; }
.placar { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
.xp { display: flex; align-items: baseline; gap: 6px; }
.xp strong { font-size: 22px; color: var(--destaque); font-variant-numeric: tabular-nums; }
.xp span { color: var(--tinta-2); font-size: 14px; }
.tema {
  border: 1px solid var(--linha); background: var(--superficie-2); border-radius: 8px;
  width: 36px; height: 36px; cursor: pointer; display: grid; place-items: center;
}

/* ---------- Corpo ---------- */
.palco { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px; max-width: 1180px; margin: 0 auto; padding: 28px 24px 64px; }
.mapa { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); align-self: start; }
.mapa-cab { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 6px; }
.mapa-cab h2 { margin: 0; font-size: 16px; }
.mapa-cab span { color: var(--tinta-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.barra { height: 6px; background: var(--superficie-2); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
.barra i { display: block; height: 100%; background: var(--destaque); border-radius: 3px; transition: width .5s ease; }
.linha-campo { position: relative; }
.linha-campo svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.no {
  position: absolute; display: flex; align-items: center; gap: 12px; background: none; border: 0;
  padding: 0; cursor: pointer; text-align: left; width: 240px;
}
.no:disabled { cursor: not-allowed; }
.no .bola {
  flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; font-size: 14px; border: 2px solid var(--linha); background: var(--superficie); color: var(--tinta-2);
  font-variant-numeric: tabular-nums;
}
.no .rotulo { font-size: 14px; line-height: 1.25; color: var(--tinta-2); }
.no .rotulo small { display: block; color: var(--destaque); letter-spacing: 1px; font-size: 12px; }
.no.feito .bola { background: var(--destaque); border-color: var(--destaque); color: var(--destaque-tinta); }
.no.feito .rotulo { color: var(--tinta); }
.no.atual .bola { border-color: var(--destaque); color: var(--tinta); box-shadow: 0 0 0 5px var(--destaque-fundo); }
.no.atual .rotulo { color: var(--tinta); font-weight: 700; }
.no.aberta .bola { outline: 2px solid var(--tinta); outline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) {
  .no.atual .bola { animation: pulso 2.2s ease-in-out infinite; }
  @keyframes pulso { 0%, 100% { box-shadow: 0 0 0 4px var(--destaque-fundo); } 50% { box-shadow: 0 0 0 9px var(--destaque-fundo); } }
}
.recomecar { margin-top: 18px; background: none; border: 0; color: var(--tinta-2); text-decoration: underline; cursor: pointer; padding: 0; font-size: 14px; }

/* ---------- Etapa ---------- */
.etapa { max-width: 760px; }
.etapa-pos { color: var(--tinta-2); margin: 0; font-size: 15px; }
.etapa h1 { font-size: clamp(28px, 4vw, 38px); line-height: 1.15; margin: 4px 0 14px; letter-spacing: -0.5px; }
.texto { margin: 0 0 22px; max-width: 64ch; font-size: 18px; }
.video {
  position: relative; aspect-ratio: 16 / 9; background: #181818; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--linha); margin-bottom: 10px;
}
.video video { width: 100%; height: 100%; display: block; background: #181818; }
.video .vazio[hidden] { display: none; }
.video .vazio {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #CFCDC6;
}
.video .vazio p { margin: 6px 0; max-width: 46ch; }
.video .vazio code { background: #2B2B2B; padding: 2px 6px; border-radius: 4px; font-size: 14px; color: #F7D96F; }
.video-acoes { display: flex; gap: 14px; align-items: center; margin-bottom: 30px; font-size: 14px; color: var(--tinta-2); min-height: 22px; flex-wrap: wrap; }
.botao {
  border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 700; cursor: pointer;
  background: var(--destaque); color: var(--destaque-tinta);
}
.botao.sec { background: var(--superficie-2); color: var(--tinta); border: 1px solid var(--linha); }
.botao:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--azul); text-decoration: underline; cursor: pointer; font-size: 14px; }

.quiz { background: var(--superficie); border: 1px solid var(--linha); border-radius: 14px; padding: 22px 24px 24px; box-shadow: var(--sombra); }
.quiz-cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--tinta-2); font-size: 15px; margin-bottom: 8px; }
.quiz-cab-esq { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tag-tipo { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--superficie-2); color: var(--tinta-2); border: 1px solid var(--linha); }
.tag-tipo.sim { background: var(--destaque-fundo); color: var(--tinta); border-color: var(--destaque); }
.pontos { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
.pontos .ponto {
  width: 14px; height: 14px; border-radius: 50%; background: var(--superficie-2);
  border: 1.5px solid var(--linha); padding: 0; cursor: pointer;
  transition: transform .15s ease, border-color .15s ease, background-color .15s ease;
}
.pontos .ponto.sim { border-radius: 4px; }
.pontos .ponto:hover { border-color: var(--destaque); transform: scale(1.2); }
.pontos .ponto.ok { background: var(--acerto); border-color: var(--acerto); }
.pontos .ponto.agora { background: var(--destaque); border-color: var(--destaque); transform: scale(1.18); }
.enunciado { font-size: 21px; line-height: 1.35; margin: 0 0 16px; outline: none; }
.opcoes { display: grid; gap: 10px; }
.opcao {
  display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; text-align: left;
  border: 1.5px solid var(--linha); background: var(--superficie); border-radius: 10px; padding: 12px 14px; cursor: pointer;
}
.opcao .letra {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700;
  background: var(--superficie-2); font-size: 15px;
}
.opcao:hover:not(:disabled) { border-color: var(--destaque); }
.opcao:disabled { cursor: default; }
.opcao.errada { border-color: var(--erro); background: var(--erro-fundo); }
.opcao.errada .letra { background: var(--erro); color: #fff; }
.opcao.certa { border-color: var(--acerto); background: var(--acerto-fundo); }
.opcao.certa .letra { background: var(--acerto); color: #fff; }
.opcao.apagada { opacity: .55; }
.feedback { margin-top: 14px; border-radius: 10px; padding: 14px 16px; border-left: 5px solid; }
.feedback[hidden] { display: none; }
.feedback.erro { background: var(--erro-fundo); border-color: var(--erro); }
.feedback.acerto { background: var(--acerto-fundo); border-color: var(--acerto); }
.feedback strong { display: block; margin-bottom: 4px; }
.feedback p { margin: 0; }
.feedback .tente { margin-top: 8px; color: var(--tinta-2); font-size: 15px; }
.rodape-quiz {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--linha);
}

.conclusao { text-align: left; }
.estrelas { display: flex; gap: 8px; margin: 6px 0 10px; }
.estrelas svg { width: 40px; height: 40px; }
.conclusao h2 { margin: 0 0 6px; font-size: 24px; }
.conclusao p { margin: 0 0 16px; color: var(--tinta-2); }
.conclusao .acoes { display: flex; gap: 12px; flex-wrap: wrap; }

.revisao { display: grid; gap: 14px; margin-top: 8px; }
.revisao article { border-top: 1px solid var(--linha); padding-top: 14px; }
.revisao h3 { font-size: 17px; margin: 0 0 6px; }
.revisao .resp { color: var(--acerto); font-weight: 700; margin: 0 0 4px; }
.revisao p { margin: 0; }

.breve { max-width: 640px; }
.breve h1 { font-size: 34px; margin: 6px 0 12px; }
.breve p { font-size: 18px; }
.breve ol { padding-left: 22px; color: var(--tinta-2); }

.aviso { color: var(--tinta-2); font-size: 14px; margin-top: 10px; }

@media (max-width: 860px) {
  .palco { grid-template-columns: 1fr; gap: 18px; padding-top: 18px; }
  .mapa { position: static; }
  .linha-campo { height: auto !important; display: flex; gap: 10px; overflow-x: auto; padding: 6px 2px 10px; scrollbar-width: thin; }
  .linha-campo svg { display: none; }
  .no { position: static; width: auto; flex: none; }
  .no .rotulo { display: none; }
  .topo { padding: 10px 16px; gap: 10px; }
  .guias { order: 3; flex-basis: 100%; }
}

/* ---------- Laboratórios ---------- */
.missao .enunciado { outline: none; }
.sim { border: 1px solid var(--linha); border-radius: 12px; background: var(--superficie-2); padding: 10px 12px 12px; margin-top: 6px; }
.sim-palco { overflow-x: auto; border-radius: 8px; border: 1px solid var(--linha); background: var(--superficie); }
.sim-svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.sim-cel { display: none; margin: 8px 0 0; font-size: 14px; color: var(--tinta-2); }
.sim-svg .pega { cursor: grab; touch-action: none; }
.sim-svg .pega:active { cursor: grabbing; }
.sim-svg .pega:focus { outline: none; }
.sim-svg .pega:focus-visible circle, .sim-svg .pega:focus-visible rect, .sim-svg circle.pega:focus-visible { stroke: var(--destaque); stroke-width: 4; }
.sim-svg .pega circle, .sim-svg .pega > rect { filter: drop-shadow(0 0 3px rgba(217, 154, 0, .9)); }
.sim-svg circle.pega { filter: drop-shadow(0 0 3px rgba(217, 154, 0, .9)); }
.sim-svg .pega-fundo { cursor: move; touch-action: pan-x pan-y; }
.sim-txt { fill: var(--tinta-2); font-family: inherit; font-size: 14px; pointer-events: none; }
.sim-txt.forte { fill: var(--tinta); font-weight: 700; font-size: 15px; }
.sim-txt.escuro, .sim-sinal.escuro { fill: #1C1D1B; }
.sim-sinal { fill: #fff; font-weight: 700; font-family: inherit; pointer-events: none; }
.sim-ion { fill: var(--carga-pos); font-weight: 700; font-size: 18px; font-family: inherit; pointer-events: none; }
.sim-grade { stroke: var(--linha); stroke-width: 1; opacity: .6; }
.sim-trilho { fill: var(--superficie-2); stroke: var(--linha); }
.sim-piso { fill: var(--linha); opacity: .35; }
.sim-terra { fill: var(--superficie-2); stroke: var(--tinta-2); stroke-dasharray: 6 4; }
.sim-corpo { fill: var(--superficie-2); stroke: var(--linha); stroke-width: 2; }
.sim-controle { display: grid; grid-template-columns: minmax(110px, 170px) 1fr minmax(86px, auto); gap: 10px; align-items: center; margin-top: 10px; font-size: 15px; }
.sim-controle input[type=range] { width: 100%; accent-color: var(--destaque); min-height: 30px; }
.sim-controle output { font-variant-numeric: tabular-nums; text-align: right; font-weight: 700; }
.sim-escolha { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; font-size: 15px; }
.sim-escolha .nome, .sim-controle .nome { color: var(--tinta-2); }
.sim-escolha .nome { min-width: 110px; }
.sim-escolha button { font: inherit; padding: 7px 12px; border-radius: 8px; border: 1.5px solid var(--linha); background: var(--superficie); color: var(--tinta); cursor: pointer; min-height: 40px; }
.sim-escolha button:hover:not(:disabled) { border-color: var(--destaque); }
.sim-escolha button[aria-pressed="true"] { background: var(--destaque-fundo); border-color: var(--destaque); color: var(--tinta); font-weight: 700; }
.sim-escolha button:disabled { opacity: .5; cursor: default; }
.sim-leitura { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--superficie); border: 1px solid var(--linha); font-size: 15px; font-variant-numeric: tabular-nums; }
.sim-leitura.conta { overflow-wrap: anywhere; }
.sim-rapida { margin-top: 14px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--destaque); background: var(--destaque-fundo); color: var(--destaque-tinta); }
.sim-rapida[hidden] { display: none; }
.sim-rapida p { margin: 0 0 4px; font-weight: 700; }
.sim-rapida .sim-escolha button { color: #1C1D1B; background: #fff; }
.sim-acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.feedback.aviso { background: var(--superficie-2); border-color: var(--tinta-2); }
@media (max-width: 860px) {
  .palco { grid-template-columns: minmax(0, 1fr); }
  .mapa, .etapa { min-width: 0; }
}
@media (max-width: 640px) {
  .sim-svg { min-width: 560px; }
  .sim-cel { display: block; }
}
@media (max-width: 560px) {
  .sim { padding: 8px; }
  .sim-escolha .nome { min-width: 100%; }
  .sim-controle { grid-template-columns: 1fr auto; }
  .sim-controle input[type=range] { grid-column: 1 / -1; grid-row: 2; }
}
</style>
</head>
<body>
<header class="topo">
  <div class="marca">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
      <circle cx="7" cy="14" r="6" fill="#CF5044"/><path d="M4.5 14h5M7 11.5v5" stroke="#fff" stroke-width="1.8"/>
      <circle cx="21" cy="14" r="6" fill="#29ABCA"/><path d="M18.5 14h5" stroke="#fff" stroke-width="1.8"/>
    </svg>
    Trilha de Física III · Interativa
  </div>
  <nav class="guias" role="tablist" aria-label="Módulos" id="guias"></nav>
  <div class="placar">
    <div class="xp" aria-live="polite"><strong id="xp">0</strong><span>XP</span></div>
    <button class="tema" id="tema" type="button" aria-label="Alternar tema claro e escuro">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 2a7 7 0 0 1 0 14z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<main class="palco" id="palco"></main>


<script>
/* =====================================================================
   CONTEÚDO DA TRILHA (JOGOS INTERATIVOS + PERGUNTAS POR CENA)
   ===================================================================== */
const MODULOS = [
  {
    id: "coulomb",
    titulo: "Lei de Coulomb",
    etapas: [
      {
        id: "c01", cena: "CoulombAbertura", titulo: "Atração e repulsão",
        texto: "Há mais de dois mil anos, os gregos perceberam que o âmbar esfregado em lã atraía pedacinhos de palha. Nesta cena, o mesmo efeito aparece com bastões de vidro e de plástico, e a força elétrica mostra que pode atrair ou repelir.",
        perguntas: [
          {
            sim: "bastoes", cfg: { m: 0 },
            q: "Eletrize os dois bastões de vidro com a seda e aproxime o da mão: faça o bastão pendurado se afastar.",
            exp: "Dois bastões de vidro esfregados com seda ficam com carga de mesmo sinal. Cargas de mesmo sinal se repelem, e o bastão pendurado foge do outro.",
            dica: "Arraste o pano de seda de um lado para o outro sobre cada bastão, ou use os botões de esfregar. Depois chegue a ponta de um bastão perto da ponta do outro."
          },
          {
            sim: "bastoes", cfg: { m: 1 },
            q: "Troque o bastão da mão por um de plástico, eletrize-o e faça o bastão pendurado ser atraído.",
            exp: "Esfregado com seda, o plástico fica com carga de sinal oposto ao do vidro. Cargas de sinais diferentes se atraem.",
            dica: "Escolha Plástico em \"Bastão da mão\", esfregue-o com a seda e aproxime-o do pendurado, que deve continuar de vidro e carregado."
          },
          {
            sim: "bastoes", cfg: { m: 2 },
            q: "Monte uma repulsão usando dois bastões de plástico.",
            exp: "A regra não depende de qual é o sinal: positivos repelem positivos e negativos repelem negativos. Só sinais opostos se atraem.",
            dica: "Os dois bastões precisam ser de plástico e estar eletrizados. Trocar o material zera a carga: esfregue de novo."
          },
          { q: "Que fenômeno faz o âmbar atrair a palha depois de ser esfregado na lã?",
            op: [

const CHAVE_LOCAL = "trilha-fisica3-completa-v1";
const PONTOS = [10, 6, 3];          // XP por acertar na 1ª, 2ª e 3ª tentativa ou depois
let progresso = carregarLocal();   // { etapas: { c01: { resp: [{t, ok}], fim: bool } }, atualizado }
let refProgresso = null;
let ui = { modulo: "coulomb", etapa: null, q: null, ultimaErrada: null, revisao: false, explorar: false };

function carregarLocal() {
  try {
    const t = localStorage.getItem(CHAVE_LOCAL);
    if (t) return JSON.parse(t);
  } catch (e) { /* armazenamento indisponível */ }
  return { etapas: {}, atualizado: 0 };
}
let gravandoDb = false, pendenteDb = false, timerDb = null;
function salvar() {
  progresso.atualizado = Date.now();
  try { localStorage.setItem(CHAVE_LOCAL, JSON.stringify(progresso)); } catch (e) { /* ignora */ }
  if (!refProgresso) return;
  clearTimeout(timerDb);
  timerDb = setTimeout(gravarDb, 700);
}
async function gravarDb() {
  if (gravandoDb) { pendenteDb = true; return; }
  gravandoDb = true;
  try { await refProgresso.set({ etapas: progresso.etapas, atualizado: progresso.atualizado }); }
  catch (e) { /* segue só com o armazenamento local */ }
  gravandoDb = false;
  if (pendenteDb) { pendenteDb = false; gravarDb(); }
}

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function modulo(id) { return MODULOS.find(m => m.id === id); }
function estadoEtapa(id) {
  if (!progresso.etapas[id]) progresso.etapas[id] = { resp: [], fim: false };
  return progresso.etapas[id];
}
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function ordemOpcoes(etapaId, qi, n) {
  const idx = [...Array(n).keys()];
  let s = hash(etapaId + ":" + qi);
  for (let i = n - 1; i > 0; i--) { s = (Math.imul(s, 1103515245) + 12345) >>> 0; const j = s % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx;
}
function xpDaEtapa(id) {
  const e = progresso.etapas[id]; if (!e) return 0;
  return e.resp.reduce((s, r) => s + (r && r.ok ? PONTOS[Math.min(r.t - 1, 2)] : 0), 0);
}
function xpTotal() { return Object.keys(progresso.etapas).reduce((s, id) => s + xpDaEtapa(id), 0); }
function estrelas(id) {
  const e = progresso.etapas[id]; if (!e || !e.fim) return 0;
  const erros = e.resp.reduce((s, r) => s + (r ? r.t - 1 : 0), 0);
  return erros === 0 ? 3 : erros <= 2 ? 2 : 1;
}
function liberada(m, i) {
  return true; // todas as etapas abertas para estudo livre
}
function proximaAberta(e, depois = -1) {
  const st = estadoEtapa(e.id);
  const i = e.perguntas.findIndex((_, k) => k > depois && !(st.resp[k] && st.resp[k].ok));
  if (i !== -1) return i;
  const j = e.perguntas.findIndex((_, k) => !(st.resp[k] && st.resp[k].ok));
  return j === -1 ? 0 : j;
}
function etapaAtualIndex(m) {
  const i = m.etapas.findIndex(e => !(progresso.etapas[e.id] || {}).fim);
  return i === -1 ? 0 : i;
}

function renderMapa(m) {
  const n = m.etapas.length, passo = 62, topo = 64;
  const xs = m.etapas.map((_, i) => 34 + 18 * Math.sin(i * 0.95));
  const ys = m.etapas.map((_, i) => topo + i * passo);
  const altura = topo + (n - 1) * passo + 64;
  const pts = [[34, 28], ...xs.map((x, i) => [x, ys[i]]), [34, altura - 28]];
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    d += ` C ${x0} ${y0 + (y1 - y0) / 2}, ${x1} ${y1 - (y1 - y0) / 2}, ${x1} ${y1}`;
  }
  const feitas = m.etapas.filter(e => (progresso.etapas[e.id] || {}).fim).length;
  const atual = etapaAtualIndex(m);
  const setas = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    const ok = i <= feitas;
    setas.push(`<path d="M ${mx - 4} ${my - 3} L ${mx} ${my + 2} L ${mx + 4} ${my - 3}" fill="none"
      stroke="${ok ? "var(--destaque)" : "var(--linha)"}" stroke-width="1.8" stroke-linecap="round"/>`);
  }
  const yProgresso = feitas === 0 ? 28 : feitas >= n ? altura : ys[feitas - 1];
  const nos = m.etapas.map((e, i) => {
    const st = progresso.etapas[e.id] || {};
    const lib = liberada(m, i);
    const cls = [st.fim ? "feito" : "", i === atual && !st.fim ? "atual" : "", ui.etapa === i ? "aberta" : ""].join(" ");
    const est = st.fim ? "★".repeat(estrelas(e.id)) + "☆".repeat(3 - estrelas(e.id)) : "";
    const rot = `Etapa ${i + 1}: ${e.titulo}${st.fim ? ", concluída" : ""}`;
    return `<button class="no ${cls}" type="button" data-etapa="${i}" ${lib ? "" : "disabled"} aria-label="${esc(rot)}"
      style="left:${xs[i] - 16}px; top:${ys[i] - 16}px">
      <span class="bola">${st.fim ? "✓" : i + 1}</span>
      <span class="rotulo">${est ? `<small aria-hidden="true">${est}</small>` : ""}${esc(e.titulo)}</span>
    </button>`;
  }).join("");
  return `
    <aside class="mapa" aria-label="Mapa da trilha">
      <div class="mapa-cab"><h2>${esc(m.titulo)}</h2><span>${feitas} de ${n}</span></div>
      <div class="barra" aria-hidden="true"><i style="width:${(feitas / n) * 100}%"></i></div>
      <div class="linha-campo" style="height:${altura}px">
        <svg width="80" height="${altura}" viewBox="0 0 80 ${altura}" aria-hidden="true">
          <defs><clipPath id="clipFeito"><rect x="0" y="0" width="80" height="${yProgresso}"/></clipPath></defs>
          <path d="${d}" fill="none" stroke="var(--linha)" stroke-width="2.5"/>
          <path d="${d}" fill="none" stroke="var(--destaque)" stroke-width="2.5" clip-path="url(#clipFeito)"/>
          ${setas.join("")}
          <circle cx="34" cy="14" r="13" fill="var(--carga-pos)"/>
          <path d="M28 14h12M34 8v12" stroke="#fff" stroke-width="2.2"/>
          <circle cx="34" cy="${altura - 14}" r="13" fill="var(--carga-neg)"/>
          <path d="M28 ${altura - 14}h12" stroke="#fff" stroke-width="2.2"/>
        </svg>
        ${nos}
      </div>
      <button class="recomecar" type="button" data-acao="recomecar">Recomeçar esta trilha</button>
    </aside>`;
}

    const tipo = item.sim ? "Jogo interativo" : "Pergunta";
    const status = ri && ri.ok ? " (concluída)" : i === qAtual ? " (atual)" : "";

function renderRodapeQuiz(e, qAtual, st) {
  const total = e.perguntas.length;
  const r = st.resp[qAtual] || {};
  const todasOk = e.perguntas.every((_, i) => st.resp[i] && st.resp[i].ok);
  const pendente = e.perguntas.findIndex((_, i) => !(st.resp[i] && st.resp[i].ok));
  const prevBtn = `<button class="botao sec" type="button" data-acao="anterior" ${qAtual === 0 ? "disabled" : ""}>← Anterior</button>`;
  let nextBtn = "";
  if (qAtual < total - 1) {
    const cls = r.ok ? "botao" : "botao sec";
    nextBtn = `<button class="${cls}" type="button" data-acao="proxima">Próxima →</button>`;
  } else if (st.fim && !ui.explorar) {
    nextBtn = `<button class="botao" type="button" data-acao="fechar-revisao">Ver resumo</button>`;
  } else if (todasOk) {
    nextBtn = `<button class="botao" type="button" data-acao="concluir">Concluir etapa</button>`;
  } else if (pendente !== -1) {
    nextBtn = `<button class="botao sec" type="button" data-ir-q="${pendente}">Ir para pendente (${pendente + 1})</button>`;
  }

function renderPergunta(m, e, ei) {
  const st = estadoEtapa(e.id);

  if (st.fim && !ui.revisao && !ui.explorar) return renderConclusao(m, e, ei);
  if (st.fim && ui.revisao) return renderRevisao(e);

  if (p.sim) return renderMissao(e, qAtual, st);

  S("line", { x1: 110, y1: 26, x2: 310, y2: 26, stroke: COR.cinza, "stroke-width": 6, "stroke-linecap": "round" }, svg);
  const fio = S("line", { stroke: COR.cinza, "stroke-width": 2 }, svg);

    const g = S("g", {}, svg);
    const r = S("rect", { x: -C, y: -9, width: 2 * C, height: 18, rx: 9, stroke: "#6B7A80", "stroke-width": 1 }, g);
    const t = S("text", { "text-anchor": "middle", dy: "0.35em", class: "sim-sinal escuro", "font-size": 14 }, g);

  }

  botaoSim(linha, "o pendurado", () => { st.qp = Math.min(1, st.qp + 0.25); }, "");
  botaoSim(linha, "o da mão", () => { st.qm = Math.min(1, st.qm + 0.25); }, "");
  animar(svg, () => { st.px += (alvo().desvio - st.px) * 0.18; desenhar(); checar(); });
  desenhar();
  root._t = { resolver() {
    st.pend = m === 2 ? "plastico" : "vidro"; st.mao = m === 0 ? "vidro" : "plastico";
    eP.set(st.pend); eM.set(st.mao); st.qp = st.qm = 1; st.hx = PX + 2 * C + 30; st.hy = PY; checar();
  } };
};

/* =====================================================================
   CENA 2 — Barra e bastão (condutores, isolantes e indução)
   ===================================================================== */
SIMS.inducao = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 320);
  const X0 = 230, X1 = 530, Y = 170, N = 12;
  const st = { mat: "cobre", rx: 70, ry: 40, terra: false, n: N };
  const barra = S("rect", { x: X0, y: Y - 26, width: X1 - X0, height: 52, rx: 8, stroke: "#6B7A80", "stroke-width": 1.5 }, svg);
  S("rect", { x: 360, y: Y + 26, width: 40, height: 70, fill: "#C9CDC6", stroke: "#8C948A" }, svg);
  texto(svg, 380, Y + 112, "suporte isolante", "sim-txt", "middle");
  const fioT = S("path", { d: `M ${X1} ${Y} H 580 V 250`, fill: "none", stroke: COR.cinza, "stroke-width": 3 }, svg);
  const terraG = S("g", { stroke: COR.cinza, "stroke-width": 3 }, svg);
  [[564, 596, 250], [570, 590, 258], [576, 584, 266]].forEach(([a, b, y]) => S("line", { x1: a, x2: b, y1: y, y2: y }, terraG));
  const ions = [], eletrons = [];
  for (let i = 0; i < N; i++) {
    const bx = X0 + 18 + i * ((X1 - X0 - 36) / (N - 1));
    ions.push(bx);
    const t = S("text", { x: bx, y: Y + 6, "text-anchor": "middle", class: "sim-ion" }, svg); t.textContent = "+";
    eletrons.push(S("circle", { r: 5, fill: COR.neg, stroke: "#fff", "stroke-width": 1 }, svg));
  }
  const seta = criarSeta(svg, "forca", 5);
  const gB = S("g", {}, svg);
  S("rect", { x: -60, y: -9, width: 120, height: 18, rx: 9, fill: "#DCC6EC", stroke: "#6B7A80" }, gB);
  const tb = S("text", { "text-anchor": "middle", dy: "0.35em", class: "sim-sinal escuro", "font-size": 14 }, gB); tb.textContent = "− − − − −";
  const rotulo = texto(svg, 380, Y - 40, "", "sim-txt", "middle");
  const ler = H("div", "sim-leitura", root);

  function prox() { return lim(1 - (Math.hypot(st.rx + 60 - X0, st.ry - Y) - 20) / 140, 0, 1); }
  function desenhar() {
    const p = prox();
    if (st.terra && st.mat === "cobre") st.n = N - Math.round(4 * p);
    barra.setAttribute("fill", st.mat === "cobre" ? "#E2B48A" : "#BFE3EA");
    gB.setAttribute("transform", `translate(${st.rx},${st.ry})`);
    fioT.style.display = terraG.style.display = st.terra ? "" : "none";
    const desloc = st.mat === "cobre" ? 0.55 * p : 0.02 * p;
    eletrons.forEach((el, i) => {
      const x = ions[i] + desloc * (X1 - 12 - ions[i]);
      el.setAttribute("cx", x); el.setAttribute("cy", Y + (i % 2 ? 14 : -14));
      el.style.display = i < st.n ? "" : "none";
    });
    const liquida = N - st.n;
    rotulo.textContent = `barra de ${st.mat}`;
    const atrai = st.mat === "cobre" ? p : p * 0.15;
    seta.pos(X0 - 6, Y, X0 - 6 - 46 * atrai, Y);
    ler.textContent = `Carga líquida da barra: ${liquida > 0 ? "+" + liquida + "e" : "0"} · Fio terra: ${st.terra ? "ligado" : "desligado"} · Elétrons deslocados: ${Math.round((st.mat === "cobre" ? p : 0) * 100)}%`;
    if (m === 0 && st.mat === "cobre" && p >= 0.85) api.ok();
    if (m === 1 && st.mat === "vidro" && p >= 0.85) rapida.mostrar();
    if (m === 2 && st.n < N && !st.terra && p < 0.15) api.ok();
  }
  const rapida = perguntaRapida(api, "Os elétrons se deslocaram pela barra de vidro?", [
    ["Sim", false, "Olhe as bolinhas azuis: no vidro elas continuam ao lado dos seus átomos."],
    ["Não", true, ""]]);
  arrastavel(gB, svg, () => ({ x: st.rx, y: st.ry }), p => { st.rx = lim(p.x, 60, 180); st.ry = lim(p.y, 40, 290); desenhar(); });
  const eMat = escolha(root, "Material da barra", [["cobre", "Cobre"], ["vidro", "Vidro"]], st.mat, v => { st.mat = v; st.n = N; desenhar(); });
  const eT = escolha(root, "Fio terra", [["off", "Desligado"], ["on", "Ligado"]], "off", v => { st.terra = v === "on"; desenhar(); });
  if (m === 2) botaoVerificar(api, () => {
    const p = prox();
    if (st.n < N && !st.terra && p < 0.15) return true;
    if (st.n === N && !st.terra) return "A barra está neutra. Chegue o bastão bem perto e ligue o fio terra para os elétrons escaparem.";
    if (st.terra) return "Com o bastão ainda perto, desligue o fio terra. Só depois afaste o bastão.";
    return "Falta afastar o bastão da barra.";
  });
  desenhar();
  root._t = { resolver() {
    if (m === 0) { st.rx = 170; st.ry = Y; desenhar(); }
    if (m === 1) { st.mat = "vidro"; eMat.set("vidro"); st.rx = 170; st.ry = Y; desenhar(); }
    if (m === 2) { st.rx = 170; st.ry = Y; st.terra = true; desenhar(); st.terra = false; eT.set("off"); st.rx = 60; st.ry = 40; desenhar(); }
  } };
};

/* =====================================================================
   CENA 3 — Balança de Coulomb
   ===================================================================== */
SIMS.balanca = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 300);
  const R0 = 4, XA = 250, ESC = 28, Y = 170;
  const st = { q1: 1, q2: 1, r: R0 };
  const razao = () => st.q1 * st.q2 * (R0 / st.r) ** 2;
  S("circle", { cx: 110, cy: 150, r: 74, fill: "none", stroke: COR.cinza, "stroke-width": 2 }, svg);
  for (let a = 0; a < 360; a += 30) {
    const t = (a - 90) * Math.PI / 180;
    S("line", { x1: 110 + 66 * Math.cos(t), y1: 150 + 66 * Math.sin(t), x2: 110 + 74 * Math.cos(t), y2: 150 + 74 * Math.sin(t), stroke: COR.cinza, "stroke-width": 2 }, svg);
  }
  const ponteiro = S("line", { x1: 110, y1: 150, stroke: COR.forca, "stroke-width": 4, "stroke-linecap": "round" }, svg);
  S("circle", { cx: 110, cy: 150, r: 5, fill: COR.forca }, svg);
  texto(svg, 110, 248, "torção do fio", "sim-txt", "middle");
  S("line", { x1: XA, y1: Y + 46, x2: XA + 12 * ESC, y2: Y + 46, stroke: COR.cinza, "stroke-width": 2 }, svg);
  for (let c = 0; c <= 12; c += 2) {
    S("line", { x1: XA + c * ESC, y1: Y + 40, x2: XA + c * ESC, y2: Y + 52, stroke: COR.cinza, "stroke-width": 2 }, svg);
    texto(svg, XA + c * ESC, Y + 68, c + " cm", "sim-txt", "middle");
  }
  S("line", { x1: 184, y1: Y, x2: XA, y2: Y, stroke: COR.cinza, "stroke-width": 3 }, svg);
  const fa = criarSeta(svg), fb = criarSeta(svg);
  const A = criarCarga(svg, 16, 1, "A"), B = criarCarga(svg, 16, 1, "B");
  const ler = H("div", "sim-leitura", root);
  function desenhar() {
    const x = XA + st.r * ESC, f = razao();
    A.em(XA, Y); B.em(x, Y);
    A.raio(12 + 2 * st.q1); B.raio(12 + 2 * st.q2);
    const L = lim(16 * Math.sqrt(f), 4, 80);
    fa.pos(XA - 20, Y, XA - 20 - L, Y); fb.pos(x + 20, Y, x + 20 + L, Y);
    const ang = lim(f * 20, 0, 330) * Math.PI / 180 - Math.PI / 2;
    ponteiro.setAttribute("x2", 110 + 62 * Math.cos(ang)); ponteiro.setAttribute("y2", 150 + 62 * Math.sin(ang));
    ler.textContent = `Distância: ${fmtNum(st.r, 1)} cm · Cargas: ${st.q1}q e ${st.q2}q · F/F₀ = ${f >= 1 ? fmtNum(f, 2) : fmtNum(f, 3)}`;
  }
  arrastavel(B.g, svg, () => ({ x: B.x, y: Y }), p => { st.r = Math.round(lim((p.x - XA) / ESC, 2, 12) * 10) / 10; desenhar(); });
  const c1 = controle(root, { rot: "Carga de A", min: 1, max: 6, passo: 1, valor: 1, fmt: v => v + "q", ao: v => { st.q1 = v; desenhar(); } });
  const c2 = controle(root, { rot: "Carga de B", min: 1, max: 6, passo: 1, valor: 1, fmt: v => v + "q", ao: v => { st.q2 = v; desenhar(); } });
  botaoVerificar(api, () => {
    const f = razao(), iniciais = st.q1 === 1 && st.q2 === 1;
    if (m === 0) {
      if (!iniciais) return "Deixe as duas cargas em 1q e mude só a distância.";
      return Math.abs(f - 4) <= 0.2 ? true : `A força está ${fmtNum(f, 2)} vezes a inicial. ${f < 4 ? "Aproxime mais as esferas." : "Afaste um pouco as esferas."}`;
    }
    if (m === 1) {
      if (Math.abs(st.r - R0) > 0.05) return "Volte a esfera B para 4,0 cm e mude só as cargas.";
      return Math.abs(f - 6) <= 0.01 ? true : `O produto das cargas está em ${st.q1 * st.q2}. Ele precisa ser 6.`;
    }
    if (!iniciais) return "Deixe as duas cargas em 1q e mude só a distância.";
    return Math.abs(f - 1 / 9) <= 0.006 ? true : `A força está em ${fmtNum(f, 3)} da inicial; um nono é 0,111. ${f > 1 / 9 ? "Afaste mais." : "Aproxime um pouco."}`;
  });
  desenhar();
  root._t = { resolver() {
    if (m === 0) st.r = 2;
    if (m === 1) { st.q1 = 2; st.q2 = 3; c1.set(2); c2.set(3); }
    if (m === 2) st.r = 12;
    desenhar();
  } };
};

/* =====================================================================
   CENA 4 — Medir e descobrir a lei
   ===================================================================== */
SIMS.propriedades = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 320);
  const XQ = 60, ESC = 26, Y = 110;
  const GX = 400, GY = 290, GW = 210, GH = 230;
  const st = { r: 4, s2: 1, pontos: [], curva: null, novas: 0 };
  const forca = r => 4 / (r * r);
  const px = r => GX + r / 10 * GW, py = f => GY - Math.min(f, 2) / 2 * GH;
  S("line", { x1: XQ, y1: Y + 50, x2: XQ + 10 * ESC, y2: Y + 50, stroke: COR.cinza, "stroke-width": 2 }, svg);
  for (let c = 0; c <= 10; c += 2) texto(svg, XQ + c * ESC, Y + 70, c + " cm", "sim-txt", "middle");
  S("path", { d: `M ${GX} ${GY - GH} V ${GY} H ${GX + GW}`, fill: "none", stroke: COR.cinza, "stroke-width": 2 }, svg);
  texto(svg, GX + GW, GY + 20, "distância (cm)", "sim-txt", "end");
  texto(svg, GX - 8, GY - GH - 8, "força", "sim-txt", "start");
  const curva = S("path", { fill: "none", stroke: COR.campo, "stroke-width": 2.5, "stroke-dasharray": "6 5" }, svg);
  const gPts = S("g", {}, svg);
  const f1 = criarSeta(svg), f2 = criarSeta(svg);
  const q1 = criarCarga(svg, 16, 1, "q₁"), q2 = criarCarga(svg, 16, 1, "q₂");
  const ler = H("div", "sim-leitura", root);
  function desenhar() {
    const x = XQ + st.r * ESC, L = lim(34 * Math.sqrt(forca(st.r)), 8, 70);
    q1.em(XQ, Y); q2.em(x, Y); q2.sinal(st.s2);
    f1.pos(XQ - st.s2 * 20, Y, XQ - st.s2 * (20 + L), Y);
    f2.pos(x + st.s2 * 20, Y, x + st.s2 * (20 + L), Y);
    gPts.innerHTML = "";
    st.pontos.forEach(p => S("circle", { cx: px(p.r), cy: py(p.f), r: 5, fill: p.s > 0 ? COR.forca : COR.neg, stroke: "#fff", "stroke-width": 1 }, gPts));
    if (st.curva) {
      const n = +st.curva;
      let d = "";
      for (let r = 1.2; r <= 10; r += 0.2) d += `${d ? "L" : "M"} ${px(r)} ${py(2 ** n / r ** n)} `;
      curva.setAttribute("d", d);
    } else curva.setAttribute("d", "");
    ler.textContent = `Distância: ${fmtNum(st.r, 1)} cm · Força: ${fmtNum(forca(st.r), 2)} (${st.s2 > 0 ? "repulsão" : "atração"}) · Medidas: ${st.pontos.length}`;
  }
  function distintas() {
    const rs = [];
    st.pontos.forEach(p => { if (rs.every(r => Math.abs(r - p.r) >= 0.4)) rs.push(p.r); });
    return rs.length;
  }
  arrastavel(q2.g, svg, () => ({ x: q2.x, y: Y }), p => { st.r = Math.round(lim((p.x - XQ) / ESC, 1.5, 10) * 10) / 10; desenhar(); });
  function medir() {
    if (st.pontos.length >= 12) st.pontos.shift();
    st.pontos.push({ r: st.r, f: forca(st.r), s: st.s2 });
    st.novas += 1;
    desenhar();
    if (m === 0 && distintas() >= 5) api.ok();
    if (m === 2 && st.s2 < 0) api.ok();
  }
  const linha = H("div", "sim-escolha", root);
  H("span", "nome", linha, "Medição");
  botaoSim(linha, "Medir a força", medir, "");
  const eS = escolha(root, "Sinal de q₂", [["1", "Positiva"], ["-1", "Negativa"]], "1", v => { st.s2 = +v; desenhar(); });
  let eC = null;
  if (m === 1) {
    [1.5, 2, 3, 4, 6, 8].forEach(r => st.pontos.push({ r, f: forca(r), s: 1 }));
    eC = escolha(root, "Curva candidata", [["1", "1/r"], ["2", "1/r²"], ["3", "1/r³"]], null, v => { st.curva = v; desenhar(); });
    botaoVerificar(api, () => {
      if (!st.curva) return "Escolha uma das três curvas para compará-la com os pontos.";
      if (st.curva === "2") return true;
      return st.curva === "1" ? "A curva 1/r passa acima dos pontos nas distâncias grandes: a força real cai mais depressa."
        : "A curva 1/r³ passa abaixo dos pontos nas distâncias grandes: a força real cai mais devagar.";
    });
  }
  if (m === 0) botaoVerificar(api, () => (distintas() >= 5 ? true : `Você tem ${distintas()} medidas em distâncias diferentes. Arraste q₂ e meça até completar 5.`));
  if (m === 2) {
    st.pontos.push({ r: 4, f: forca(4), s: 1 });
    botaoVerificar(api, () => (st.s2 < 0 && st.novas > 0 ? true : st.s2 > 0 ? "Troque o sinal de q₂ para negativo." : "Agora clique em Medir a força, na mesma distância."));
  }
  desenhar();
  root._t = { resolver() {
    if (m === 0) [2, 3, 4, 6, 8].forEach(r => { st.r = r; medir(); });
    if (m === 1) { st.curva = "2"; eC.set("2"); desenhar(); }
    if (m === 2) { st.s2 = -1; eS.set("-1"); medir(); }
  } };
};

/* =====================================================================
   CENA 5 — Calculadora viva
   ===================================================================== */
SIMS.formula = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 250);
  const X0 = 60, ESC = 26, Y = 110;
  const ini = m === 2 ? { q1: 4, q2: 4, r: 5 } : { q1: 1, q2: 1, r: 5 };
  const st = { ...ini };
  const forca = () => K_COULOMB * Math.abs(st.q1 * st.q2) * 1e-12 / (st.r / 100) ** 2;
  const F0 = forca();
  S("line", { x1: X0, y1: Y + 50, x2: X0 + 20 * ESC, y2: Y + 50, stroke: COR.cinza, "stroke-width": 2 }, svg);
  for (let c = 0; c <= 20; c += 1) {
    S("line", { x1: X0 + c * ESC, y1: Y + (c % 5 ? 46 : 42), x2: X0 + c * ESC, y2: Y + 54, stroke: COR.cinza, "stroke-width": 1.5 }, svg);
    if (c % 5 === 0) texto(svg, X0 + c * ESC, Y + 72, c + " cm", "sim-txt", "middle");
  }
  const f1 = criarSeta(svg), f2 = criarSeta(svg);
  const c1 = criarCarga(svg, 16, 1, "q₁"), c2 = criarCarga(svg, 16, 1, "q₂");
  const tipo = texto(svg, 320, 34, "", "sim-txt forte", "middle");
  const conta = H("div", "sim-leitura conta", root);
  function desenhar() {
    const x = X0 + st.r * ESC, F = forca(), s = Math.sign(st.q1 * st.q2);
    c1.em(X0, Y); c2.em(x, Y); c1.sinal(st.q1); c2.sinal(st.q2);
    const L = lim(13 * Math.sqrt(F), F ? 8 : 0, 110);
    f1.pos(X0 - s * 20, Y, X0 - s * (20 + L), Y);
    f2.pos(x + s * 20, Y, x + s * (20 + L), Y);
    tipo.textContent = s > 0 ? "repulsão" : s < 0 ? "atração" : "sem força: uma das cargas é zero";
    conta.textContent = `F = k·|q₁|·|q₂| / r² = 8,99 × 10⁹ × ${fmtNum(Math.abs(st.q1), 1)} × 10⁻⁶ × ${fmtNum(Math.abs(st.q2), 1)} × 10⁻⁶ / (${fmtNum(st.r / 100, 3)})² = ${fmtNum(F, 2)} N`;
  }
  arrastavel(c2.g, svg, () => ({ x: c2.x, y: Y }), p => { st.r = Math.round(lim((p.x - X0) / ESC, 2, 20) * 2) / 2; desenhar(); });
  const fq = v => fmtNum(v, 1) + " μC";
  const s1 = controle(root, { rot: "q₁", min: -10, max: 10, passo: 0.5, valor: st.q1, fmt: fq, ao: v => { st.q1 = v; desenhar(); } });
  const s2 = controle(root, { rot: "q₂", min: -10, max: 10, passo: 0.5, valor: st.q2, fmt: fq, ao: v => { st.q2 = v; desenhar(); } });
  botaoVerificar(api, () => {
    const F = forca(), s = Math.sign(st.q1 * st.q2);
    if (m === 0) {
      if (s <= 0) return "Para haver repulsão, as duas cargas precisam ter o mesmo sinal.";
      return F >= 8.7 && F <= 9.3 ? true : `A força está em ${fmtNum(F, 2)} N. ${F < 9 ? "Aumente as cargas ou aproxime-as." : "Diminua as cargas ou afaste-as."}`;
    }
    if (m === 1) {
      if (s >= 0) return "Para haver atração, as cargas precisam ter sinais opostos.";
      if (Math.abs(st.r - 10) > 0.01) return "Coloque q₂ exatamente na marca de 10 cm.";
      return F >= 3.4 && F <= 3.8 ? true : `A força está em ${fmtNum(F, 2)} N. Com r = 0,10 m, o produto |q₁|·|q₂| precisa ser 4 (em μC²).`;
    }
    if (st.q1 !== ini.q1 || st.q2 !== ini.q2) return "Volte as cargas para 4,0 μC e mude só a distância.";
    return Math.abs(F - F0 / 4) <= 0.03 * F0 / 4 ? true : `A força inicial era ${fmtNum(F0, 1)} N; um quarto é ${fmtNum(F0 / 4, 1)} N. Agora está em ${fmtNum(F, 1)} N.`;
  });
  desenhar();
  root._t = { resolver() {
    if (m === 0) { st.q1 = 2; st.q2 = 5; st.r = 10; }
    if (m === 1) { st.q1 = 2; st.q2 = -2; st.r = 10; }
    if (m === 2) st.r = 10;
    s1.set(st.q1); s2.set(st.q2); desenhar();
  } };
};

/* =====================================================================
   CENA 6 — Vetores no plano
   ===================================================================== */
SIMS.vetorial = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 340);
  const CX = 320, CY = 170;
  const st = { q1: 1, s2: 1, x: 450, y: 170 };
  for (let x = 40; x <= 600; x += 40) S("line", { x1: x, y1: 10, x2: x, y2: 330, class: "sim-grade" }, svg);
  for (let y = 10; y <= 330; y += 40) S("line", { x1: 40, y1: y, x2: 600, y2: y, class: "sim-grade" }, svg);
  S("line", { x1: 40, y1: CY, x2: 600, y2: CY, stroke: COR.cinza, "stroke-width": 1.5 }, svg);
  S("line", { x1: CX, y1: 10, x2: CX, y2: 330, stroke: COR.cinza, "stroke-width": 1.5 }, svg);
  texto(svg, 596, CY - 6, "x", "sim-txt", "end"); texto(svg, CX + 8, 22, "y", "sim-txt");
  const linha = S("line", { stroke: COR.cinza, "stroke-width": 1.5, "stroke-dasharray": "5 5" }, svg);
  const fx = criarSeta(svg, "campo", 2.5), fy = criarSeta(svg, "campo", 2.5);
  const F2 = criarSeta(svg, "forca", 5), F1 = criarSeta(svg, "forca", 5);
  const c1 = criarCarga(svg, 16, 1, "q₁"), c2 = criarCarga(svg, 14, 1, "q₂");
  const ler = H("div", "sim-leitura", root);
  function vetor() {
    const dx = st.x - CX, dy = st.y - CY, r = Math.max(Math.hypot(dx, dy), 30);
    const L = lim(2.6e5 * st.q1 / (r * r), 14, 120), s = st.s2;
    return { ux: s * dx / r, uy: s * dy / r, L, r };
  }
  const angulo = v => Math.atan2(-v.uy, v.ux) * 180 / Math.PI;
  function desenhar() {
    const v = vetor();
    c1.em(CX, CY); c1.raio(12 + 3 * st.q1); c2.em(st.x, st.y); c2.sinal(st.s2);
    linha.setAttribute("x1", CX); linha.setAttribute("y1", CY); linha.setAttribute("x2", st.x); linha.setAttribute("y2", st.y);
    F2.pos(st.x, st.y, st.x + v.ux * v.L, st.y + v.uy * v.L);
    F1.pos(CX, CY, CX - v.ux * v.L, CY - v.uy * v.L);
    fx.pos(st.x, st.y, st.x + v.ux * v.L, st.y);
    fy.pos(st.x + v.ux * v.L, st.y, st.x + v.ux * v.L, st.y + v.uy * v.L);
    const z = (x, t) => (Math.abs(x) < t ? 0 : x);
    ler.textContent = `Força sobre q₂: ângulo ${fmtNum(z(angulo(v), 0.5), 0)}° · Fx = ${fmtNum(z(v.ux * v.L / 10, 0.05), 1)} · Fy = ${fmtNum(z(-v.uy * v.L / 10, 0.05), 1)} (unidades) · ${st.s2 > 0 ? "repulsão" : "atração"}`;
  }

  const eS = escolha(root, "Sinal de q₂", [["1", "Positiva"], ["-1", "Negativa"]], "1", v => { st.s2 = +v; desenhar(); });
  const rapida = m === 2 ? perguntaRapida(api, "Com q₁ quatro vezes maior, as forças sobre q₁ e sobre q₂ têm o mesmo módulo?", [

  const sQ = controle(root, { rot: "Carga q₁", min: 1, max: 4, passo: 1, valor: 1, fmt: v => v + "q", ao: v => { st.q1 = v; desenhar(); if (rapida && v === 4) rapida.mostrar(); } });
  if (m < 2) botaoVerificar(api, () => {

/* =====================================================================
   CENA 7 — Cabo de guerra: elétrica × gravitacional
   ===================================================================== */
SIMS.nucleo = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 280);
  const G = 6.674e-11, MP = 1.673e-27, ME = 9.109e-31;
  const pares = { pp: ["próton", "próton", MP, MP, 1, 1], ep: ["elétron", "próton", ME, MP, -1, 1], ee: ["elétron", "elétron", ME, ME, -1, -1] };
  const st = { par: m === 2 ? "pp" : "ep", ex: -10, min: -10, max: -10 };
  const r = () => 10 ** st.ex;
  const Fe = () => K_COULOMB * CARGA_E * CARGA_E / (r() * r());
  const Fg = () => { const p = pares[st.par]; return G * p[2] * p[3] / (r() * r()); };
  const a = criarCarga(svg, 15, 1, ""), b = criarCarga(svg, 15, 1, "");
  const X0 = 150, W = 440, bx = f => lim((Math.log10(f) + 75) / 80, 0, 1) * W;
  texto(svg, 20, 150, "Força elétrica", "sim-txt"); texto(svg, 20, 210, "Força gravitacional", "sim-txt");
  S("rect", { x: X0, y: 134, width: W, height: 22, class: "sim-trilho" }, svg);
  S("rect", { x: X0, y: 194, width: W, height: 22, class: "sim-trilho" }, svg);
  const be = S("rect", { x: X0, y: 134, height: 22, fill: COR.forca }, svg), bg = S("rect", { x: X0, y: 194, height: 22, fill: COR.cinza }, svg);
  const te = texto(svg, X0 + 6, 128, "", "sim-txt"), tg = texto(svg, X0 + 6, 188, "", "sim-txt");
  const tr = texto(svg, 320, 262, "", "sim-txt forte", "middle");
  const td = texto(svg, 320, 96, "", "sim-txt", "middle");
  function desenhar() {
    const p = pares[st.par], sep = 40 + (st.ex + 15) / 6 * 200;
    a.em(320 - sep / 2, 50); b.em(320 + sep / 2, 50);
    a.sinal(p[4]); b.sinal(p[5]); a.rotulo(p[0]); b.rotulo(p[1]);
    a.raio(p[2] === MP ? 15 : 8); b.raio(p[3] === MP ? 15 : 8);
    be.setAttribute("width", bx(Fe())); bg.setAttribute("width", bx(Fg()));
    te.textContent = fmtSci(Fe()) + " N"; tg.textContent = fmtSci(Fg()) + " N";
    td.textContent = `distância: ${fmtSci(r())} m`;
    tr.textContent = `Fe / Fg ≈ ${fmtSci(Fe() / Fg())}`;
  }
  const ePar = escolha(root, "Par de partículas", [["pp", "Próton e próton"], ["ep", "Elétron e próton"], ["ee", "Elétron e elétron"]], st.par, v => { st.par = v; desenhar(); });
  const rapida = m === 0 ? perguntaRapida(api, "Enquanto você mudava a distância, a razão Fe/Fg mudou?", [
    ["Mudou", false, "Mova a barra de novo olhando só para o número da razão: ele fica parado."], ["Não mudou", true, ""]]) : null;
  const sD = controle(root, { rot: "Distância", min: -15, max: -9, passo: 0.01, valor: st.ex, fmt: v => fmtSci(10 ** v) + " m", ao: v => {
    st.ex = v; st.min = Math.min(st.min, v); st.max = Math.max(st.max, v); desenhar();
    if (rapida && st.max - st.min >= 3) rapida.mostrar();
  } });
  if (m === 1) botaoVerificar(api, () => (st.par === "pp" ? true : "Compare o número da razão nos três pares. A gravidade cresce com a massa, e o próton é a partícula mais pesada."));
  if (m === 2) botaoVerificar(api, () => {
    if (st.par !== "pp") return "Escolha o par próton e próton.";
    const f = Fe();
    return f >= 13 && f <= 15 ? true : `A força elétrica está em ${fmtSci(f)} N. ${f < 14 ? "Aproxime os prótons." : "Afaste um pouco os prótons."}`;
  });
  desenhar();
  root._t = { resolver() {
    if (m === 0) { st.min = -15; st.max = -9; rapida.mostrar(); }
    if (m === 1) { st.par = "pp"; ePar.set("pp"); }
    if (m === 2) { st.ex = Math.log10(Math.sqrt(K_COULOMB * CARGA_E * CARGA_E / 14)); sD.set(st.ex); }
    desenhar();
  } };
};

/* =====================================================================
   CENA 8 — Três cargas (superposição)
   ===================================================================== */
SIMS.superposicao = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 340);
  const A = { x: 200, y: 170, q: [2, 4, 2][m] }, B = { x: 440, y: 170, q: [2, 1, -2][m] };
  const st = { x: 320, y: 70 };
  for (let x = 40; x <= 600; x += 40) S("line", { x1: x, y1: 10, x2: x, y2: 330, class: "sim-grade" }, svg);
  for (let y = 10; y <= 330; y += 40) S("line", { x1: 40, y1: y, x2: 600, y2: y, class: "sim-grade" }, svg);
  const fA = criarSeta(svg, "campo", 3), fB = criarSeta(svg, "campo", 3), fR = criarSeta(svg, "forca", 6);
  const rot = q => (q > 0 ? "+" : "−") + (Math.abs(q) === 1 ? "" : Math.abs(q)) + "q";
  const cA = criarCarga(svg, 12 + 2 * Math.abs(A.q), A.q, rot(A.q)), cB = criarCarga(svg, 12 + 2 * Math.abs(B.q), B.q, rot(B.q));
  const c3 = criarCarga(svg, 12, 1, "q₃");
  cA.em(A.x, A.y); cB.em(B.x, B.y);
  const ler = H("div", "sim-leitura", root);
  function forcas() {
    const f = o => {
      const dx = st.x - o.x, dy = st.y - o.y, r = Math.max(Math.hypot(dx, dy), 26);
      const k = 4e5 * o.q / (r * r * r);
      return { x: k * dx, y: k * dy };
    };
    const a = f(A), b = f(B), R = { x: a.x + b.x, y: a.y + b.y };
    return { a, b, R, soma: Math.hypot(a.x, a.y) + Math.hypot(b.x, b.y), mod: Math.hypot(R.x, R.y) };
  }
  const corta = (v, max) => { const n = Math.hypot(v.x, v.y); return n > max ? { x: v.x * max / n, y: v.y * max / n } : v; };
  function desenhar() {
    const f = forcas(), a = corta(f.a, 110), b = corta(f.b, 110), R = corta(f.R, 130);
    c3.em(st.x, st.y);
    fA.pos(st.x, st.y, st.x + a.x, st.y + a.y); fB.pos(st.x, st.y, st.x + b.x, st.y + b.y); fR.pos(st.x, st.y, st.x + R.x, st.y + R.y);
    const ang = Math.atan2(-f.R.y, f.R.x) * 180 / Math.PI;
    ler.textContent = `Resultante: ${fmtNum(f.mod / 10, 2)} (unidades) · ${f.mod / f.soma < 0.1 ? "quase zero" : "ângulo " + fmtNum(ang, 0) + "°"} · azul: força de cada carga; amarelo: soma`;
  }
  arrastavel(c3.g, svg, () => ({ x: st.x, y: st.y }), p => { st.x = lim(p.x, 50, 590); st.y = lim(p.y, 20, 320); desenhar(); });
  botaoVerificar(api, () => {
    const f = forcas();
    if (m < 2) {
      if (f.mod / f.soma < 0.1) return true;
      return m === 0 ? "A resultante ainda não é zero. Procure o ponto em que as duas setas azuis ficam iguais e opostas."
        : "Ainda não. As setas azuis precisam ser iguais e opostas: a carga maior tem de ficar mais longe de q₃.";
    }
    const ang = Math.atan2(-f.R.y, f.R.x) * 180 / Math.PI;
    return Math.abs(ang) <= 4 && f.mod > 0 ? true : `A resultante está a ${fmtNum(ang, 0)}°. Procure um ponto em que os componentes verticais das duas forças se cancelem.`;
  });
  desenhar();
  root._t = { resolver() {
    if (m === 0) { st.x = 320; st.y = 170; }
    if (m === 1) { st.x = 360; st.y = 170; }
    if (m === 2) { st.x = 320; st.y = 90; }
    desenhar();
  } };
};

/* =====================================================================
   CENA 9 — Forças em 3D
   ===================================================================== */
SIMS.espaco3d = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 340);
  const ini = [{ q1: 2, q2: 6, b: 10 }, { q1: 2, q2: 2, b: 10 }, { q1: 3.35, q2: 4.45, b: 10 }][m];
  const st = { ...ini, yaw: -0.6, pitch: 0.45 };
  const CX = 300, CY = 215, ESC = 105;
  const F1 = () => 0.899 * st.q1, F2 = () => 0.899 * st.q2 / (st.b / 10) ** 2;
  const fundo = S("rect", { x: 0, y: 0, width: 640, height: 340, fill: "transparent", class: "pega-fundo" }, svg);
  const gAx = S("g", {}, svg);
  const eixos = ["x", "y", "z"].map(n => ({ n, ln: S("line", { stroke: COR.cinza, "stroke-width": 1.5 }, gAx), t: texto(gAx, 0, 0, n, "sim-txt") }));
  const piso = S("polygon", { class: "sim-piso" }, gAx);
  const l1 = S("line", { stroke: COR.cinza, "stroke-width": 1.5, "stroke-dasharray": "5 5" }, svg), l2 = S("line", { stroke: COR.cinza, "stroke-width": 1.5, "stroke-dasharray": "5 5" }, svg);
  const s1 = criarSeta(svg, "campo", 4), s2 = criarSeta(svg, "campo", 4), sR = criarSeta(svg, "forca", 6);
  const c0 = criarCarga(svg, 13, -1, "q"), c1 = criarCarga(svg, 13, 1, "q₁"), c2 = criarCarga(svg, 13, 1, "q₂");
  texto(svg, 14, 24, "Arraste o fundo para girar a cena", "sim-txt");
  const ler = H("div", "sim-leitura", root);
  function proj(x, y, z) {
    const X = x * Math.cos(st.yaw) - y * Math.sin(st.yaw), Y = x * Math.sin(st.yaw) + y * Math.cos(st.yaw);
    return [CX + ESC * X, CY - ESC * (z * Math.cos(st.pitch) + Y * Math.sin(st.pitch))];
  }
  const def = (ln, a, b) => { ln.setAttribute("x1", a[0]); ln.setAttribute("y1", a[1]); ln.setAttribute("x2", b[0]); ln.setAttribute("y2", b[1]); };
  function desenhar() {
    const O = proj(0, 0, 0), b = st.b / 10, f1 = F1(), f2 = F2(), E = 0.26;
    [[1.9, 0, 0], [0, 1.6, 0], [0, 0, 2.3]].forEach((p, i) => { const q = proj(...p); def(eixos[i].ln, O, q); eixos[i].t.setAttribute("x", q[0] + 6); eixos[i].t.setAttribute("y", q[1]); });
    piso.setAttribute("points", [[0, 0, 0], [1.6, 0, 0], [1.6, 1.4, 0], [0, 1.4, 0]].map(p => proj(...p).join(",")).join(" "));
    const P1 = proj(1, 0, 0), P2 = proj(0, 0, b);
    c0.em(O[0], O[1]); c1.em(P1[0], P1[1]); c2.em(P2[0], P2[1]);
    def(l1, O, P1); def(l2, O, P2);
    const A = proj(E * f1, 0, 0), B = proj(0, 0, E * f2), R = proj(E * f1, 0, E * f2);
    s1.pos(O[0], O[1], A[0], A[1]); s2.pos(O[0], O[1], B[0], B[1]); sR.pos(O[0], O[1], R[0], R[1]);
    const mod = Math.hypot(f1, f2), ang = Math.atan2(f2, f1) * 180 / Math.PI;
    ler.textContent = `F₁ = ${fmtNum(f1, 2)} N (eixo x) · F₂ = ${fmtNum(f2, 2)} N (eixo z) · |F| = ${fmtNum(mod, 2)} N · ângulo com o eixo x: ${fmtNum(ang, 0)}°`;
  }
  let arr = null;
  fundo.addEventListener("pointerdown", ev => { arr = { x: ev.clientX, y: ev.clientY, yaw: st.yaw, pitch: st.pitch }; try { fundo.setPointerCapture(ev.pointerId); } catch (_) { /* sem captura */ } });
  fundo.addEventListener("pointermove", ev => {
    if (!arr) return;
    st.yaw = arr.yaw - (ev.clientX - arr.x) * 0.01; st.pitch = lim(arr.pitch + (ev.clientY - arr.y) * 0.008, 0.05, 1.4);
    desenhar();
  });
  const solta = () => { arr = null; };
  fundo.addEventListener("pointerup", solta); fundo.addEventListener("pointercancel", solta);
  const fq = v => fmtNum(v, 2) + " μC";
  const sq1 = controle(root, { rot: "q₁", min: 0.5, max: 10, passo: 0.05, valor: st.q1, fmt: fq, ao: v => { st.q1 = v; desenhar(); } });
  const sq2 = controle(root, { rot: "q₂", min: 0.5, max: 10, passo: 0.05, valor: st.q2, fmt: fq, ao: v => { st.q2 = v; desenhar(); } });
  const sb = controle(root, { rot: "Distância de q₂", min: 10, max: 20, passo: 0.5, valor: st.b, fmt: v => fmtNum(v, 1) + " cm", ao: v => { st.b = v; desenhar(); } });
  controle(root, { rot: "Girar a cena", min: -3.14, max: 3.14, passo: 0.02, valor: st.yaw, fmt: v => Math.round(v * 180 / Math.PI) + "°", ao: v => { st.yaw = v; desenhar(); } });
  botaoVerificar(api, () => {
    const f1 = F1(), f2 = F2();
    if (m === 0) return Math.abs(f1 - f2) / Math.max(f1, f2) < 0.02 ? true : `F₁ = ${fmtNum(f1, 2)} N e F₂ = ${fmtNum(f2, 2)} N. As distâncias são iguais: o que precisa valer para as cargas?`;
    if (m === 1) {
      if (st.b !== 10) return "Deixe q₂ a 10,0 cm nesta missão.";
      return Math.abs(f1 - 3) <= 0.1 && Math.abs(f2 - 4) <= 0.1 ? true : `F₁ = ${fmtNum(f1, 2)} N e F₂ = ${fmtNum(f2, 2)} N. Cada 1 μC produz cerca de 0,90 N a 10 cm.`;
    }
    if (st.q1 !== ini.q1 || st.q2 !== ini.q2) return "Não mude as cargas nesta missão: só a distância de q₂.";
    return st.b >= 19.75 ? true : `q₂ está a ${fmtNum(st.b, 1)} cm. O dobro de 10 cm é 20 cm.`;
  });
  desenhar();
  root._t = { resolver() {
    if (m === 0) { st.q1 = 4; st.q2 = 4; }
    if (m === 1) { st.q1 = 3.35; st.q2 = 4.45; }
    if (m === 2) st.b = 20;
