  } };
};

/* =====================================================================
   CENA 10 — Onde o próton para?
   ===================================================================== */
SIMS.equilibrio = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 340);
  const cfg = m === 2 ? { qa: 1, qb: 4, x0: 120, esc: 400, min: 0.1, max: 0.9, ini: 0.6, alvo: 1 / 3, tol: 0.03 }
    : { qa: 8, qb: -2, x0: 90, esc: 130, min: -0.5, max: 3.9, ini: m === 1 ? 2 : 2.9, alvo: 2, tol: 0.05 };
  const st = { x: cfg.ini, v: 0, solto: false, soltou: false };
  const Y = 90, GY = 250, GH = 70, KG = m === 2 ? 0.08 : 1.5;
  const px = x => cfg.x0 + x * cfg.esc;
  const parte = (q, x, c) => q * Math.sign(x - c) / Math.max((x - c) ** 2, 0.004);
  const res = x => parte(cfg.qa, x, 0) + parte(cfg.qb, x, 1);
  const valida = x => { x = lim(x, cfg.min, cfg.max); if (Math.abs(x) < 0.12) x = x < 0 ? -0.12 : 0.12; if (Math.abs(x - 1) < 0.12) x = x < 1 ? 0.88 : 1.12; return x; };
  S("line", { x1: 20, y1: Y, x2: 620, y2: Y, stroke: COR.cinza, "stroke-width": 2 }, svg);
  const marcas = m === 2 ? [0, 1 / 3, 2 / 3, 1] : [0, 1, 2, 3];
  marcas.forEach(v => {
    S("line", { x1: px(v), y1: Y - 6, x2: px(v), y2: Y + 6, stroke: COR.cinza, "stroke-width": 2 }, svg);
    const r = m === 2 ? ["0", "L/3", "2L/3", "L"][marcas.indexOf(v)] : (v === 0 ? "0" : v === 1 ? "L" : v + "L");
    texto(svg, px(v), Y + 44, r, "sim-txt", "middle");
  });
  S("line", { x1: 20, y1: GY, x2: 620, y2: GY, stroke: COR.cinza, "stroke-width": 1.5 }, svg);
  texto(svg, 22, GY - GH - 4, "força resultante sobre o próton (para cima = para a direita)", "sim-txt");
  let d = "", aberto = false;
  for (let X = 20; X <= 620; X += 2) {
    const x = (X - cfg.x0) / cfg.esc;
    if (Math.abs(x) < 0.1 || Math.abs(x - 1) < 0.1) { aberto = false; continue; }
    const yv = GY - GH * Math.tanh(res(x) * KG);
    d += `${aberto ? "L" : "M"} ${X} ${yv} `; aberto = true;
  }
  S("path", { d, fill: "none", stroke: COR.campo, "stroke-width": 2.5 }, svg);
  const marcador = S("circle", { r: 6, fill: COR.forca, stroke: "#fff", "stroke-width": 1.5 }, svg);
  const guia = S("line", { stroke: COR.forca, "stroke-width": 1, "stroke-dasharray": "4 4" }, svg);
  const rot = q => (q > 0 ? "+" : "−") + (Math.abs(q) === 1 ? "" : Math.abs(q)) + "q";
  const ca = criarCarga(svg, 12 + Math.abs(cfg.qa), cfg.qa, rot(cfg.qa)), cb = criarCarga(svg, 12 + Math.abs(cfg.qb), cfg.qb, rot(cfg.qb));
  ca.em(px(0), Y); cb.em(px(1), Y);
  const fa = criarSeta(svg, "campo", 3), fb = criarSeta(svg, "campo", 3), fr = criarSeta(svg, "forca", 6);
  const p = criarCarga(svg, 10, 1, "");
  texto(svg, 600, 30, "bolinha vermelha pequena: próton", "sim-txt", "end");
  const ler = H("div", "sim-leitura", root);
  function desenhar() {
    const X = px(st.x), k = m === 2 ? 2.2 : 14;
    const a = lim(parte(cfg.qa, st.x, 0) * k, -100, 100), b = lim(parte(cfg.qb, st.x, 1) * k, -100, 100), r = lim(res(st.x) * k, -110, 110);
    p.em(X, Y);
    fa.pos(X, Y - 24, X + a, Y - 24); fb.pos(X, Y - 36, X + b, Y - 36); fr.pos(X, Y + 22, X + r, Y + 22);
    const yv = GY - GH * Math.tanh(res(st.x) * KG);
    marcador.setAttribute("cx", X); marcador.setAttribute("cy", yv);
    guia.setAttribute("x1", X); guia.setAttribute("x2", X); guia.setAttribute("y1", Y + 12); guia.setAttribute("y2", yv);
    const R = res(st.x);
    ler.textContent = `Posição do próton: x = ${fmtNum(st.x, 2)} L · Resultante: ${Math.abs(R) < 0.02 * (Math.abs(cfg.qa) + Math.abs(cfg.qb)) ? "praticamente zero" : R > 0 ? "para a direita" : "para a esquerda"}`;
  }
  arrastavel(p.g, svg, () => ({ x: px(st.x), y: Y }), q => { st.solto = false; st.v = 0; st.x = Math.round(valida((q.x - cfg.x0) / cfg.esc) * 100) / 100; desenhar(); });
  const rapida = m === 1 ? perguntaRapida(api, "Depois de solto, o próton voltou ao ponto de equilíbrio? Esse equilíbrio é:", [
    ["Estável", false, "Solte de novo e observe: o próton se afasta cada vez mais de x = 2L."], ["Instável", true, ""]]) : null;
  if (m === 1) {
    const linha = H("div", "sim-escolha", root);
    H("span", "nome", linha, "Experimento");
    botaoSim(linha, "Soltar o próton", () => {
      if (Math.abs(st.x - 2) < 0.02) { api.aviso("O próton está exatamente no equilíbrio e não se move. Arraste-o um pouquinho para o lado e solte de novo."); return; }
      st.solto = true; st.v = 0; st.soltou = true;
      setTimeout(() => rapida.mostrar(), 900);
    }, "");
    botaoSim(linha, "Voltar para 2L", () => { st.solto = false; st.v = 0; st.x = 2; desenhar(); }, "");
    animar(svg, dt => {
      if (!st.solto) return;
      st.v += res(st.x) * 5 * dt; st.x += st.v * dt;
      if (st.x <= 1.13 || st.x >= cfg.max) { st.x = lim(st.x, 1.13, cfg.max); st.solto = false; }
      desenhar();
    });
  } else {
    botaoVerificar(api, () => {
      if (Math.abs(st.x - cfg.alvo) <= cfg.tol) return true;
      if (m === 0) return st.x < 1 ? "Entre as cargas ou à esquerda de +8q, as duas forças não conseguem se cancelar. Procure à direita da carga negativa."
        : `Em x = ${fmtNum(st.x, 2)} L a resultante aponta ${res(st.x) > 0 ? "para a direita" : "para a esquerda"}. Siga o gráfico até a curva cruzar o zero.`;
      return `Em x = ${fmtNum(st.x, 2)} L a resultante aponta ${res(st.x) > 0 ? "para a direita" : "para a esquerda"}. O equilíbrio fica mais perto da carga menor.`;
    });
  }
  desenhar();
  root._t = { resolver() {
    if (m === 1) { st.x = 2.1; st.solto = true; st.soltou = true; rapida.mostrar(); }
    else st.x = cfg.alvo;
    desenhar();
  } };
};

/* =====================================================================
   CENA 11 — Casca e esferas condutoras
   ===================================================================== */
SIMS.esferas = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 340);
  const ler = H("div", "sim-leitura", root);
  if (m === 0) {
    const CX = 300, CY = 170, R = 105;
    const st = { x: 540, y: 170 };
    S("circle", { cx: CX, cy: CY, r: R, fill: "none", stroke: COR.pos, "stroke-width": 6 }, svg);
    for (let i = 0; i < 16; i++) {
      const a = i * Math.PI / 8;
      const t = S("text", { x: CX + (R + 16) * Math.cos(a), y: CY + (R + 16) * Math.sin(a) + 5, "text-anchor": "middle", class: "sim-ion" }, svg); t.textContent = "+";
    }
    const centro = S("circle", { cx: CX, cy: CY, r: 3, fill: COR.cinza }, svg);
    const f = criarSeta(svg, "forca", 6);
    const c = criarCarga(svg, 11, 1, "carga de prova");
    function desenhar() {
      const dx = st.x - CX, dy = st.y - CY, dist = Math.hypot(dx, dy);
      c.em(st.x, st.y);
      const dentro = dist < R - 6;
      const L = dentro ? 0 : lim(1.4e6 / (dist * dist), 14, 110);
      f.pos(st.x, st.y, st.x + (dist ? dx / dist : 0) * L, st.y + (dist ? dy / dist : 0) * L);
      centro.style.opacity = dentro ? 0.3 : 1;
      ler.textContent = dentro ? "Dentro da casca: força = 0, em qualquer ponto." : `Fora da casca: a força aponta para longe do centro, como se toda a carga estivesse nele. Distância ao centro: ${fmtNum(dist / R, 2)} R`;
      if (dist < R - 14) api.ok();
    }
    arrastavel(c.g, svg, () => ({ x: st.x, y: st.y }), p => { st.x = lim(p.x, 30, 610); st.y = lim(p.y, 20, 320); desenhar(); });
    desenhar();
    root._t = { resolver() { st.x = CX + 30; st.y = CY - 20; desenhar(); } };
    return;
  }
  const R = 30;
  const es = [{ n: "A", x: 150, y: 140, q: 8 }, { n: "B", x: 320, y: 140, q: 0 }, { n: "C", x: 490, y: 140, q: 0 }];
  S("rect", { x: 250, y: 268, width: 140, height: 56, rx: 8, class: "sim-terra" }, svg);
  texto(svg, 320, 300, "terra: descarrega", "sim-txt", "middle");
  const fracao = v => {
    if (Math.abs(v) < 1e-9) return "0";
    let num = Math.round(v * 8), den = 64;
    const g = (a, b) => (b ? g(b, a % b) : a), k = g(Math.abs(num), den);
    num /= k; den /= k;
    return den === 1 ? (num === 1 ? "Q" : num + "Q") : (num === 1 ? "Q/" + den : num + "Q/" + den);
  };
  es.forEach(e => {
    e.g = S("g", {}, svg);
    e.c = S("circle", { r: R, stroke: "#6B7A80", "stroke-width": 1.5 }, e.g);
    e.t = S("text", { "text-anchor": "middle", dy: "0.35em", class: "sim-txt forte escuro" }, e.g);
    e.l = S("text", { "text-anchor": "middle", y: -R - 8, class: "sim-txt" }, e.g); e.l.textContent = "esfera " + e.n;
    arrastavel(e.g, svg, () => ({ x: e.x, y: e.y }), p => { e.x = lim(p.x, 40, 600); e.y = lim(p.y, 50, 300); contatos(e); desenhar(); });
  });
  function contatos(e) {
    es.forEach(o => {
      if (o === e || Math.hypot(o.x - e.x, o.y - e.y) > 2 * R + 3 || Math.abs(o.q - e.q) < 1e-9) return;
      o.q = e.q = (o.q + e.q) / 2;
    });
    if (e.x > 250 && e.x < 390 && e.y > 262) e.q = 0;
  }
  function desenhar() {
    es.forEach(e => {
      e.g.setAttribute("transform", `translate(${e.x},${e.y})`);
      e.c.setAttribute("fill", e.q > 0 ? `rgba(207,80,68,${0.25 + 0.09 * e.q})` : "#D5D9D2");
      e.t.textContent = fracao(e.q);
    });
    const total = es.reduce((s, e) => s + e.q, 0);
    ler.textContent = `A: ${fracao(es[0].q)} · B: ${fracao(es[1].q)} · C: ${fracao(es[2].q)} · Soma: ${fracao(total)}`;
    if (m === 1 && es[0].q === 4 && es[1].q === 4) api.ok();
  }
  if (m === 2) botaoVerificar(api, () => (es[2].q === 2 ? true : `A esfera C está com ${fracao(es[2].q)}. Cada contato divide igualmente a carga das duas esferas que se tocam.`));
  if (m === 1) botaoVerificar(api, () => (es[0].q === 4 && es[1].q === 4 ? true : "Arraste a esfera A até encostar na esfera B."));
  desenhar();
  root._t = { resolver() {
    es[0].x = es[1].x - 2 * R; es[0].y = es[1].y; contatos(es[0]);
    if (m === 2) { es[2].x = es[1].x + 2 * R; es[2].y = es[1].y; contatos(es[2]); }
    desenhar();
  } };
};

/* =====================================================================
   CENA 12 — Contador de elétrons
   ===================================================================== */
SIMS.quantizacao = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 300);
  const ler = H("div", "sim-leitura", root);
  const cargaTxt = n => (n === 0 ? "0" : `${n > 0 ? "+" : "−"}${Math.abs(n)}e = ${n > 0 ? "+" : "−"}${fmtSci(Math.abs(n) * CARGA_E, 1)} C`);
  if (m < 2) {
    const st = { extra: 0, cliques: 0 };
    const CX = 320, CY = 150;
    S("circle", { cx: CX, cy: CY, r: 100, class: "sim-corpo" }, svg);
    const gI = S("g", {}, svg), gE = S("g", {}, svg);
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 + 0.3;
      const t = S("text", { x: CX + 40 * Math.cos(a), y: CY + 40 * Math.sin(a) + 6, "text-anchor": "middle", class: "sim-ion" }, gI); t.textContent = "+";
    }
    const tq = texto(svg, CX, 280, "", "sim-txt forte", "middle");
    function desenhar() {
      gE.innerHTML = "";
      const n = 6 + st.extra;
      for (let i = 0; i < n; i++) {
        const a = i * 2 * Math.PI / Math.max(n, 1) - 1.2;
        S("circle", { cx: CX + 74 * Math.cos(a), cy: CY + 74 * Math.sin(a), r: 7, fill: COR.neg, stroke: "#fff", "stroke-width": 1 }, gE);
      }
      tq.textContent = "carga da esfera: " + cargaTxt(-st.extra);
      ler.textContent = `Prótons: 6 · Elétrons: ${n} · Elétrons ${st.extra >= 0 ? "a mais" : "faltando"}: ${Math.abs(st.extra)}`;
    }
    const muda = d => { st.extra = lim(st.extra + d, -6, 6); st.cliques += 1; desenhar(); if (rapida && st.cliques >= 3) rapida.mostrar(); };
    const rapida = m === 1 ? perguntaRapida(api, "Dá para deixar a esfera com exatamente +3,57e?", [
      ["É possível", false, "Tente: a carga pula de +3e para +4e, sem nenhum valor no meio."], ["É impossível", true, ""]]) : null;
    const linha = H("div", "sim-escolha", root);
    H("span", "nome", linha, "Elétrons");
    botaoSim(linha, "Colocar 1 elétron", () => muda(1), "");
    botaoSim(linha, "Retirar 1 elétron", () => muda(-1), "");
    if (m === 0) botaoVerificar(api, () => (st.extra === 3 ? true
      : `A esfera está com ${cargaTxt(-st.extra)}. Divida 4,8 × 10⁻¹⁹ C por e = 1,6 × 10⁻¹⁹ C para saber quantos elétrons a mais são necessários.`));
    desenhar();
    root._t = { resolver() { if (m === 0) { st.extra = 3; desenhar(); } else { st.cliques = 3; rapida.mostrar(); } } };
    return;
  }
  const VX = 170, SX = 470, Y = 150;
  S("rect", { x: VX - 120, y: Y - 30, width: 240, height: 60, rx: 30, fill: "#BFE3EA", stroke: "#6B7A80" }, svg);
  S("rect", { x: SX - 110, y: Y - 70, width: 220, height: 140, rx: 12, fill: "#EDE6D2", stroke: "#B9AE8C" }, svg);
  texto(svg, VX, Y - 44, "bastão de vidro", "sim-txt", "middle"); texto(svg, SX, Y - 82, "pano de seda", "sim-txt", "middle");
  const tv = texto(svg, VX, Y + 62, "", "sim-txt forte", "middle"), ts = texto(svg, SX, Y + 96, "", "sim-txt forte", "middle");
  const tt = texto(svg, 320, 280, "", "sim-txt forte", "middle");
  const els = [];
  for (let i = 0; i < 8; i++) {
    const e = { x: VX - 84 + i * 24, y: Y + (i % 2 ? 10 : -10), lado: "v" };
    e.el = S("circle", { r: 10, fill: COR.neg, stroke: "#fff", "stroke-width": 1.5 }, svg);
    arrastavel(e.el, svg, () => ({ x: e.x, y: e.y }), p => { e.x = lim(p.x, 20, 620); e.y = lim(p.y, 20, 280); desenhar(); }, () => soltar(e));
    e.el.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); mudarLado(e, e.lado === "v" ? "s" : "v"); } });
    e.el.setAttribute("aria-label", "elétron: arraste para o pano de seda ou pressione Enter");
    els.push(e);
  }
  function mudarLado(e, lado) {
    e.lado = lado;
    const i = els.filter(o => o.lado === lado && o !== e).length;
    if (lado === "s") { e.x = SX - 70 + (i % 4) * 46; e.y = Y - 30 + Math.floor(i / 4) * 50; }
    else { e.x = VX - 84 + (i % 8) * 24; e.y = Y + (i % 2 ? 10 : -10); }
    desenhar();
  }
  function soltar(e) { mudarLado(e, Math.abs(e.x - SX) < 115 && Math.abs(e.y - Y) < 75 ? "s" : "v"); }
  function desenhar() {
    els.forEach(e => { e.el.setAttribute("cx", e.x); e.el.setAttribute("cy", e.y); });
    const n = els.filter(e => e.lado === "s").length;
    tv.textContent = "vidro: " + (n ? `+${n}e` : "0"); ts.textContent = "seda: " + (n ? `−${n}e` : "0");
    tt.textContent = "soma das cargas: 0";
    ler.textContent = `Elétrons transferidos: ${n} · Carga do vidro: ${cargaTxt(n)} · Carga da seda: ${cargaTxt(-n)}`;
    if (n === 4) api.ok();
  }
  botaoVerificar(api, () => {
    const n = els.filter(e => e.lado === "s").length;
    return n === 4 ? true : `Há ${n} elétrons na seda. Arraste as bolinhas azuis do vidro para o pano até serem 4.`;
  });
  desenhar();
  root._t = { resolver() { els.slice(0, 4).forEach(e => mudarLado(e, "s")); } };
};

/* =====================================================================
   CENA 13 — O fio de cargas
   ===================================================================== */
SIMS.fio = function (root, api) {
  const m = api.cfg.m;
  const svg = criarPalco(root, 320);
  const CX = 320, YF = 250, ESP = 14;
  const st = { n: m === 2 ? 9 : 11, x: m === 2 ? CX + 60 : CX + 120, y: m === 2 ? YF - 60 : 150 };
  const gC = S("g", {}, svg);
  const ref = S("line", { stroke: COR.cinza, "stroke-width": 1.5, "stroke-dasharray": "5 5" }, svg);
  const f = criarSeta(svg, "forca", 6);
  const P = criarCarga(svg, 10, 1, "P");
  const ler = H("div", "sim-leitura", root);
  function campo() {
    let fx = 0, fy = 0;
    for (let i = 0; i < st.n; i++) {
      const cx = CX + (i - (st.n - 1) / 2) * ESP, dx = st.x - cx, dy = st.y - YF, r3 = Math.hypot(dx, dy) ** 3;
      fx += dx / r3; fy += dy / r3;
    }
    return { fx, fy, incl: Math.atan2(Math.abs(fx), -fy) * 180 / Math.PI };
  }
  function desenhar() {
    gC.innerHTML = "";
    for (let i = 0; i < st.n; i++) S("circle", { cx: CX + (i - (st.n - 1) / 2) * ESP, cy: YF, r: 6, fill: COR.pos, stroke: "#fff", "stroke-width": 1 }, gC);
    const c = campo(), n = Math.hypot(c.fx, c.fy);
    P.em(st.x, st.y);
    ref.setAttribute("x1", st.x); ref.setAttribute("x2", st.x); ref.setAttribute("y1", st.y); ref.setAttribute("y2", st.y - 90);
    f.pos(st.x, st.y, st.x + c.fx / n * 80, st.y + c.fy / n * 80);
    ler.textContent = `Cargas no fio: ${st.n} · Inclinação da força em relação à perpendicular: ${fmtNum(c.incl, 1)}°`;
  }
  if (m < 2) arrastavel(P.g, svg, () => ({ x: st.x, y: st.y }), p => {
    st.x = lim(p.x, 40, 600); st.y = lim(p.y, 40, YF - 30);
    if (Math.abs(st.x - CX) < 6) st.x = CX;
    desenhar();
  });
  const sN = controle(root, { rot: "Número de cargas", min: 3, max: 41, passo: 2, valor: st.n, fmt: v => String(v), ao: v => { st.n = v; desenhar(); } });
  botaoVerificar(api, () => {
    const c = campo();
    if (m === 0) return c.incl < 2 ? true : `A força está inclinada ${fmtNum(c.incl, 1)}°. Procure o ponto em que cada carga da esquerda tem uma parceira à direita.`;
    if (m === 1) return c.incl > 20 ? true : `A inclinação está em ${fmtNum(c.incl, 1)}°. Leve P para além de uma das pontas do fio e mais perto dele.`;
    return c.incl < 3 ? true : `Com ${st.n} cargas, a inclinação em P é de ${fmtNum(c.incl, 1)}°. Aumente o fio para afastar as pontas.`;
  });
  desenhar();
  root._t = { resolver() {
    if (m === 0) { st.x = CX; st.y = 150; }
    if (m === 1) { st.x = CX + 100; st.y = YF - 40; }
    if (m === 2) { st.n = 41; sN.set(41); }
    desenhar();
  }, incl: () => campo().incl };
};

/* =====================================================================
   MISSÕES INTERATIVAS
   ===================================================================== */
function renderMissao(e, qAtual, st) {
  const total = e.perguntas.length, p = e.perguntas[qAtual];
  const pontos = renderPontos(e, qAtual, st);
  const resumoLink = st.fim ? `<button class="link" type="button" data-acao="fechar-revisao">Voltar ao resumo</button>` : "";
  return `<section class="quiz missao" aria-labelledby="enunciado">
      <div class="quiz-cab">
        <div class="quiz-cab-esq"><span>Atividade ${qAtual + 1} de ${total}</span><span class="tag-tipo sim">Jogo interativo</span>${resumoLink}</div>
        <div class="pontos" role="group" aria-label="Navegar entre atividades da cena">${pontos}</div>
      </div>
      <h2 class="enunciado" id="enunciado" tabindex="-1">${esc(p.q)}</h2>
      <div class="sim" id="sim"></div>
      <div id="sim-extra"></div>
      <div class="sim-acoes" id="sim-acoes"></div>
      <div aria-live="polite" id="sim-fb"></div>
      <div id="sim-prox">${renderRodapeQuiz(e, qAtual, st)}</div>
    </section>`;
}
function montarSim() {
  const alvo = $("#sim");
  if (!alvo) return;
  const m = modulo(ui.modulo), e = m.etapas[ui.etapa], st = estadoEtapa(e.id);
  const qAtual = ui.q ?? proximaAberta(e);
  ui.q = qAtual;
  const p = e.perguntas[qAtual];
  const r = st.resp[qAtual] || (st.resp[qAtual] = { t: 0, ok: false });
  alvo.innerHTML = ""; $("#sim-extra").innerHTML = ""; $("#sim-acoes").innerHTML = "";
  const fb = $("#sim-fb");
  function sucesso() {
    fb.innerHTML = `<div class="feedback acerto"><strong>Missão cumprida${r.t === 1 ? ", de primeira" : ""}! +${PONTOS[Math.min(r.t - 1, 2)]} XP</strong><p>${esc(p.exp)}</p></div>`;
    $("#sim-prox").innerHTML = renderRodapeQuiz(e, qAtual, st);
    const bolinhas = document.querySelectorAll(".quiz-cab .pontos .ponto");
    if (bolinhas[qAtual]) bolinhas[qAtual].classList.add("ok");
    $("#xp").textContent = xpTotal();
  }
  const api = {
    cfg: p.cfg || {}, acoes: $("#sim-acoes"), extra: $("#sim-extra"),
    ok() { if (r.ok) return; r.t += 1; r.ok = true; salvar(); sucesso(); },
    errar(d) {
      if (r.ok) return;
      r.t += 1; salvar();
      fb.innerHTML = `<div class="feedback erro"><strong>Ainda não.</strong><p>${esc(d || p.dica || "Continue experimentando.")}</p></div>`;
    },
    aviso(d) { if (!r.ok) fb.innerHTML = `<div class="feedback aviso"><p>${esc(d)}</p></div>`; }
  };
  SIMS[p.sim](alvo, api);
  const palco = alvo.querySelector(".sim-palco");
  if (palco) palco.insertAdjacentHTML("afterend", '<p class="sim-cel">Deslize o fundo da cena para os lados para ver tudo, ou vire o aparelho na horizontal. Toque em um objeto com contorno amarelo para arrastá-lo.</p>');
  const dica = botaoSim(api.acoes, "Ver dica", () => api.aviso(p.dica));
  dica.dataset.sim = "dica";
  botaoSim(api.acoes, "Reiniciar", () => { if (!r.ok) fb.innerHTML = ""; montarSim(); }).dataset.sim = "reiniciar";
  if (r.ok) sucesso();
}

/* =====================================================================
   INTERAÇÃO E NAVEGAÇÃO LIVRE
   ===================================================================== */
document.addEventListener("click", ev => {
  const alvo = ev.target.closest("button");
  if (!alvo) return;
  const m = modulo(ui.modulo);

  if (alvo.dataset.modulo) {
    ui = { modulo: alvo.dataset.modulo, etapa: null, q: null, ultimaErrada: null, revisao: false, explorar: false };
    render(); return;
  }
  if (alvo.dataset.etapa != null) {
    ui.etapa = +alvo.dataset.etapa; ui.q = 0; ui.ultimaErrada = null; ui.revisao = false; ui.explorar = false;
    render(); $(".etapa h1").scrollIntoView({ block: "start", behavior: "smooth" }); return;
  }
  if (alvo.dataset.irQ != null) {
    ui.q = +alvo.dataset.irQ; ui.ultimaErrada = null; ui.revisao = false;
    renderQuiz();
    const en = $("#enunciado"); if (en) en.focus({ preventScroll: true });
    $("#quiz").scrollIntoView({ block: "nearest", behavior: "smooth" });
    return;
  }
  if (alvo.dataset.opcao != null) { responder(m, +alvo.dataset.opcao); return; }

  const acao = alvo.dataset.acao;
  if (!acao) return;
  const e = m.etapas ? m.etapas[ui.etapa] : null;
  if (acao === "anterior") {
    const qAtual = ui.q ?? 0;
    if (qAtual > 0) {
      ui.q = qAtual - 1;
      ui.ultimaErrada = null;
      renderQuiz();
      const en = $("#enunciado"); if (en) en.focus({ preventScroll: true });
      $("#quiz").scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  } else if (acao === "proxima") {
    const qAtual = ui.q ?? 0;
    if (e && qAtual < e.perguntas.length - 1) {
      ui.q = qAtual + 1;
      ui.ultimaErrada = null;
      renderQuiz();
      const en = $("#enunciado"); if (en) en.focus({ preventScroll: true });
      $("#quiz").scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  } else if (acao === "concluir") {
    const st = estadoEtapa(e.id);
    st.fim = e.perguntas.every((_, i) => st.resp[i] && st.resp[i].ok);
    salvar(); ui.q = null; ui.ultimaErrada = null; ui.explorar = false; render();
    $("#quiz").scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else if (acao === "ir") {
    ui.etapa = +alvo.dataset.alvo; ui.q = 0; ui.ultimaErrada = null; ui.revisao = false; ui.explorar = false;
    render(); window.scrollTo({ top: 0, behavior: "smooth" });
  } else if (acao === "explorar") {
    ui.explorar = true; ui.revisao = false; ui.q = 0; renderQuiz();
  } else if (acao === "revisar") {
    ui.revisao = true; ui.explorar = false; renderQuiz();
  } else if (acao === "fechar-revisao") {
    ui.revisao = false; ui.explorar = false; renderQuiz();
  } else if (acao === "refazer") {
    progresso.etapas[e.id] = { resp: [], fim: false }; salvar();
    ui.q = 0; ui.ultimaErrada = null; ui.revisao = false; ui.explorar = false; render();
  } else if (acao === "recomecar") {
    if (!alvo.dataset.confirmar) {
      alvo.dataset.confirmar = "1";
      alvo.textContent = "Clique de novo para apagar seu progresso nesta guia";
      setTimeout(() => { if (alvo.isConnected) { delete alvo.dataset.confirmar; alvo.textContent = "Recomeçar esta trilha"; } }, 4000);
      return;
    }
    m.etapas.forEach(x => delete progresso.etapas[x.id]); salvar();
    ui.etapa = 0; ui.q = 0; ui.ultimaErrada = null; ui.revisao = false; ui.explorar = false; render();
  }
});

function responder(m, oi) {
  const e = m.etapas[ui.etapa];
  const st = estadoEtapa(e.id);
  const qAtual = ui.q ?? proximaAberta(e);
  ui.q = qAtual;
  const p = e.perguntas[qAtual];
  const r = st.resp[qAtual] || (st.resp[qAtual] = { t: 0, ok: false, erradas: [] });
  if (r.ok) return;
  r.t += 1;
  if (p.op[oi][1]) { r.ok = true; ui.ultimaErrada = null; }
  else { r.erradas = [...new Set([...(r.erradas || []), oi])]; ui.ultimaErrada = oi; }
  salvar();
  renderQuiz();
  if (r.ok) {
    const b = $('.rodape-quiz [data-acao="proxima"], .rodape-quiz [data-acao="concluir"]');
    if (b) b.focus({ preventScroll: true });
  } else {
    const prox = document.querySelector(".opcao:not(:disabled)");
    if (prox) prox.focus({ preventScroll: true });
  }
}

/* ---------- tema ---------- */
(function () {
  let salvo = null;
  try { salvo = localStorage.getItem("trilha-tema"); } catch (e) { /* ignora */ }
  if (salvo) document.documentElement.dataset.theme = salvo;
  $("#tema").addEventListener("click", () => {
    const escuroAgora = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    const novo = escuroAgora ? "light" : "dark";
    document.documentElement.dataset.theme = novo;
    try { localStorage.setItem("trilha-tema", novo); } catch (e) { /* ignora */ }
  });
})();

render();
</script>
